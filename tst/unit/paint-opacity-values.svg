<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32">
<!-- No red, and no seam within each column: fill-opacity and stroke-opacity
take numbers and percentages, are clamped to [0, 1] and inherit. -->
<rect width="64" height="32" fill="white"/>
<rect x="3" y="3" width="8" height="8" fill="red"/>
<rect x="2" y="2" width="10" height="10" fill="lime" fill-opacity="2"/>
<rect x="14" y="2" width="10" height="10" fill="lime"/>
<rect x="14" y="2" width="10" height="10" fill="red" fill-opacity="-1"/>
<rect x="26" y="2" width="10" height="5" fill="black" fill-opacity=".5"/>
<rect x="26" y="7" width="10" height="5" fill="black" fill-opacity="50%"/>
<g fill-opacity="25%"><rect x="38" y="2" width="10" height="5" fill="black"/></g>
<rect x="38" y="7" width="10" height="5" fill="#bfbfbf"/>
<rect x="50" y="2" width="10" height="5" fill="#808080"/>
<rect x="50" y="7" width="10" height="5" fill="black" style="fill-opacity: 0.5"/>
<rect x="3" y="19" width="8" height="8" fill="red"/>
<path d="M 7 18 V 28" stroke="lime" stroke-width="10" stroke-opacity="7"/>
<rect x="14" y="18" width="10" height="10" fill="lime"/>
<path d="M 19 18 V 28" stroke="red" stroke-width="10" stroke-opacity="-.5"/>
<path d="M 26 20.5 H 36" stroke="black" stroke-width="5" stroke-opacity=".5"/>
<path d="M 26 25.5 H 36" stroke="black" stroke-width="5" stroke-opacity="50%"/>
<g stroke-opacity=".25"><path d="M 38 20.5 H 48" stroke="black" stroke-width="5"/></g>
<rect x="38" y="23" width="10" height="5" fill="#bfbfbf"/>
</svg>
