<svg xmlns="http://www.w3.org/2000/svg" width="66" height="114">
<!-- Each lime square fills its black outline, and nothing red shows;
each square has a red fill attribute. Cascade layers of css-cascade-5: a
later layer beats an earlier one whatever their specificity, and for
important declarations the earlier one wins; layers are ordered as first
declared, by @layer statements, blocks or @import, which loads nothing
(D15) but places its layer, when it goes before every rule but @charset
and @layer statements; a sub-layer, named or dotted, goes before its
parent own rules; @layer { } makes a new anonymous layer each time; a
layer reopened keeps its place; what no layer holds is last, and a
presentation attribute below every author rule (D34); a CSS-wide keyword
is no layer name, and a statement with a bad name declares none. -->
<rect width="66" height="114" fill="white"/>
<style><![CDATA[
@layer a1, b1; @layer b1 { .c0 > .t { fill: lime } } @layer a1 { .c0 > rect.t.t { fill: red } }
@layer a5 { .c1 > .t { fill: red } } @layer b5 { .c1 > .t { fill: lime } } @layer a5 { .c1 > rect.t.t { fill: red } }
@layer a2 { .c2 > .t { fill: lime !important } } @layer b2 { .c2 > .t { fill: red !important } } .c2 > .t { fill: red !important }
.c3 > .t { fill: red } @layer v9 { .c3 > .t { fill: lime !important } }
@layer { .c4 > .t { fill: red } } @layer { .c4 > .t { fill: lime } }
@layer a3 { @layer b3 { .c5 > .t.t { fill: red } } .c5 > .t { fill: lime } }
@layer a4.b4 { .c6 > .t.t { fill: red } } @layer a4 { .c6 > .t { fill: lime } }
@layer y6 { .c7 > .t { fill: red } } @layer x6 { @layer y6 { .c7 > .t { fill: lime } } } @layer y6 { .c7 > rect.t.t { fill: red } }
@layer initial { .c8 > .t { fill: red !important } } .c8 > .t { fill: lime }
.c9 > .t { fill: lime } @layer z7 { .c9 > rect.t.t { fill: red } }
@layer w8 { .c10 > .t { fill: lime } }
@layer m11 { @media all { .c11 > .t { fill: lime } } }
@layer x10, y10 z10; @layer y10 { .c12 > .t { fill: red } } @layer x10 { .c12 > .t { fill: lime } }
@layer a20..b20, c20; @layer d20 { .c13 > .t { fill: red } } @layer c20 { .c13 > .t { fill: lime } }
]]></style><style>@import url(none.css) layer(i12); @layer j12 { .c14 > .t { fill: lime } } @layer i12 { .c14 > .t { fill: red } }</style><style>@import url(none.css) layer; @layer { .c15 > .t { fill: lime } }</style><style>@layer n13; @import "none.css" layer(m13); @layer m13 { .c16 > .t { fill: lime } } @layer n13 { .c16 > .t { fill: red } }</style><style>@layer q14 { .c17 > .t { fill: red } } @import url(none.css) layer(r14); @layer s14 { .c17 > .t { fill: red } } @layer r14 { .c17 > .t { fill: lime } }</style><style>@charset "x"; @import url(none.css) layer(u16); @layer v16 { .c18 > .t { fill: lime } } @layer u16 { .c18 > .t { fill: red } }</style><style>@import url(none.css; @layer t15 { .c19 > .t { fill: lime } }</style><style>@import foo layer(w17); @layer x17 { .c20 > .t { fill: red } } @layer w17 { .c20 > .t { fill: lime } }</style><style>@import url(none.css) layer(z19; @layer a19 { .c21 > .t { fill: lime } }</style><style>@import url(none.css) layer(e23) { } @layer f23 { .c22 > .t { fill: red } } @layer e23 { .c22 > .t { fill: lime } }</style><style>@import url(none.css); @layer y18 { .c23 > .t { fill: lime } }</style><style>@import url(none.css) print; .c24 > .t { fill: lime }</style><style>@import url(none.css) supports(display: grid) screen; .c25 > .t { fill: lime }</style>
