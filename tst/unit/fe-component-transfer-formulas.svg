<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- Each test runs on into the reference under it without a step.
feComponentTransfer on a colour at 0.6 opacity, not premultiplied: table,
discrete, linear and gamma with their defaults; of two feFuncR the last;
an empty or missing tableValues is identity; at one a table gives its
last value, discrete too, at zero its first. -->
<defs><filter id="t0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="0 .5 1"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues=".2 .8 .4 .6"/><feFuncA type="linear" slope=".5" intercept=".2"/></feComponentTransfer></filter><filter id="t1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="discrete" tableValues="0 .5 1"/><feFuncG type="discrete" tableValues=".9 .1"/><feFuncB type="discrete" tableValues=".2 .8 .4 .6"/></feComponentTransfer></filter><filter id="t2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.5" intercept="-.2"/><feFuncG type="linear" slope=".5"/><feFuncB type="linear" intercept=".3"/></feComponentTransfer></filter><filter id="t3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="gamma" amplitude="1.2" exponent="2" offset=".05"/><feFuncG type="gamma" exponent=".5"/><feFuncB type="gamma" amplitude=".5"/></feComponentTransfer></filter><filter id="t4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncR type="linear" slope=".5"/><feFuncG type="identity"/></feComponentTransfer></filter><filter id="t5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues=""/><feFuncG type="table"/><feFuncB type="discrete"/></feComponentTransfer></filter><filter id="t6" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues=".1 .3 .9"/><feFuncG type="discrete" tableValues=".1 .3 .9"/><feFuncB type="table" tableValues=".2 .7"/></feComponentTransfer></filter></defs>
<rect width="64" height="16" fill="white"/>
<rect x="2" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t0)"/><rect x="2" y="8" width="7" height="6" fill="#ccb262" fill-opacity="0.5"/>
<rect x="11" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t1)"/><rect x="11" y="8" width="7" height="6" fill="#ffe633" fill-opacity="0.6"/>
<rect x="20" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t2)"/><rect x="20" y="8" width="7" height="6" fill="#ff2666" fill-opacity="0.6"/>
<rect x="29" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t3)"/><rect x="29" y="8" width="7" height="6" fill="#d18c0d" fill-opacity="0.6"/>
<rect x="38" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t4)"/><rect x="38" y="8" width="7" height="6" fill="#664d1a" fill-opacity="0.6"/>
<rect x="47" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6" filter="url(#t5)"/><rect x="47" y="8" width="7" height="6" fill="#cc4d1a" fill-opacity="0.6"/>
<rect x="56" y="2" width="7" height="6" fill="#ff4d00" fill-opacity="0.6" filter="url(#t6)"/><rect x="56" y="8" width="7" height="6" fill="#e61a33" fill-opacity="0.6"/>
</svg>
