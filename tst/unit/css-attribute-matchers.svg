<svg xmlns="http://www.w3.org/2000/svg" width="66" height="26">
<!-- Each lime square fills its black outline, and nothing red shows. Attribute selectors: presence, equality, a whole word, a value or its prefix before a -, a prefix, a suffix, a substring; values compared exactly as XML has them unless an i flag, of either case, asks for ASCII case-insensitivity, which an s flag never does; no word, prefix, suffix or substring is empty or has white space; no name, no value, an unknown operator or flag, or a second value invalidates the selector. -->
<rect width="66" height="26" fill="white"/>
<style><![CDATA[
.c0 > [data-x] { fill: lime }
.c1 > [data-x=ab] { fill: lime }
.c2 > [data-x=AB] { fill: red } .c2 > .t { fill: lime }
.c3 > [data-x="AB" i] { fill: lime }
.c4 > [data-x="AB" I] { fill: lime }
.c5 > [data-x="AB"i] { fill: lime }
.c6 > [data-x="AB" s] { fill: red } .c6 > .t { fill: lime }
.c7 > [data-x="ab" q], .c7 > * { fill: red } .c7 > .t { fill: lime }
.c8 > [data-x~=CD i] { fill: lime }
.c9 > [data-x|=EN i] { fill: lime }
.c10 > [data-x|=EN i] { fill: lime }
.c11 > [data-x^=AB i] { fill: lime }
.c12 > [data-x$=BC i] { fill: lime }
.c13 > [data-x*=B i] { fill: lime }
.c14 > [data-x*=B i] { fill: red } .c14 > .t { fill: lime }
.c15 > [data-x~="a b"], .c15 > [data-x~=""], .c15 > [data-x^=""], .c15 > [data-x$=""], .c15 > [data-x*=""] { fill: red } .c15 > .t { fill: lime }
.c16 > [], .c16 > * { fill: red } .c16 > .t { fill: lime }
.c17 > [data-x=], .c17 > * { fill: red } .c17 > .t { fill: lime }
.c18 > [data-x%=a], .c18 > * { fill: red } .c18 > .t { fill: lime }
.c19 > [data-x="a" "b"], .c19 > * { fill: red } .c19 > .t { fill: lime }
.c20 > [ data-x = "a" ] { fill: lime }
.c21 > :link { fill: red } .c21 > .t { fill: lime }
]]></style>
<g class="c0" transform="translate(2 2)"><rect class="t" data-x="" width="6" height="6" fill="red"/></g>
<g class="c1" transform="translate(10 2)"><rect class="t" data-x="ab" width="6" height="6" fill="red"/></g>
