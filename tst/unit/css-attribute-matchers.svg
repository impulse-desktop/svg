<g class="c9" transform="translate(10 10)"><rect class="t" data-x="en-gb" width="6" height="6" fill="red"/></g>
<g class="c10" transform="translate(18 10)"><rect class="t" data-x="En" width="6" height="6" fill="red"/></g>
