<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" shape-rendering="crispEdges">
<!-- The same coverage rule applies inside a pattern. Each boundary
stroke is clipped to the tile, leaving a quarter-pixel strip after the
half-scale transform. Dropping those strips would erase the grid. -->
<defs>
<pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="scale(.5)">
<path d="M10 0H0V10" fill="none" stroke="black" stroke-width="1"/>
</pattern>
</defs>
<rect width="48" height="24" fill="white"/>
<rect width="30" height="15" fill="url(#grid)"/>
<path d="M34 5H44" fill="none" stroke="black" stroke-width=".5"/>
<path d="M34 11.25H44" fill="none" stroke="black" stroke-width="1"/>
</svg>
