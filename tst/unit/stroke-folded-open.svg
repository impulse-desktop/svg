<svg xmlns="http://www.w3.org/2000/svg" width="320" height="256">
<!-- A short open path can bend one way and then back, so its net signed
turn is small although its offset folds inside out. The nonzero outline
leaves a large opening. A wide stroke must keep that opening when the
endpoint tangents resume the same heading. Another tight path bends
around once, with its endpoint tangents across one another; the normal
sweep covers the cropped region within its very first cubic, so no hole
belongs there (D49). -->
