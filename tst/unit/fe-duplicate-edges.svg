<svg xmlns="http://www.w3.org/2000/svg" width="78" height="14">
<!-- Each yellow rect fills its black outline. Duplicated past its edge,
the input holds its colour there across the edge: where the edge cuts a
pixel, that pixel's colour is what the part inside holds (D48), so a
kernel of sum 1 or a blur over a flat colour leaves it flat up to its
antialiased edge. Chromium, librsvg and resvg draw the convolution so,
larger; a blur's edge mode they leave out. -->
<rect width="78" height="14" fill="white"/>
<filter id="d0" x="0" y="0" width="1" height="1"><feConvolveMatrix kernelMatrix="1 1 1 1 -7 1 1 1 1" edgeMode="duplicate"/></filter><rect x="2.5" y="2.5" width="14" height="9" fill="yellow" filter="url(#d0)"/>
<filter id="d1" x="0" y="0" width="1" height="1"><feConvolveMatrix kernelMatrix="1 1 1 1 -7 1 1 1 1" edgeMode="duplicate"/></filter><rect x="21.25" y="2.75" width="15.5" height="8.5" fill="yellow" filter="url(#d1)"/>
<filter id="d2" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="1.5" edgeMode="duplicate"/></filter><rect x="40.5" y="2.5" width="14" height="9" fill="yellow" filter="url(#d2)"/>
<filter id="d3" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="1.5" edgeMode="duplicate"/></filter><rect x="59.25" y="2.75" width="15.5" height="8.5" fill="yellow" filter="url(#d3)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2.5" y="2.5" width="14" height="9"/><rect x="21.25" y="2.75" width="15.5" height="8.5"/><rect x="40.5" y="2.5" width="14" height="9"/><rect x="59.25" y="2.75" width="15.5" height="8.5"/></g>
</svg>
