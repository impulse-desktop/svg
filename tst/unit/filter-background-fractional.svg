<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60">
<!-- BackgroundImage and BackgroundAlpha retain the exact fractional
filter-frame coverage when their pixels are copied or blended. Literal
half-alpha PNG input, rectangle/pixel intersections and source-over
provide the independent reference. A shifted input, two readers, both
colour spaces and a subpixel frame guard against applying that coverage
twice. -->
<svg x="2" y="2" width="16" height="16"><defs><filter id="f0" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feOffset in="BackgroundImage"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f0)"/></svg>
<svg x="22" y="2" width="16" height="16"><defs><filter id="f1" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feOffset in="BackgroundAlpha"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f1)"/></svg>
<svg x="42" y="2" width="16" height="16"><defs><filter id="f2" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feBlend in2="BackgroundImage" mode="screen"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="none" filter="url(#f2)"/></svg>
<svg x="62" y="2" width="16" height="16"><defs><filter id="f3" filterUnits="userSpaceOnUse" x="2" y="2" width="10" height="8"><feOffset in="BackgroundImage"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2" y="2" width="10" height="8" fill="red" filter="url(#f3)"/></svg>
<svg x="2" y="22" width="16" height="16"><defs><filter id="f4" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feOffset in="BackgroundImage" dx="1"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f4)"/></svg>
<svg x="22" y="22" width="16" height="16"><defs><filter id="f5" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feOffset in="BackgroundImage" result="image"/><feOffset in="BackgroundAlpha" result="alpha"/><feComposite in="image" in2="alpha" operator="in"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f5)"/></svg>
<svg x="42" y="22" width="16" height="16"><defs><filter id="f6" filterUnits="userSpaceOnUse" x="5.25" y="6.5" width="0.5" height="0.25"><feOffset in="BackgroundImage"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="5.25" y="6.5" width="0.5" height="0.25" fill="red" filter="url(#f6)"/></svg>
<svg x="62" y="22" width="16" height="16"><defs><filter id="f7" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feOffset in="BackgroundImage" color-interpolation-filters="linearRGB" result="linear"/><feOffset in="BackgroundImage" color-interpolation-filters="sRGB" result="srgb"/><feComposite in="linear" in2="srgb" operator="arithmetic" k2=".5" k3=".5" color-interpolation-filters="sRGB"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGUlEQVR42mNQ2O/QQAlmGDVg1IBRA4aLAQDc5p8Q15h62AAAAABJRU5ErkJggg=="/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f7)"/></svg>
<svg x="2" y="42" width="16" height="16"><defs><filter id="f8" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feFlood flood-color="red"/><feComposite in2="BackgroundAlpha" operator="in"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f8)"/></svg>
<svg x="22" y="42" width="16" height="16"><defs><filter id="f9" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feGaussianBlur in="BackgroundImage" stdDeviation=".5"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f9)"/></svg>
<svg x="42" y="42" width="16" height="16"><defs><filter id="f10" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="9.5" height="8.25"><feGaussianBlur in="BackgroundImage" stdDeviation=".5"/><feComposite in2="BackgroundAlpha" operator="in"/></filter></defs><image width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAGElEQVR42mNg+M/QQBEeNWDUgFEDhosBAOkXfxAI+gHcAAAAAElFTkSuQmCC"/><rect x="2.25" y="2.5" width="9.5" height="8.25" fill="red" filter="url(#f10)"/></svg>
