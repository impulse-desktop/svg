<svg xmlns="http://www.w3.org/2000/svg" width="70" height="24">
<!-- Each lime ring fills the space between its black circles; the last
cell holds nothing. A closed subpath's stroke is its outer and inner
offsets filled nonzero, as every renderer and Inkscape draw it (D49): a
circle of radius 3 stroked 10 wide leaves a hole of radius 2 where its
inner offset has turned inside out, and its ring runs out to 8, as a
circle element and as path data; a circle of radius 2 stroked 40 wide
leaves a hole of 18, wider than its viewport, and nothing shows. -->
<rect width="70" height="24" fill="white"/>
<circle cx="12" cy="12" r="3" fill="none" stroke="lime" stroke-width="10"/>
<path d="M 38 12 A 3 3 0 0 1 32 12 A 3 3 0 0 1 38 12 Z" fill="none" stroke="lime" stroke-width="10"/>
<svg x="48" y="2" width="20" height="20"><circle cx="10" cy="10" r="2" fill="none" stroke="red" stroke-width="40"/></svg>
<g fill="none" stroke="black" stroke-width=".25"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><circle cx="35" cy="12" r="8"/><circle cx="35" cy="12" r="2"/><rect x="48" y="2" width="20" height="20"/></g>
</svg>
