<svg xmlns="http://www.w3.org/2000/svg" width="93" height="24">
<!-- Each lime ring fills the space between its black circles; the last
cell holds nothing. A small subpath's stroke keeps its inner offset when
it turns inside out (D49): a circle of radius 3 stroked 10 wide leaves a
hole of radius 2, both as a circle element and as closed or returning
open path data. A circle of radius 2 stroked 40 wide leaves a hole of
18, wider than its viewport, and nothing shows. -->
<rect width="93" height="24" fill="white"/>
<circle cx="12" cy="12" r="3" fill="none" stroke="lime" stroke-width="10"/>
<path d="M 38 12 A 3 3 0 0 1 32 12 A 3 3 0 0 1 38 12 Z" fill="none" stroke="lime" stroke-width="10"/>
<path d="M 61 12 A 3 3 0 0 1 55 12 A 3 3 0 0 1 61 12" fill="none" stroke="lime" stroke-width="10"/>
<svg x="71" y="2" width="20" height="20"><circle cx="10" cy="10" r="2" fill="none" stroke="red" stroke-width="40"/></svg>
<g fill="none" stroke="black" stroke-width=".25"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><circle cx="35" cy="12" r="8"/><circle cx="35" cy="12" r="2"/><circle cx="58" cy="12" r="8"/><circle cx="58" cy="12" r="2"/><rect x="71" y="2" width="20" height="20"/></g>
</svg>
