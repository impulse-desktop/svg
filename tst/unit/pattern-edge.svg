<rect x="0" width="8" height="8" fill="url(#a)"/>
<rect x="8" width="8" height="8" fill="url(#b)"/>
<rect x="16" width="8" height="8" fill="url(#c) gray"/>
<rect x="24" width="8" height="8" fill="url(#d)"/>
<rect x="32" width="8" height="8" fill="url(#e)"/>
<rect x="40" width="8" height="8" fill="url(#g)"/>
<rect x="0" y="8" width="8" height="8" fill="url(#h)"/>
<rect x="8" y="8" width="8" height="8" fill="url(#i)"/>
<rect x="16" y="8" width="8" height="8" fill="url(#j)"/>
<rect x="24" y="8" width="8" height="8" fill="url(#k) teal"/>
<line x1="32" y1="12" x2="48" y2="12" stroke="url(#d) olive" stroke-width="2"/>
<rect x="32" y="8" width="8" height="8" fill="url(#a)" transform="scale(1 0)"/>
