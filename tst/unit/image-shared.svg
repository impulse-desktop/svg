<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64">
<defs>
<image id="tile" width="16" height="16" xlink:href="data:image/png;base64,"/>
<pattern id="cells" patternUnits="userSpaceOnUse" width="16" height="16">
<use xlink:href="#tile"/>
</pattern>
<image id="again" width="16" height="16" xlink:href="data:image/png;base64,"/>
</defs>
<rect width="30" height="14" fill="url(#cells)"/>
<rect y="16" width="30" height="14" fill="url(#cells)"/>
<use xlink:href="#tile" transform="translate(34 0) scale(0.25)"/>
<use xlink:href="#tile" transform="translate(40 0) scale(0.25)"/>
<use xlink:href="#tile" transform="translate(34 8) scale(0.5)"/>
<use xlink:href="#tile" transform="translate(44 8) scale(1.25)"/>
<use xlink:href="#tile" transform="translate(34 32) scale(1.5)"/>
<use xlink:href="#again" transform="translate(4 36) scale(0.25)"/>
<use xlink:href="#again" transform="translate(8 44) scale(1)"/>
<rect x="12" y="52" width="8" height="8" fill="url(#cells)"/>
</svg>
