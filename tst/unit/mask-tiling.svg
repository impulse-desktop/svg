<!-- Each test runs on into the reference under it without a step: a mask of
tiles over lime, and under it the tiles as CSS Backgrounds lays them out,
drawn as lime rectangles: repeat, repeat-x and -y, two keywords, space,
space with room for one, round; positions of one, two and four components,
three being no <position> and so no mask, and percentages of the room
left; natural size, contain, cover, one length with the ratio, a
percentage, a size of zero, round with an auto side. -->
