<svg xmlns="http://www.w3.org/2000/svg" width="102" height="530">
<!-- Each test runs on into the reference under it without a step: a
mask of tiles over lime, and under it the tiles as CSS Backgrounds lays
them out, drawn as lime rectangles: repeat, repeat-x and -y, two
keywords, space, space with room for one, round; positions of one, two
and four components, keywords in either order, an offset inward from its
edge, three components being no <position> and so no mask, and
percentages of the room left; natural size, contain, cover, one length
with the ratio, a percentage, a size of zero, a negative one invalid,
round with an auto side; mask-origin and mask-clip by box, where an SVG
element's border-box is its fill box for the origin, its stroke box for
the clip, as CSS Masking has it. A 3 by 2 black image and a black
gradient make the tiles. -->
<rect width="102" height="530" fill="white"/>
