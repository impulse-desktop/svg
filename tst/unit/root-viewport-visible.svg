<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" overflow="visible" transform="translate(16)">
<!-- Visible overflow keeps the part of the red bar outside the original
root viewport when the transform moves it onto the output canvas. -->
<rect x="-16" width="32" height="16" fill="red"/>
<rect x="20" width="8" height="16" fill="green"/>
</svg>
