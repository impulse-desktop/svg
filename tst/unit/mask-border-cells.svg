<svg xmlns="http://www.w3.org/2000/svg" width="122" height="259">
<!-- Each lime drawing fills its black outline, and nothing red shows;
each is a 16 by 12 rect masked by a mask border. A transparent border
image hides its border area and leaves the middle, which is unmasked
without fill and the image's with it, fill before or after the slice's
numbers but alone or twice invalid; the width in px, a percentage of the
area, a number times the border width, 0 for SVG, or auto, the slice's
size, a gradient having none, so the border width again; the outset
grows the area, its values copied as margin's; the repeat keywords, the
second the first if none; the mode alpha unless luminance, mask-mode and
mask-type aside; an image that does not load counts but masks nothing; a
mask image masks too; the shorthand resets what it leaves out, and an
empty one, as written or after var(), is invalid; an empty slice after
var() is its initial 0, no fill. -->
<rect width="122" height="259" fill="white"/>
<rect x="2" y="2" width="16" height="12" fill="lime" style="mask-border: none"/><rect x="22" y="2" width="16" height="12" fill="lime" style="mask-border-source: none; mask-border-width: 4px"/>
<rect x="2" y="18" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px"/><rect x="22" y="18" width="16" height="12" fill="red" style="mask-border: linear-gradient(transparent, transparent) 30% fill / 4px"/><rect x="42" y="18" width="16" height="12" fill="red" style="mask-border: linear-gradient(transparent, transparent) fill 30% / 4px"/><rect x="62" y="18" width="16" height="12" fill="red" style="mask-border: linear-gradient(transparent, transparent) 30%/**/fill / 4px"/>
<rect x="2" y="34" width="16" height="12" fill="red" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-border-slice: fill 30%"/><rect x="22" y="34" width="16" height="12" fill="red" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-border-slice: 30% fill"/><rect x="42" y="34" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-border-slice: fill"/>
<rect x="2" y="50" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) fill / 4px"/><rect x="22" y="50" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% fill fill / 4px"/><rect x="42" y="50" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-border: "/>
<rect x="2" y="66" width="16" height="12" fill="lime" style="--e: ; mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-border: var(--e)"/><rect x="22" y="66" width="16" height="12" fill="lime" style="--e: ; mask-border: linear-gradient(transparent, transparent) 30% fill / 4px; mask-border-slice: var(--e)"/>
<rect x="2" y="82" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 2px"/><rect x="22" y="82" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 2px 4px"/>
<rect x="2" y="98" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 25%"/>
<rect x="2" y="114" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 2"/>
<rect x="2" y="130" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30%"/><rect x="22" y="130" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / auto"/>
<rect x="2" y="146" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 3px / 1px"/><rect x="22" y="146" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 3px / 1px 0"/><rect x="42" y="146" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 3px / 0 0 1px"/>
<rect x="2" y="162" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 3px / -1px"/>
<rect x="2" y="178" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px round"/><rect x="22" y="178" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px stretch space"/><rect x="42" y="178" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px repeat"/>
<rect x="2" y="194" width="16" height="12" fill="lime" style="mask-border: linear-gradient(black, black) 30% / 4px"/><rect x="22" y="194" width="16" height="12" fill="lime" style="mask-border: linear-gradient(black, black) 30% / 4px luminance"/><rect x="42" y="194" width="16" height="12" fill="lime" style="mask-border: linear-gradient(black, black) 30% / 4px; mask-mode: luminance"/>
<rect x="2" y="210" width="16" height="12" fill="lime" style="mask-border: url(data:image/png;base64,AAAA) 30% / 4px"/>
<rect x="2" y="226" width="16" height="12" fill="lime" style="mask-border: linear-gradient(transparent, transparent) 30% / 4px; mask-image: linear-gradient(to right, black 50%, transparent 50%)"/>
<rect x="2" y="242" width="16" height="12" fill="lime" style="mask-border-slice: 30%; mask-border-width: 4px; mask-border: linear-gradient(transparent, transparent)"/>
