<svg x="48" y="0" width="16" height="16"><defs><filter id="b3" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter></defs><g transform="translate(8 8) scale(1)" filter="url(#b3)"><g transform="matrix(1 0 1 1 0 0)"><circle r="2" fill="none"/></g></g></svg>
