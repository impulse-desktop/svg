<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<!-- Object bounding boxes enclose the transformed descendant geometry
tightly in the referencing group coordinate system, rather than
repeatedly mapping local axis-aligned rectangles. Independent affine
circle/ellipse supports, a cubic polynomial and exact rectangular pixel
areas check rotations, shear, cancelling nested transforms, paint-
independent geometry and coordinate-space controls. -->
<svg x="0" y="0" width="16" height="16"><defs><filter id="b0" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter></defs><g transform="translate(8 8) scale(1)" filter="url(#b0)"><circle r="2" fill="none"/></g></svg>
<svg x="16" y="0" width="16" height="16"><defs><filter id="b1" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter></defs><g transform="translate(8 8) scale(1)" filter="url(#b1)"><g transform="rotate(45)"><circle r="2" fill="none"/></g></g></svg>
