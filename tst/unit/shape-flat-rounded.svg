<svg xmlns="http://www.w3.org/2000/svg" width="100" height="200">
<!-- Positive thin rounded rectangles retain their stroke. SVG2 clamps
each radius independently to half the corresponding extent. The limiting
stroke is a single filled capsule. Exact zero extents draw nothing.
Translation from a large coordinate preserves the positive extent. All
coordinates and extents are authored independently of rendered output.
-->
