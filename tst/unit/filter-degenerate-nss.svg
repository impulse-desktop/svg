<g transform="translate(0 0)"><g transform="translate(15 15) scale(1 1) translate(-15 -15)"><g filter="url(#box)"><path d="M11 15L19 15" fill="none" stroke="#207fc0" stroke-width="4" stroke-linecap="butt" vector-effect="non-scaling-stroke"/></g></g></g>
