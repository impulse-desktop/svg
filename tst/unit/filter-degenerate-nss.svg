<svg xmlns="http://www.w3.org/2000/svg" width="180" height="90">
<!-- Object-bounding-box filter or primitive units on zero-width or
zero-height geometry ignore the filter, including parent groups and non-
scaling round caps. Plain filled host-space bands and unfiltered host-
space round strokes check transforms; positive-box and user-space
controls still apply a green flood. Ordinary tolerance. -->
