<g transform="translate(34 34)"><path d="M4 8V0" fill="none" stroke="black" stroke-width="8" stroke-dasharray="0.03125 0.96875" stroke-dashoffset="0"/></g>
<g transform="translate(66 34)"><path d="M0 4H8M4 0V8" fill="none" stroke="black" stroke-width="8" stroke-dasharray="0.03125 0.96875" stroke-dashoffset="0"/></g>
<g transform="translate(98 34)"><path d="M0 4H8" fill="none" stroke="black" stroke-width="8" stroke-dasharray="1 0" stroke-dashoffset="0"/></g>
