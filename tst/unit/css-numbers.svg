<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50">
<!-- Each lime bar fills its black outline, and nothing red shows; every
bar is 12px. A number is an integer, or digits with a point and more
digits, signed or not, with an exponent of e or E signed or not; a point
with no digit after it, an exponent with no digits or a fraction is no
number. A coordinate may be negative. A number beyond the floats' range
is the largest one, which fills its cell; one too small is 0. Below,
each turbulence is drawn with the integer of octaves under it: an
integer signed or not, a calc() rounded half up, an integer past the
integers' range the largest, a number with a fraction no integer, so the
initial 1. -->
<rect width="100" height="50" fill="white"/>
<rect x="2" y="2" width="12" height="2" fill="lime"/><rect x="18" y="2" width="+12" height="2" fill="lime"/><rect x="34" y="2" width="1.2e1" height="2" fill="lime"/><rect x="50" y="2" width="120E-1" height="2" fill="lime"/><rect x="66" y="2" width=".12e+2" height="2" fill="lime"/><rect x="82" y="2" width="12.0" height="2" fill="lime"/><rect x="2" y="5" width="1200e-2" height="2" fill="lime"/><rect x="18" y="5" width="12e0" height="2" fill="lime"/><rect x="34" y="5" width="+1.2E+1" height="2" fill="lime"/>
<rect x="2" y="8" width="12." height="2" fill="red"/><rect x="18" y="8" width="12.e0" height="2" fill="red"/><rect x="34" y="8" width="1.-2" height="2" fill="red"/><rect x="50" y="8" width=".e1" height="2" fill="red"/><rect x="66" y="8" width="1e" height="2" fill="red"/><rect x="82" y="8" width="1e1.5" height="2" fill="red"/><rect x="2" y="11" width="+-12" height="2" fill="red"/><rect x="18" y="11" width="1.2.3" height="2" fill="red"/>
<rect x="2" y="14" width="12" height="2" fill="lime" transform="translate(4)" style="x: calc(2px - 4px)"/><g transform="translate(18 14)"><rect x="-6" y="-1" width="12" height="2" fill="lime" transform="translate(6 1)"/></g>
<svg x="2" y="17" width="12" height="2"><rect width="1e39" height="2" fill="lime"/></svg><svg x="18" y="17" width="12" height="2"><rect width="1e10000" height="2" fill="lime"/></svg><svg x="34" y="17" width="12" height="2"><rect width="3.5e38" height="2" fill="lime"/></svg><rect x="50" y="17" width="1e-50" height="2" fill="red"/>
<filter id="t1" filterUnits="userSpaceOnUse" x="2" y="21" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="+2" seed="1"/></filter><rect x="2" y="21" width="12" height="6" filter="url(#t1)"/><filter id="t2" filterUnits="userSpaceOnUse" x="18" y="21" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="-0" seed="2"/></filter><rect x="18" y="21" width="12" height="6" filter="url(#t2)"/><filter id="t3" filterUnits="userSpaceOnUse" x="34" y="21" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="02" seed="3"/></filter><rect x="34" y="21" width="12" height="6" filter="url(#t3)"/>
<filter id="t4" filterUnits="userSpaceOnUse" x="2" y="28" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="calc(1.5)" seed="4"/></filter><rect x="2" y="28" width="12" height="6" filter="url(#t4)"/><filter id="t5" filterUnits="userSpaceOnUse" x="18" y="28" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="calc(2.5 - 1)" seed="5"/></filter><rect x="18" y="28" width="12" height="6" filter="url(#t5)"/><filter id="t6" filterUnits="userSpaceOnUse" x="34" y="28" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="calc(-0.5)" seed="6"/></filter><rect x="34" y="28" width="12" height="6" filter="url(#t6)"/>
<filter id="t7" filterUnits="userSpaceOnUse" x="2" y="35" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="2.0" seed="7"/></filter><rect x="2" y="35" width="12" height="6" filter="url(#t7)"/><filter id="t8" filterUnits="userSpaceOnUse" x="18" y="35" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="2e0" seed="8"/></filter><rect x="18" y="35" width="12" height="6" filter="url(#t8)"/><filter id="t9" filterUnits="userSpaceOnUse" x="34" y="35" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="2.5" seed="9"/></filter><rect x="34" y="35" width="12" height="6" filter="url(#t9)"/>
<filter id="t10" filterUnits="userSpaceOnUse" x="2" y="42" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="99999999999" seed="10"/></filter><rect x="2" y="42" width="12" height="6" filter="url(#t10)"/><filter id="t11" filterUnits="userSpaceOnUse" x="18" y="42" width="12" height="6"><feTurbulence baseFrequency=".3" numOctaves="-99999999999" seed="11"/></filter><rect x="18" y="42" width="12" height="6" filter="url(#t11)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="12" height="2"/><rect x="18" y="2" width="12" height="2"/><rect x="34" y="2" width="12" height="2"/><rect x="50" y="2" width="12" height="2"/><rect x="66" y="2" width="12" height="2"/><rect x="82" y="2" width="12" height="2"/><rect x="2" y="5" width="12" height="2"/><rect x="18" y="5" width="12" height="2"/><rect x="34" y="5" width="12" height="2"/><rect x="2" y="14" width="12" height="2"/><rect x="18" y="14" width="12" height="2"/><rect x="2" y="17" width="12" height="2"/><rect x="18" y="17" width="12" height="2"/><rect x="34" y="17" width="12" height="2"/></g>
</svg>
