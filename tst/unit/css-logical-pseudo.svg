<svg xmlns="http://www.w3.org/2000/svg" width="66" height="42">
<!-- Each lime square fills its black outline, and nothing red shows. :is() and :where() take a forgiving selector list, a selector they cannot read dropped and an empty list matching nothing; :where() adds no specificity, and :is(), :not() and :has() that of their most specific argument, :nth-child() of S its own and that of S. :not() takes a list of complex selectors, an invalid or empty one invalidating it, and matches what none of them does. :has() takes relative selectors, a descendant one, or one after a >, + or ~, from the element, and matches when one matches an element it reaches; :has() inside :has() and a pseudo-element in any of them are invalid. -->
<rect width="66" height="42" fill="white"/>
<style><![CDATA[
.c0 > :is(rect, :unknown) { fill: lime }
.c1 > :is(.t) { fill: lime }
.c2 > :is() { fill: red } .c2 > .t { fill: lime }
.c3 > :is(::before, .t) { fill: lime }
.c4 > :where(.t, :unknown) { fill: lime }
.c5 > :where(#x, .t) { fill: red } .c5 > rect { fill: lime }
.c6 > :is(#x, .t) { fill: lime } .c6 > rect.t { fill: red }
.c7 > :not(g) { fill: lime }
.c8 > :not(g, circle) { fill: lime }
.c9 > :not(.t g) { fill: lime }
.c10 > :not(:unknown), .c10 > * { fill: red } .c10 > .t { fill: lime }
.c11 > :not(), .c11 > * { fill: red } .c11 > .t { fill: lime }
.c12 > :not(::before), .c12 > * { fill: red } .c12 > .t { fill: lime }
.c13 > :not(circle > .t) { fill: lime }
.c14 > :not(#x, .t) { fill: red } .c14 > .t { fill: lime } .c14 > :not(#x):not(g) { fill: lime }
.c15 > :has(rect) { fill: red } .c15 > rect:has(g) { fill: red } .c15 > .t { fill: lime }
.c16:has(> .t) > .t { fill: lime }
.c17:has(> g > .t) > g > .t { fill: lime }
.c18 > .t:has(+ g) { fill: lime }
.c19 > .t:has(~ circle) { fill: lime }
.c20 > .t:has(+ circle) { fill: red } .c20 > .t { fill: lime }
.c21:has(rect.t) .t { fill: lime }
.c22:has(:has(.t)), .c22 > * { fill: red } .c22 > .t { fill: lime }
.c23:has(::before), .c23 > * { fill: red } .c23 > .t { fill: lime }
.c24:has(> circle, > .t) > .t { fill: lime }
.c25 > .t:not(:has(circle)) { fill: lime }
.c26 > :is(.t:first-child, g + .t) { fill: lime }
.c27 > :IS(.t) { fill: lime }
.c28 > :not(#x) { fill: lime } .c28 > rect.t { fill: red }
.c29 > :not(.a .b) { fill: lime } .c29 > rect.t { fill: red }
.c30 > .t:has(+ #x) { fill: lime } .c30 > rect.t { fill: red }
.c31 > :nth-child(1 of .t) { fill: lime } .c31 > rect.t { fill: red }
.c32 > :not(:is(:foo), g) { fill: lime }
]]></style>
<g class="c0" transform="translate(2 2)"><rect class="t" width="6" height="6" fill="red"/></g>
