<svg xmlns="http://www.w3.org/2000/svg" width="122" height="270">
<!-- Each lime drawing fills its black outline, and nothing red shows.
clip cuts an svg viewport and a pattern's tiles to rect(top, right,
bottom, left), each side's offset from the box's top or left edge,
negative ones past it, auto the box's own edge; auto clips nothing; a
group is no viewport, so clip does nothing there; commas or none, not a
mix; clip is a presentation attribute, whose lengths may be plain
numbers, as in a declaration too (D43); a rect whose bottom is above its
top, or right left of its left, clips everything; a symbol's instance
and a mask are cut too. -->
<rect width="122" height="270" fill="white"/>
<svg x="6" y="2" width="16" height="16" overflow="visible" style="clip: rect(2px, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><pattern id="p30" x="30" y="2" width="8" height="8" patternUnits="userSpaceOnUse" style="clip: rect(auto, 6px, 6px, 1px)"><rect width="8" height="8" fill="lime"/></pattern><rect x="30" y="2" width="16" height="16" fill="url(#p30)"/><g style="clip: rect(0, 0, 0, 0)"><rect x="54" y="2" width="16" height="16" fill="lime"/></g>
<svg x="6" y="26" width="16" height="16" overflow="visible" style="clip: auto"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="26" width="16" height="16" overflow="visible" style="clip: rect(auto, auto, auto, auto)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="50" width="16" height="16" overflow="visible" style="clip: rect(-2px, 18px, 18px, -2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="50" width="16" height="16" overflow="visible" style="clip: rect(4px, 12px, 8px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="74" width="16" height="16" overflow="visible" style="clip: rect(auto, 10px, auto, 4px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="74" width="16" height="16" overflow="visible" style="clip: rect(3px, auto, 12px, auto)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="98" width="16" height="16" overflow="visible" style="clip: rect(2px, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="98" width="16" height="16" overflow="visible" style="clip: rect(2px 14px 14px 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="54" y="98" width="16" height="16" overflow="visible" style="clip: rect(2px, 14px 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="78" y="98" width="16" height="16" overflow="visible" style="clip: rect(2px 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="102" y="98" width="16" height="16" overflow="visible" style="clip: rect(,2px, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="6" y="122" width="16" height="16" overflow="visible" style="clip: rect(2px, 14px, 14px, 2px,)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="122" width="16" height="16" overflow="visible" style="clip: rect(2px,, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="146" width="16" height="16" overflow="visible" clip="rect(2px, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="170" width="16" height="16" overflow="visible" clip="rect(2, 14, 14, 2)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="170" width="16" height="16" overflow="visible" style="clip: rect(2, 14, 14, 2)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="54" y="170" width="16" height="16" overflow="visible" style="clip: rect(0, 14px, 14px, 0)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<svg x="6" y="194" width="16" height="16" overflow="visible" style="clip: rect(5px, 4px, 3px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg><svg x="30" y="194" width="16" height="16" overflow="visible" style="clip: rect(2px, 4px, 14px, 6px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></svg>
<symbol id="s6" overflow="visible" style="clip: rect(2px, 14px, 14px, 2px)"><rect x="-4" y="-4" width="24" height="24" fill="lime"/></symbol><use href="#s6" x="6" y="218" width="16" height="16"/>
<mask id="k6" maskUnits="userSpaceOnUse" x="6" y="242" width="16" height="16" style="clip: rect(2px, 14px, 14px, 2px)"><rect x="6" y="242" width="16" height="16" fill="white"/></mask><rect x="6" y="242" width="16" height="16" fill="lime" mask="url(#k6)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="8" y="4" width="12" height="12"/><rect x="31" y="2" width="5" height="6"/><rect x="39" y="2" width="5" height="6"/><rect x="31" y="10" width="5" height="6"/><rect x="39" y="10" width="5" height="6"/><rect x="54" y="2" width="16" height="16"/><rect x="2" y="22" width="24" height="24"/><rect x="30" y="26" width="16" height="16"/><rect x="4" y="48" width="20" height="20"/><rect x="32" y="54" width="10" height="4"/><rect x="10" y="74" width="6" height="16"/><rect x="30" y="77" width="16" height="9"/><rect x="8" y="100" width="12" height="12"/><rect x="32" y="100" width="12" height="12"/><rect x="50" y="94" width="24" height="24"/><rect x="74" y="94" width="24" height="24"/><rect x="98" y="94" width="24" height="24"/><rect x="2" y="118" width="24" height="24"/><rect x="26" y="118" width="24" height="24"/><rect x="8" y="148" width="12" height="12"/><rect x="8" y="172" width="12" height="12"/><rect x="32" y="172" width="12" height="12"/><rect x="54" y="170" width="14" height="14"/><rect x="8" y="220" width="12" height="12"/><rect x="8" y="244" width="12" height="12"/></g>
</svg>
