<svg xmlns="http://www.w3.org/2000/svg" width="130" height="266">
<!-- Each drawing matches its plain twin in the expected drawing. In a
3D rendering context, a g with transform-style preserve-3d, 3D
transformed elements are planes that cross and hide one another by their
z, not their order, and planes in one plane keep their order; a g with
preserve-3d inside one extends it, a flat one flattens what it holds
into its own plane. backface-visibility goes by the matrix accumulated
through the context, for an element of no plane of its own the plane's;
opacity, isolation, filter, clip-path, clip, mask, mask-border, mix-
blend-mode and a viewport's hidden overflow flatten a preserve-3d, a
mask-image of none does not; a clipPath, mask or pattern flattens what
it holds; vector-effect does nothing in a context, of a shape too. Only
what of a plane is in front of the eye draws. The perspective property
puts its children, not deeper ones, in perspective about perspective-
origin, the reference box's centre unless given, of the box transform-
box names; none puts none, below a px is a px; a value that is none of
these is dropped, and attributes of their names do nothing. transform-
origin's third value moves the origin along z. -->
