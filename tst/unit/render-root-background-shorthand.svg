<svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" style="background-color: red; background: url(#none) no-repeat white">
<!-- The background shorthand sets the canvas's colour from its final
layer: white, past an image and a repeat, over an earlier red
background-color. -->
<rect x="8" width="8" height="8" fill="lime"/>
</svg>
