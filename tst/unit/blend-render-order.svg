<svg xmlns="http://www.w3.org/2000/svg" width="48" height="16">
<!-- The lime drawing fills its black outline; each other test runs on
into the reference under it without a step. A filter applies before the
clip, so the clip cuts the shifted drawing; a filter's colour, then a
mask or opacity, apply before the blend, which mixes only what they
leave over the backdrop. -->
<defs><filter id="o" filterUnits="userSpaceOnUse" x="0" y="0" width="48" height="16"><feOffset dx="4"/></filter>
<clipPath id="c"><rect x="4" y="2" width="6" height="12"/></clipPath>
<filter id="f" x="0" y="0" width="1" height="1"><feFlood flood-color="#cc4d1a"/></filter>
<mask id="h"><rect width="48" height="16" fill="white" fill-opacity=".5"/></mask></defs>
<rect x="0" y="2" width="8" height="12" fill="lime" filter="url(#o)" clip-path="url(#c)"/>
<rect x="16" y="2" width="8" height="6" fill="#3399e6"/><rect x="16" y="2" width="8" height="6" fill="lime" filter="url(#f)" style="mix-blend-mode: multiply"/><rect x="16" y="8" width="8" height="6" fill="#292e17"/>
<rect x="26" y="2" width="8" height="6" fill="#3399e6"/><rect x="26" y="2" width="8" height="6" fill="#cc4d1a" mask="url(#h)" style="mix-blend-mode: multiply"/><rect x="26" y="8" width="8" height="6" fill="#2e647f"/>
<rect x="36" y="2" width="8" height="6" fill="#3399e6"/><rect x="36" y="2" width="8" height="6" fill="#cc4d1a" opacity=".5" style="mix-blend-mode: multiply"/><rect x="36" y="8" width="8" height="6" fill="#2e647f"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="4" y="2" width="6" height="12"/></g>
</svg>
