<!-- Each lime stroke follows the same path spelled out in black; no red.
Numbers end at a sign or a second point; a path draws up to the command in
error, and a command short of a number up to its last whole segment; a
first relative moveto is absolute; after a closepath the next command starts
at the subpath's start; S and T reflect the last control point, or take the
current point after other commands; an arc of a zero radius is a line, of a
negative one its absolute value, too small for its ends scaled up, ending
where it starts left out; an odd number in points is dropped; a line is
never filled. -->
