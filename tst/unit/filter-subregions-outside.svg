<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
<filter id="a" primitiveUnits="userSpaceOnUse" x="0" y="0" width="16" height="16" filterUnits="userSpaceOnUse">
<feGaussianBlur stdDeviation="1" y="100" height="5"/>
<feMorphology radius="1" y="100" height="5"/>
<feOffset y="100" height="5"/>
</filter>
<filter id="t" primitiveUnits="userSpaceOnUse" x="0" y="0" width="16" height="16" filterUnits="userSpaceOnUse">
<feFlood flood-color="teal" x="0" y="0" width="4" height="100" result="tall"/>
<feTile in="tall" result="a"/>
<feFlood flood-color="navy" x="0.2" y="0" width="0.5" height="4" result="thin"/>
<feTile in="thin" result="b"/>
<feFlood flood-color="gold" x="0" y="0.2" width="4" height="0.5" result="flat"/>
<feTile in="flat" result="c"/>
<feFlood x="100" y="0" width="5" height="5" result="e"/>
<feConvolveMatrix in="e" order="3" kernelMatrix="1 1 1 1 1 1 1 1 1" edgeMode="wrap" x="0" y="0" width="8" height="8" result="d"/>
<feFlood x="0" y="100" width="5" height="5" result="f"/>
<feConvolveMatrix in="f" order="3" kernelMatrix="1 1 1 1 1 1 1 1 1" edgeMode="wrap" x="0" y="0" width="8" height="8" result="g"/>
<feMerge><feMergeNode in="a"/><feMergeNode in="b"/><feMergeNode in="c"/><feMergeNode in="d"/><feMergeNode in="g"/></feMerge>
</filter>
<rect width="8" height="8" fill="red" filter="url(#a)"/>
<rect x="8" width="8" height="16" filter="url(#t)"/>
</svg>
