<!-- Each lime stroke fills its black outline, the shape the direction
of the path gives it. A dash starting at a segment boundary goes along
the segment starting there, past a zero length one; a dash ending inside
a curve takes its tangent there; a curve along a line that turns back on
itself sweeps a round tip at the turn, its two directions there
opposite. -->
