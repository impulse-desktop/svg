<filter id="c6" x="0" y="0" width="1" height="1"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" kernelUnitLength="1 2 3"/></filter>
<filter id="l1" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" result="b"/><feDiffuseLighting in="b" surfaceScale="4" kernelUnitLength="3 1.5"><feDistantLight azimuth="45" elevation="40"/></feDiffuseLighting></filter>
<filter id="l2" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" result="b"/><feSpecularLighting in="b" surfaceScale="4" specularExponent="8" kernelUnitLength="2"><feDistantLight azimuth="225" elevation="30"/></feSpecularLighting></filter>
