<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<defs>
<filter id="c1" x="0" y="0" width="1" height="1"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" edgeMode="wrap" kernelUnitLength="1.5"/></filter>
<filter id="c2" x="0" y="0" width="1" height="1"><feConvolveMatrix order="3" kernelMatrix="1 2 1 2 4 2 1 2 1" kernelUnitLength="2 0.5" edgeMode="none" preserveAlpha="true"/></filter>
<filter id="c3" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" kernelUnitLength=".1"/></filter>
<filter id="c4" x="0" y="0" width="1" height="1"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" kernelUnitLength="0"/></filter>
