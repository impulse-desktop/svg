<filter id="l4" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" result="b"/><feDiffuseLighting in="b" surfaceScale="4" kernelUnitLength="-1"><feDistantLight azimuth="45" elevation="40"/></feDiffuseLighting></filter>
<g id="s"><rect width="14" height="14" fill="navy"/><rect x="4" y="4" width="6" height="6" fill="gold"/><rect width="14" height="2" fill="crimson" fill-opacity=".5"/></g>
