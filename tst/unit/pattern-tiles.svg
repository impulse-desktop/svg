<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128">
<!-- Each pattern fill, left, matches the squares drawn out, right. Tiles of
an objectBoundingBox pattern are fractions of the box from its corner,
content in user units from the tile's corner; userSpaceOnUse tiles start at
x, y; objectBoundingBox content scales with the box; a viewBox fits the
content into the tile and outranks patternContentUnits; patternTransform
moves the tiles; content past a tile is clipped; a template gives what the
pattern leaves out; CSS transform replaces patternTransform. A pattern of
zero width or height is no paint server: its fallback paints, lime, and
without one nothing does (D8). -->
<style>#h { transform: translate(3px, 0) }</style>
<rect width="64" height="128" fill="white"/>
<defs>
<pattern id="a" width=".25" height=".5"><rect width="3" height="3" fill="lime"/></pattern>
<pattern id="b" patternUnits="userSpaceOnUse" x="1" y="1" width="5" height="5"><rect width="2" height="2" fill="lime"/></pattern>
<pattern id="c" width=".25" height=".5" patternContentUnits="objectBoundingBox"><rect width=".1" height=".2333333" fill="lime"/></pattern>
<pattern id="d" patternUnits="userSpaceOnUse" width="6" height="6" viewBox="0 0 3 3" patternContentUnits="objectBoundingBox"><rect width="1" height="1" fill="lime"/></pattern>
<pattern id="e" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="translate(2 1)"><rect width="2" height="2" fill="lime"/></pattern>
<pattern id="f" patternUnits="userSpaceOnUse" width="6" height="6"><rect x="3" y="3" width="6" height="6" fill="lime"/></pattern>
<pattern id="gt" patternUnits="userSpaceOnUse" width="7" height="4" x="1"><rect width="2" height="2" fill="lime"/></pattern><pattern id="g" href="#gt" height="6"/>
<pattern id="h" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="translate(1 1)"><rect width="2" height="2" fill="lime"/></pattern>
<pattern id="z" width="0" height=".5"><rect width="20" height="20" fill="red"/></pattern>
<pattern id="z2" patternUnits="objectBoundingBox" width="0" height=".5"><rect width="20" height="20" fill="red"/></pattern>
<pattern id="z3" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse" width="4" height="0"><rect width="20" height="20" fill="red"/></pattern>
</defs>
<rect x="2" y="2" width="28" height="12" fill="url(#a)"/>
