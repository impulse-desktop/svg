<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="48">
<!-- Each lime drawing fills its black outline, no red. feImage draws an
image file as image does, in its subregion, meeting at the middle by
default, or stretched; an element as a use of it with the subregion's x,
y, width and height, which cut it: a symbol or an svg is a viewport of the
subregion, the element inherits from the feImage, and with primitiveUnits
objectBoundingBox it lies in the box's units; a reference to nothing is
transparent; href wins over xlink:href. -->
<defs>
<filter id="m" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC"/></filter>
<filter id="n" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC" preserveAspectRatio="none"/></filter>
<rect id="r" x="2" y="1" width="6" height="8" fill="lime"/>
<filter id="e" filterUnits="userSpaceOnUse" x="26" y="2" width="12" height="12"><feImage href="#r" x="26" y="2" width="6" height="12"/></filter>
<filter id="z" x="0" y="0" width="1" height="1"><feImage href="#missing"/></filter>
<filter id="h" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP4z8DwHwAFAAH/VscvDQAAAABJRU5ErkJggg==" preserveAspectRatio="none"/></filter>
<rect id="bb" width=".5" height="1" fill="lime"/>
<filter id="eb" primitiveUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><feImage href="#bb" x="0" y="0" width="1" height="1"/></filter>
<symbol id="sy" viewBox="0 0 2 2"><rect width="1" height="2" fill="lime"/></symbol>
<filter id="fs" filterUnits="userSpaceOnUse" x="18" y="18" width="12" height="12"><feImage href="#sy"/></filter>
<svg id="sv" viewBox="0 0 2 2"><rect width="1" height="1" fill="lime"/></svg>
<filter id="fv" filterUnits="userSpaceOnUse" x="34" y="18" width="12" height="12"><feImage href="#sv"/></filter>
<g fill="red"><rect id="ih" width="6" height="6"/></g>
<filter id="fi" filterUnits="userSpaceOnUse" x="50" y="18" width="12" height="12"><feImage href="#ih" fill="lime"/></filter>
</defs><rect width="64" height="48" fill="white"/>
<rect x="2" y="2" width="8" height="12" fill="red" filter="url(#m)"/>
<rect x="14" y="2" width="8" height="12" fill="red" filter="url(#n)"/>
<rect x="26" y="2" width="12" height="12" fill="red" filter="url(#e)"/>
<rect x="42" y="2" width="8" height="12" fill="red" filter="url(#z)"/>
<rect x="54" y="2" width="8" height="12" fill="red" filter="url(#h)"/>
<rect x="2" y="18" width="12" height="12" fill="red" filter="url(#eb)"/>
<rect x="18" y="18" width="12" height="12" fill="red" filter="url(#fs)"/>
<rect x="34" y="18" width="12" height="12" fill="red" filter="url(#fv)"/>
<rect x="50" y="18" width="12" height="12" fill="red" filter="url(#fi)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="6" width="8" height="4"/><rect x="14" y="2" width="8" height="12"/><rect x="28" y="3" width="4" height="8"/><rect x="54" y="2" width="8" height="12"/><rect x="2" y="18" width="6" height="12"/><rect x="18" y="18" width="6" height="12"/><rect x="34" y="18" width="6" height="6"/><rect x="50" y="18" width="6" height="6"/></g>
<defs>
<!-- A use of a shape retains the containing viewport for its percentages;
only a symbol or svg establishes the feImage subregion as a viewport. -->
<circle id="pc" cx="50%" cy="50%" r="2" fill="lime"/>
<rect id="pr" width="50%" height="50%" fill="lime"/>
<symbol id="ps" viewBox="0 0 2 2"><rect width="50%" height="50%" fill="lime"/></symbol>
<filter id="fpc" filterUnits="userSpaceOnUse" x="2" y="34" width="12" height="12"><feImage href="#pc"/></filter>
<filter id="fpcb" primitiveUnits="objectBoundingBox" x="0" y="0" width="1" height="1"><feImage href="#pc" x="0" y="0" width="1" height="1"/></filter>
<filter id="fpr" filterUnits="userSpaceOnUse" x="34" y="34" width="12" height="12"><feImage href="#pr"/></filter>
<filter id="fps" filterUnits="userSpaceOnUse" x="50" y="34" width="12" height="12"><feImage href="#ps"/></filter>
</defs>
<rect x="2" y="34" width="12" height="12" fill="red" filter="url(#fpc)"/>
<rect x="18" y="34" width="12" height="12" fill="red" filter="url(#fpcb)"/>
<rect x="34" y="34" width="12" height="12" fill="red" filter="url(#fpr)"/>
<rect x="50" y="34" width="12" height="12" fill="red" filter="url(#fps)"/>
</svg>
