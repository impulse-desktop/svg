<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="16">
<!-- Each lime drawing fills its black outline, no red. feImage draws an
image file as image does, in its subregion, meeting at the middle by
default, or stretched; an element as use does, its x and y the subregion's,
which cuts it; a reference to nothing is transparent; href wins over
xlink:href. -->
<defs>
<filter id="m" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC"/></filter>
<filter id="n" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC" preserveAspectRatio="none"/></filter>
<rect id="r" x="2" y="1" width="6" height="8" fill="lime"/>
<filter id="e" filterUnits="userSpaceOnUse" x="26" y="2" width="12" height="12"><feImage href="#r" x="26" y="2" width="6" height="12"/></filter>
<filter id="z" x="0" y="0" width="1" height="1"><feImage href="#missing"/></filter>
<filter id="h" x="0" y="0" width="1" height="1"><feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADElEQVR42mNg+A+BAA/5A/3mxKLtAAAAAElFTkSuQmCC" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP4z8DwHwAFAAH/VscvDQAAAABJRU5ErkJggg==" preserveAspectRatio="none"/></filter>
</defs><rect width="64" height="16" fill="white"/>
<rect x="2" y="2" width="8" height="12" fill="red" filter="url(#m)"/>
<rect x="14" y="2" width="8" height="12" fill="red" filter="url(#n)"/>
<rect x="26" y="2" width="12" height="12" fill="red" filter="url(#e)"/>
<rect x="42" y="2" width="8" height="12" fill="red" filter="url(#z)"/>
<rect x="54" y="2" width="8" height="12" fill="red" filter="url(#h)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="6" width="8" height="4"/><rect x="14" y="2" width="8" height="12"/><rect x="28" y="3" width="4" height="8"/><rect x="54" y="2" width="8" height="12"/></g>
</svg>
