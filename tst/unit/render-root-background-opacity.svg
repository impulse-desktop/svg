<svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" style="background-color: white" opacity="0.5">
<!-- The outermost svg's background is the canvas's, under the svg: its
opacity of 0.5 fades the lime square over the white, not the white. -->
<rect x="8" width="8" height="8" fill="lime"/>
</svg>
