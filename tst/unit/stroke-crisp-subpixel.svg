<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32">
<!-- A crisp-edges hint must not erase a stroke narrower than a pixel.
Keep its geometric coverage for an unscaled outline, a horizontal and a
vertical segment, and the compressed axis of a nonuniform transform. A
two-pixel stroke remains crisp. -->
<rect width="64" height="32" fill="white"/>
<g fill="none" stroke="black" shape-rendering="crispEdges" stroke-linecap="butt">
  <path d="M4 4H12V12H4Z" stroke-width=".5"/>
  <path d="M2 18H22" stroke-width=".5"/>
  <path d="M28 2V16" stroke-width=".5"/>
  <path d="M9 50H15" stroke-width="1" transform="scale(4 .4)"/>
  <path d="M40 6H60" stroke-width="2"/>
</g>
</svg>
