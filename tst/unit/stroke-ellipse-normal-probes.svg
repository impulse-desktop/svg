<!-- Every complete probe is within one source unit of a fixed point on
the ellipse; the maximum corner distance below1certifies the whole square
by convexity. Half-width1is below the minimum radius of curvature1.25,
so the ordinary normal stroke covers it. The source probes distinguish
normal offsets from ellipses with semiaxes increased/decreased by1.
Reflections, rotation, nonuniform transforms, fill and alpha preserve the
independent inclusion proof. No browser pixels define expectations. -->
