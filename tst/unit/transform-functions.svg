<svg xmlns="http://www.w3.org/2000/svg" width="122" height="623" font-size="8">
<!-- Each lime drawing fills its black outline, and nothing red shows. A
transform makes a coordinate system for an element and its content
within its parent's, through viewports too: transform-origin moved, the
functions left to right, moved back. The origin is 0 0 for SVG, in
lengths or the reference box's percentages and keywords, one value
centring the other, a third one along z; the box is the viewport, of its
viewBox's size at its user space's origin, unless fill-box or stroke-
box, or content-box and border-box, which are those, and a gradient's is
its bounding box. The property overrides the attribute; the attribute
takes white space and commas between its numbers and functions, may be
empty, takes rotate about a point and only SVG's six functions, of
numbers in px and deg. matrix(), translate() with y 0 if none,
translateX/Y, scale() with y as x if none, scaleX/Y, rotate() clockwise,
skew() not skewX then skewY, skewX/Y; a zero angle needs no unit,
another does; a scale takes percentages, a translation any length. -->
<rect width="122" height="623" fill="white"/>
