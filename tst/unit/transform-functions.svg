<svg xmlns="http://www.w3.org/2000/svg" width="104" height="30">
<!-- Each lime drawing fills its black outline. transform-origin moves the
centre of a CSS transform, in user units or keywords of the reference box,
one keyword's other side the centre; percentages of translate are of the
reference box, the viewport by default; the transform property overrides
the attribute; the attribute needs no comma between functions, may be
empty, takes rotate about a point, and drops translateX and the like;
translateX, translateY, scaleX and scaleY act on one axis; skew(x, y) is
not skewX then skewY; an angle of 0 needs no unit, another does; a scale
takes percentages too, a translation any length unit. -->
<rect width="104" height="30" fill="white"/>
<rect x="4" y="2" width="6" height="4" fill="lime" style="transform: rotate(30deg); transform-origin: 6px 4px"/>
<rect x="20" y="4" width="6" height="6" fill="lime" style="transform: rotate(-20deg); transform-origin: right bottom; transform-box: fill-box"/>
<rect x="32" y="2" width="10" height="10" fill="lime" style="transform: scale(.5); transform-origin: top; transform-box: fill-box"/>
<rect x="46" y="2" width="8" height="8" fill="lime" style="transform: translate(50%, 25%); transform-box: fill-box"/>
<rect x="60" y="2" width="6" height="8" fill="lime" transform="translate(100 0)" style="transform: none"/>
<rect x="0" y="0" width="6" height="6" fill="lime" transform="translate(72,2)rotate(10)"/>
<rect x="84" y="2" width="6" height="8" fill="lime" transform="  "/>
<rect x="94" y="2" width="6" height="8" fill="lime" transform="translateX(5)"/>
<rect x="4" y="19" width="6" height="6" fill="lime" transform="rotate(45 7 22)"/>
<rect x="18" y="18" width="8" height="6" fill="lime" style="transform: translateX(3px) translateY(2px) scaleX(.5) scaleY(1.5)"/>
<rect x="30" y="18" width="6" height="6" fill="lime" style="transform: skew(20deg, 10deg)"/>
<rect x="42" y="18" width="6" height="6" fill="lime" style="transform: skewX(20deg) skewY(10deg)"/>
<rect x="58" y="18" width="6" height="6" fill="lime" style="transform: rotate(0) translate(2px)"/>
<rect x="70" y="18" width="6" height="6" fill="lime" style="transform: rotate(10) translate(30px)"/>
<rect x="97" y="18" width="6" height="6" fill="lime" style="transform: translate(10%) scale(80%, 1)"/>
<rect x="90" y="0" width="4" height="3" fill="lime" style="transform: translate(1em, .25in); font-size: 4px"/>
