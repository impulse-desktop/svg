<svg xmlns="http://www.w3.org/2000/svg" width="48" height="16" shape-rendering="crispEdges">
<!-- A 10-unit crisp pattern becomes a five-pixel tile. Its boundary stroke
is half a pixel wide, and centre sampling leaves the tile blank. The same
thin stroke outside a tile still needs fractional coverage. -->
<defs>
  <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="scale(.5)">
    <path d="M10 0 L0 0 0 10" fill="none" stroke="#555" stroke-width="1"/>
  </pattern>
</defs>
<rect width="48" height="16" fill="white"/>
<rect width="32" height="16" fill="url(#grid)"/>
<path d="M36 4H44" fill="none" stroke="black" stroke-width=".5"/>
</svg>
