<!-- Compact line-only counterparts of two neighbouring map boundaries.
A uniform subset of their source-order vertices and all frame vertices
keep dense bevel turns beside subpixel bands. The reduced geometry has
its own exact polygon-area expectation. Normal rectangles and bevel
triangles unite per stroke, then the two fills/strokes compose in order.
Independent PNGs also check reversal, exact line splits, paint order,
reflection, rotation and alpha. No curve allowance or browser oracle. -->
