<svg xmlns="http://www.w3.org/2000/svg" width="58" height="16">
<!-- Each square matches its plain twin in the expected drawing; no red.
A stop with no stop-color is black, even under a gradient or group whose
stop-color is red, since stop-color is not inherited, but inherit takes
the gradient's. x1 and x2 set by CSS, and a pattern's x, y, width and
height set by CSS, do nothing: they are attributes, not properties. -->
<rect width="58" height="16" fill="white"/>
<style>#css-vector { x1: 50%; x2: 0% } #css-tile { x: 1px; y: 1px; width: 2px; height: 2px }</style><defs><g stop-color="red"><linearGradient id="black" stop-color="red"><stop offset="0"/><stop offset="1" stop-opacity=".5"/></linearGradient></g><linearGradient id="inherit" stop-color="lime"><stop offset="0" style="stop-color: inherit"/><stop offset="1" stop-color="navy"/></linearGradient><linearGradient id="css-vector"><stop offset="0" stop-color="navy"/><stop offset="1" stop-color="gold"/></linearGradient><pattern id="css-tile" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="2" height="2" fill="lime"/></pattern></defs>
<rect x="2" y="2" width="12" height="12" fill="url(#black)"/>
<rect x="16" y="2" width="12" height="12" fill="url(#inherit)"/>
<rect x="30" y="2" width="12" height="12" fill="url(#css-vector)"/>
<rect x="44" y="2" width="12" height="12" fill="url(#css-tile)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="12" height="12"/><rect x="16" y="2" width="12" height="12"/><rect x="30" y="2" width="12" height="12"/><rect x="44" y="2" width="12" height="12"/></g>
</svg>
