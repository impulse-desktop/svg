<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40">
<!-- No red: a stroke is the union of its segments' bands, joins and caps, so
a stroke wider than its shape covers the shape's middle, whatever the join,
on lines and on curves; a circle tighter all round than the half width
keeps the hole of its inner offset turned inside out, as every renderer
draws it (D49), and its lime ring runs from 2 to 6. -->
<g fill="red">
<rect x="7" y="7" width="6" height="6"/><rect x="25" y="5" width="2" height="10"/>
<path d="M 7 31 L 10 26 L 13 31 Z"/><rect x="23" y="27" width="6" height="6"/><rect x="40" y="25" width="10" height="10"/>
</g>
<g fill="none" stroke="lime" stroke-width="8">
<rect x="8" y="8" width="4" height="4"/>
<rect x="25" y="4" width="2" height="12" stroke-linejoin="round"/>
<circle cx="46" cy="10" r="2"/>
<path d="M 7 31 L 10 26 L 13 31 Z" stroke-linejoin="bevel"/>
<path d="M 24 28 Q 26 26 28 28 Q 30 30 28 32 Q 26 34 24 32 Q 22 30 24 28 Z" stroke-width="6"/>
<path d="M 41 26 H 49 V 34 H 41 Z M 43 28 V 32 H 47 V 28 Z" stroke-width="5" stroke-linejoin="miter"/>
</g>
</svg>
