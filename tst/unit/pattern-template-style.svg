<svg xmlns="http://www.w3.org/2000/svg" width="38" height="14">
<!-- Each lime square fills its black outline, and nothing red shows. A
pattern with nothing but an href draws its template's content, which
inherits from the template where it is, as every renderer has it, not
from the pattern: a fill in the template's style, as Inkscape writes its
stock patterns, or on a group around it, colours the content; one on the
pattern does not. -->
<rect width="38" height="14" fill="white"/>
<defs><pattern id="stock" patternUnits="userSpaceOnUse" width="10" height="10" style="fill:#00ff00"><rect width="10" height="10"/></pattern><g fill="lime"><pattern id="grouped" patternUnits="userSpaceOnUse" width="10" height="10"><rect width="10" height="10"/></pattern></g><pattern id="link" href="#stock" patternTransform="scale(0.5)"/><pattern id="link-red" href="#stock" style="fill:red"/><g fill="red"><pattern id="link-grouped" href="#grouped"/></g></defs>
<rect x="2" y="2" width="10" height="10" fill="url(#link)"/>
<rect x="14" y="2" width="10" height="10" fill="url(#link-red)"/>
<rect x="26" y="2" width="10" height="10" fill="url(#link-grouped)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="10" height="10"/><rect x="14" y="2" width="10" height="10"/><rect x="26" y="2" width="10" height="10"/></g>
</svg>
