<svg x="48" y="0" width="16" height="16" viewBox="-20.01 0.0525 .02 .02"><path d="M20 0 A20 2 0 0 0 -20 0" fill="none" stroke="lime" stroke-width=".25" stroke-linecap="round" stroke-opacity="1"/></svg>
