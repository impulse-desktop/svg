<svg xmlns="http://www.w3.org/2000/svg" width="66" height="138">
<!-- Each lime square fills its black outline, and nothing red shows. A
type selector matches its element, * any, and *.t is .t; a type or *
goes first in a compound, once. Names and values are matched as XML has
them, case-sensitively. A class selector matches a word of the class
attribute split on white space, as [class~=] does, and none of an empty
one; an id selector every element of that id; . or # alone invalidates
the selector. A B matches a B at any depth under an A, A > B a child, A
+ B the next element sibling, text and comments between them aside, A ~
B any later one; a leading combinator invalidates the selector.
Specificity counts ids, then classes, attributes and pseudo-classes,
then types, * nothing; a list takes that of the selector that matched; a
tie goes to the later rule. -->
<rect width="66" height="138" fill="white"/>
<style><![CDATA[
.c0 > rect { fill: lime }
.c1 > circle { fill: red } .c1 > .t { fill: lime }
.c2 > * { fill: lime }
.c3 > *.t { fill: red } .c3 > .t { fill: lime }
.c4 > .t { fill: red } .c4 > *.t { fill: lime }
.c5 > .t*, .c5 > * { fill: red } .c5 > .t { fill: lime }
.c6 > rect*, .c6 > * { fill: red } .c6 > .t { fill: lime }
.c7 > *rect, .c7 > * { fill: red } .c7 > .t { fill: lime }
.c8 > RECT { fill: red } .c8 > rect { fill: lime }
.c9 > .T { fill: red } .c9 > .t { fill: lime }
.c10 > #X { fill: red } .c10 > .t { fill: lime }
.c11 > [DATA-X] { fill: red } .c11 > .t { fill: lime }
.c12 > .a { fill: lime }
.c13 > [class~=a] { fill: lime }
.c14 > .a.c { fill: lime }
.c15 > .a { fill: red } .c15 > rect { fill: lime }
.c16 > .\20 { fill: red } .c16 > rect { fill: lime }
.c17 > :not(.t) { fill: lime }
.c18 > #s { fill: lime }
.c19 > #twin { fill: lime }
.c20 > ., .c20 > * { fill: red } .c20 > .t { fill: lime }
.c21 > #, .c21 > * { fill: red } .c21 > .t { fill: lime }
.c22 .t { fill: lime }
.c23 circle .t { fill: red } .c23 .t { fill: lime }
.c24 > g > .t { fill: lime }
.c25 > .t { fill: red } .c25 .t { fill: lime }
.c26 > g + .t { fill: lime }
.c27 > circle + .t { fill: red } .c27 > .t { fill: lime }
.c28 > circle ~ .t { fill: lime }
.c29 > .t ~ g { fill: red } .c29 > g ~ .t { fill: lime }
> .t, .c30 > * { fill: red } .c30 > .t { fill: lime }
+ .t, .c31 > * { fill: red } .c31 > .t { fill: lime }
~ .t, .c32 > * { fill: red } .c32 > .t { fill: lime }
.c33 > #s { fill: lime } .c33 > .t.t.t.t.t { fill: red }
.c34 > .t { fill: lime } .c34 > rect { fill: red }
.c35 > [data-x] { fill: lime } .c35 > g rect, .c35 > rect { fill: red }
.c36 > :first-child { fill: lime } .c36 > rect { fill: red }
.c37 > rect.t { fill: lime } .c37 > *.t { fill: red }
.c38 > g .t { fill: lime } .c38 > * > .t { fill: red }
.c39 > rect.t { fill: lime } .c39 > #x, .c39 > .t { fill: red }
.c40 > .t { fill: red } .c40 > .t { fill: lime }
]]></style>
<g class="c0" transform="translate(2 2)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c1" transform="translate(10 2)"><rect class="t" width="6" height="6" fill="red"/></g>
