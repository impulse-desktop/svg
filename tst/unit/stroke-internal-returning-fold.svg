<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256">
<!-- A long open stroke folds back by less than its half-width, then
     resumes forward. The nested outline leaves an opening at this
     internal return, away from both caps (Sketchy-SVG 76743021). -->
<rect width="512" height="256" fill="white"/>
<svg width="256" height="192" viewBox="320 305 65 48.75">
  <path d="M 330 337 L 352.545 337
           C 352.545 336.988 352.502 337 352.458 337
           C 352.2 337 352 337 352 337
           C 352 337 352.4 337 353.424 336.993
           L 370 320" fill="none" stroke="black" stroke-width="25.152854025036255"/>
</svg>
<!-- The same short return followed by a quarter turn still leaves its
     inverted inner offset open (Sketchy-SVG 59b563e7). -->
<svg x="256" width="256" height="256" viewBox="120 175 70 70">
  <path d="M 180 197 L 141.909 197
           C 141.909 197.025 142.083 197 142.083 197
           C 142.4 197 143 197 143 197
           C 143 197 142.8 197 141.58 197.568
           C 139 198.5 136.5 200 136.56 209.5
           L 137 250" fill="none" stroke="black" stroke-width="35.6"/>
</svg>
</svg>
