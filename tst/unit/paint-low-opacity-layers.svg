<!-- One, two, four and eight grey fills at three percent opacity, over
an opaque ground or transparency, directly or through a white alpha
mask. Source-over gives alpha 1-(97/100)^n. The grey is 137 in every
channel; an opaque background B gives 137+(B-137)*(97/100)^n. Exact
rational PNG pixels check that intermediate layers do not accumulate
eight-bit rounding. -->
