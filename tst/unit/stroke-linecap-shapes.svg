<!-- The black lines are each stroke's edge as the spec draws it; no red.
Butt ends at the end points, round adds half circles, square half squares.
A zero length subpath gets no stroke with butt, a circle with round, and with
square a square along the direction of the path before it, else after it,
else the x axis, a closing segment counting;
a lone moveto gets nothing. -->
