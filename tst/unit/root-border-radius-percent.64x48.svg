<svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 32 24" style="border-radius:50% 25% / 25% 50%">
<!-- CSS border-radius clips the outer SVG's image content at the output
     viewport, including a separately scaled viewBox. -->
<rect width="32" height="24" fill="teal"/>
</svg>
