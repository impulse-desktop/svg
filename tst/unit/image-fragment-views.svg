<svg xmlns="http://www.w3.org/2000/svg" width="66" height="18">
<!-- Lime everywhere, no red. An SVG image with no fragment shows its
root's own viewBox, and so does one whose svgView() names no viewBox. An
svgView() naming a parameter twice and a fragment of two views at once
are malformed, no view: the whole image draws, and so does one with an
empty part, a part unclosed, an alignment or a transform that does not
parse; a view of no height or width draws nothing. An svgView()
transform scales about the origin, no transform-origin of its own; a
time segment before a space segment or after a bare name leaves it the
view. -->
