<!-- Below two device pixels the Gaussian kernel samples the
specification exponential and normalizes its finite support. Independent
premultiplied convolution of literal PNG inputs checks small and unequal
deviations, zero axes, the limit below two, source alpha, post-filter
group opacity and edge extension. Nonuniform transforms scale each
deviation in its own axis and preserve the zero-blur identity. No curve
approximation or special tolerance. -->
