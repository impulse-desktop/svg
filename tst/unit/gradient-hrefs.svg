<svg xmlns="http://www.w3.org/2000/svg" width="66" height="74">
<!-- Each strip matches its plain twin in the expected drawing; no red.
A gradient with nothing but an href and the attributes other than one
takes that one from its template: x1, y1, x2, y2, gradientTransform,
gradientUnits and spreadMethod for a linear gradient, cx, cy, r, fx, fy,
fr and the same three for a radial one, and the template's stops. A
linear gradient takes a radial template's stops and the attributes they
share, and a radial one a linear template's; an href to an element that
is no gradient, or to the gradient itself, is ignored. -->
<rect width="66" height="74" fill="white"/>
<defs><g id="stops"><stop stop-color="red"/></g><linearGradient id="t-linearGradient-x1" x1=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-x1" href="#t-linearGradient-x1"/><linearGradient id="t-linearGradient-y1" x2="0" y2="1" y1=".5"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-y1" href="#t-linearGradient-y1" x2="0" y2="1"/><linearGradient id="t-linearGradient-x2" x2=".5"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-x2" href="#t-linearGradient-x2"/><linearGradient id="t-linearGradient-y2" x2="0" y2=".5"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-y2" href="#t-linearGradient-y2" x2="0"/><linearGradient id="t-linearGradient-gradientTransform" gradientTransform="rotate(30)"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-gradientTransform" href="#t-linearGradient-gradientTransform"/><linearGradient id="t-linearGradient-gradientUnits" gradientUnits="userSpaceOnUse" x1="18" x2="25"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-gradientUnits" href="#t-linearGradient-gradientUnits" x1="18" x2="25"/><linearGradient id="t-linearGradient-spreadMethod" x2=".3" spreadMethod="reflect"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><linearGradient id="c-linearGradient-spreadMethod" href="#t-linearGradient-spreadMethod" x2=".3"/><radialGradient id="t-radialGradient-cx" cx=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-cx" href="#t-radialGradient-cx"/><radialGradient id="t-radialGradient-cy" cy=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-cy" href="#t-radialGradient-cy"/><radialGradient id="t-radialGradient-r" r=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-r" href="#t-radialGradient-r"/><radialGradient id="t-radialGradient-fx" fx=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-fx" href="#t-radialGradient-fx"/><radialGradient id="t-radialGradient-fy" fy=".3"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-fy" href="#t-radialGradient-fy"/><radialGradient id="t-radialGradient-fr" fr=".2"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-fr" href="#t-radialGradient-fr"/><radialGradient id="t-radialGradient-gradientTransform" gradientTransform="translate(.2 0)"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-gradientTransform" href="#t-radialGradient-gradientTransform"/><radialGradient id="t-radialGradient-gradientUnits" gradientUnits="userSpaceOnUse" cx="41" cy="43" r="4"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-gradientUnits" href="#t-radialGradient-gradientUnits" cx="41" cy="43" r="4"/><radialGradient id="t-radialGradient-spreadMethod" r=".2" spreadMethod="repeat"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><radialGradient id="c-radialGradient-spreadMethod" href="#t-radialGradient-spreadMethod" r=".2"/><radialGradient id="r-template" spreadMethod="reflect" gradientTransform="translate(.1 0)" cx=".2"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></radialGradient><linearGradient id="to-radial" href="#r-template" x2=".3"/><linearGradient id="l-template" spreadMethod="repeat" x2=".9"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="lime"/><stop offset="1" stop-color="gold"/></linearGradient><radialGradient id="to-linear" href="#l-template" r=".2"/><linearGradient id="l-other" href="#stops"/><radialGradient id="r-other" href="#stops"/><linearGradient id="l-self" href="#l-self"><stop stop-color="lime"/></linearGradient><radialGradient id="r-self" href="#r-self"><stop stop-color="lime"/></radialGradient></defs>
<rect x="2" y="2" width="14" height="10" fill="url(#c-linearGradient-x1)"/>
<rect x="18" y="2" width="14" height="10" fill="url(#c-linearGradient-y1)"/>
<rect x="34" y="2" width="14" height="10" fill="url(#c-linearGradient-x2)"/>
<rect x="50" y="2" width="14" height="10" fill="url(#c-linearGradient-y2)"/>
<rect x="2" y="14" width="14" height="10" fill="url(#c-linearGradient-gradientTransform)"/>
<rect x="18" y="14" width="14" height="10" fill="url(#c-linearGradient-gradientUnits)"/>
<rect x="34" y="14" width="14" height="10" fill="url(#c-linearGradient-spreadMethod)"/>
<rect x="50" y="14" width="14" height="10" fill="url(#c-radialGradient-cx)"/>
<rect x="2" y="26" width="14" height="10" fill="url(#c-radialGradient-cy)"/>
<rect x="18" y="26" width="14" height="10" fill="url(#c-radialGradient-r)"/>
<rect x="34" y="26" width="14" height="10" fill="url(#c-radialGradient-fx)"/>
<rect x="50" y="26" width="14" height="10" fill="url(#c-radialGradient-fy)"/>
<rect x="2" y="38" width="14" height="10" fill="url(#c-radialGradient-fr)"/>
<rect x="18" y="38" width="14" height="10" fill="url(#c-radialGradient-gradientTransform)"/>
<rect x="34" y="38" width="14" height="10" fill="url(#c-radialGradient-gradientUnits)"/>
<rect x="50" y="38" width="14" height="10" fill="url(#c-radialGradient-spreadMethod)"/>
<rect x="2" y="50" width="14" height="10" fill="url(#to-radial)"/>
<rect x="18" y="50" width="14" height="10" fill="url(#to-linear)"/>
<rect x="34" y="50" width="14" height="10" fill="lime"/><rect x="34" y="50" width="14" height="10" fill="url(#l-other)"/>
<rect x="50" y="50" width="14" height="10" fill="lime"/><rect x="50" y="50" width="14" height="10" fill="url(#r-other)"/>
<rect x="2" y="62" width="14" height="10" fill="url(#l-self)"/>
<rect x="18" y="62" width="14" height="10" fill="url(#r-self)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="14" height="10"/><rect x="18" y="2" width="14" height="10"/><rect x="34" y="2" width="14" height="10"/><rect x="50" y="2" width="14" height="10"/><rect x="2" y="14" width="14" height="10"/><rect x="18" y="14" width="14" height="10"/><rect x="34" y="14" width="14" height="10"/><rect x="50" y="14" width="14" height="10"/><rect x="2" y="26" width="14" height="10"/><rect x="18" y="26" width="14" height="10"/><rect x="34" y="26" width="14" height="10"/><rect x="50" y="26" width="14" height="10"/><rect x="2" y="38" width="14" height="10"/><rect x="18" y="38" width="14" height="10"/><rect x="34" y="38" width="14" height="10"/><rect x="50" y="38" width="14" height="10"/><rect x="2" y="50" width="14" height="10"/><rect x="18" y="50" width="14" height="10"/><rect x="34" y="50" width="14" height="10"/><rect x="50" y="50" width="14" height="10"/><rect x="2" y="62" width="14" height="10"/><rect x="18" y="62" width="14" height="10"/></g>
</svg>
