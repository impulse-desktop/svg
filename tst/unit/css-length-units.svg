<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" font-size="8">
<!-- Each lime bar fills its black outline, and nothing red shows; every
bar is 12px. The length units of css-values-4, ASCII case-insensitive:
the absolute ones by their fixed ratios to px, em and rem of the font
size, ex and ch half an em and cap, ic and lh one em as a font without
metrics has them (D29), their root forms of the root's, the viewport
units of the 100 by 40 viewport, the small, large and dynamic ones all
the same, a percentage of the width, a number as px. An em or an ex in
font-size is of the parent's font size. A unit not known, digits after
a unit or white space before it is no length. -->
<rect width="100" height="40" fill="white"/>
<rect x="2" y="2" width="12px" height="2" fill="lime"/>
<rect x="18" y="2" width="12PX" height="2" fill="lime"/>
<rect x="34" y="2" width="12" height="2" fill="lime"/>
<rect x="50" y="2" width="12%" height="2" fill="lime"/>
<rect x="66" y="2" width="1.5em" height="2" fill="lime"/>
<rect x="82" y="2" width="3ex" height="2" fill="lime"/>
