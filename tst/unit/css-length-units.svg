<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50" font-size="8">
<!-- Each lime bar fills its black outline, and nothing red shows; every
bar is 12px. The length units of css-values-4, ASCII case-insensitive:
the absolute ones by their fixed ratios to px, em and rem of the font
size, ex and ch half an em and cap, ic and lh one em as a font without
metrics has them (D29), their root forms of the root's, the viewport
units of the 100 by 50 viewport, the small, large and dynamic ones all
the same, a percentage of the width, a number as px. An em or an ex in
font-size is of the parent's font size; an em inherits as the length it
computes to. A unit not known, digits after a unit or white space before
it is no length; zero needs no unit; a negative width is out of its
range and invalid. -->
<rect width="100" height="50" fill="white"/>
