<svg xmlns="http://www.w3.org/2000/svg" width="100" height="87">
<!-- Each lime drawing fills its black outline, and nothing red shows. A
bar turned by a quarter of a circle about its centre stands upright:
90deg, 100grad, pi/2 rad and .25turn, ASCII case-insensitive, and a full
circle more, 360deg, 400grad, 2pi rad, 1turn; a calc() of mixed angle
units; a gradient's .25turn the angle to the right and a hue rotation's
.5turn half a circle. A rotation by a bare number but zero is invalid,
so the bar lies flat; a bare zero is an angle where a grammar takes it,
in rotate(), so the square's transform attribute is overridden, and in a
gradient. -->
<rect width="100" height="87" fill="white"/>
<rect x="2" y="6" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(90deg)"/><rect x="18" y="6" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(90DEG)"/><rect x="34" y="6" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(450deg)"/>
<rect x="2" y="20" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(100grad)"/><rect x="18" y="20" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(100GRAD)"/><rect x="34" y="20" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(500grad)"/>
<rect x="2" y="34" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(1.5707964rad)"/><rect x="18" y="34" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(1.5707964RAD)"/><rect x="34" y="34" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(7.853982rad)"/>
<rect x="2" y="48" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(.25turn)"/><rect x="18" y="48" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(.25TURN)"/><rect x="34" y="48" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(1.25turn)"/>
<rect x="2" y="62" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(calc(50grad + 45deg))"/><rect x="18" y="62" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(calc(1turn / 4 - 0rad))"/><rect x="34" y="58" width="12" height="12" fill="lime" style="mask-image: linear-gradient(.25turn, black 50%, transparent 50%)"/><rect x="50" y="58" width="12" height="12" fill="#c84" style="filter: hue-rotate(.5turn)"/>
<rect x="2" y="76" width="12" height="4" fill="lime" style="transform-box: fill-box; transform-origin: center; transform: rotate(45)"/><rect x="18" y="72" width="12" height="12" fill="lime" transform="translate(50)" style="transform: translate(0px) rotate(0)"/><rect x="34" y="72" width="12" height="12" fill="lime" style="mask-image: linear-gradient(0, black 50%, transparent 50%)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="6" y="2" width="4" height="12"/><rect x="22" y="2" width="4" height="12"/><rect x="38" y="2" width="4" height="12"/><rect x="6" y="16" width="4" height="12"/><rect x="22" y="16" width="4" height="12"/><rect x="38" y="16" width="4" height="12"/><rect x="6" y="30" width="4" height="12"/><rect x="22" y="30" width="4" height="12"/><rect x="38" y="30" width="4" height="12"/><rect x="6" y="44" width="4" height="12"/><rect x="22" y="44" width="4" height="12"/><rect x="38" y="44" width="4" height="12"/><rect x="6" y="58" width="4" height="12"/><rect x="22" y="58" width="4" height="12"/><rect x="34" y="58" width="6" height="12"/><rect x="2" y="72" width="12" height="4" transform="translate(0 4)"/><rect x="18" y="72" width="12" height="12"/><rect x="34" y="72" width="12" height="6" transform="translate(0 6)"/></g>
</svg>
