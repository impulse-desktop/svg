<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" style="border: 4px solid red; padding: 3px; margin: 2px; outline: 2px solid red; box-shadow: 4px 4px red">
<!-- The lime square fills its black outline, and nothing red shows. The
outermost svg has no box of CSS drawn around its viewport: its border,
padding, margin, outline and shadow draw nothing and move nothing. -->
<rect width="32" height="16" fill="white"/>
<rect x="8" y="4" width="16" height="8" fill="lime"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="8" y="4" width="16" height="8"/></g>
</svg>
