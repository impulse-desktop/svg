<!-- Each lime square fills its black outline, and nothing red shows.
CSS escapes, of css-syntax-3: a backslash before a character not a hex
digit nor a newline is that character, before one to six hex digits and
a white space after them the code point, U+FFFD for zero, a surrogate or
one past the last; a backslash before a newline in a string is nothing,
at the end of the input U+FFFD; a newline escaped in an identifier, one
in a string or a lone - invalidate the selector. They go in class, id,
type, attribute and pseudo-class names, attribute values quoted or not,
property names and values, a style attribute, and presentation
attributes, which take comments too. A value is read from its tokens, so
an escaped parenthesis is part of an identifier, no parenthesis: rgb8 0
255 09 is no colour (D32). -->
