<svg xmlns="http://www.w3.org/2000/svg" width="64" height="100">
<!-- Lime everywhere, no red, no gold. Markers sit on every vertex of the
equivalent path: a closed subpath's first vertex gets two; start is the
path's first vertex, end its last; a rect, circle and polygon end where they
start. Start paints first, then the middles in order, then the end. Marker
content inherits from the marker's ancestors, not from the shape. A
reference to no marker, or a marker of zero width, draws nothing; a marker
under display none still draws; a marker is never drawn where it stands.
A path of movetos alone has a vertex at each.
The shorthand marker has no presentation attribute. With marker-mid alone,
the shared first/last vertex of a basic shape remains unmarked. -->
<defs>
<marker id="l" markerWidth="4" markerHeight="4" refX="2" refY="2" markerUnits="userSpaceOnUse"><rect width="4" height="4" fill="lime"/></marker>
<marker id="r" markerWidth="6" markerHeight="6" refX="3" refY="3" markerUnits="userSpaceOnUse"><rect width="6" height="6" fill="red"/></marker>
<marker id="y" markerWidth="6" markerHeight="6" refX="3" refY="3" markerUnits="userSpaceOnUse"><rect width="6" height="6" fill="gold"/></marker>
<marker id="g" markerWidth="6" markerHeight="6" refX="3" refY="3" markerUnits="userSpaceOnUse"><rect width="6" height="6" fill="lime"/></marker>
<marker id="z" markerWidth="0" markerHeight="6" refX="3" refY="3" markerUnits="userSpaceOnUse"><rect width="6" height="6" fill="red"/></marker>
<rect id="nm" width="6" height="6" fill="red"/>
<g fill="lime"><marker id="inh" markerWidth="4" markerHeight="4" refX="2" refY="2" markerUnits="userSpaceOnUse"><rect width="4" height="4"/></marker></g>
</defs>
<g display="none"><marker id="hid" markerWidth="4" markerHeight="4" refX="2" refY="2" markerUnits="userSpaceOnUse"><rect width="4" height="4" fill="lime"/></marker></g>
<g fill="red">
<rect x="3" y="5" width="2" height="2"/><rect x="13" y="5" width="2" height="2"/><rect x="13" y="13" width="2" height="2"/>
<rect x="21" y="5" width="2" height="2"/><rect x="31" y="5" width="2" height="2"/><rect x="31" y="13" width="2" height="2"/>
<rect x="59" y="3" width="2" height="2"/><rect x="59" y="11" width="2" height="2"/><rect x="51" y="11" width="2" height="2"/>
<rect x="17" y="29" width="2" height="2"/><rect x="11" y="35" width="2" height="2"/><rect x="5" y="29" width="2" height="2"/><rect x="11" y="23" width="2" height="2"/>
<rect x="23" y="29" width="2" height="2"/><rect x="33" y="29" width="2" height="2"/>
<rect x="39" y="23" width="2" height="2"/><rect x="49" y="23" width="2" height="2"/><rect x="44" y="33" width="2" height="2"/>
<rect x="30" y="50" width="2" height="2"/><rect x="42" y="50" width="2" height="2"/>
<rect x="19" y="67" width="2" height="2"/><rect x="11" y="71" width="2" height="2"/><rect x="3" y="67" width="2" height="2"/><rect x="11" y="63" width="2" height="2"/>
<rect x="29" y="67" width="2" height="2"/><rect x="37" y="67" width="2" height="2"/><rect x="45" y="67" width="2" height="2"/><rect x="53" y="67" width="2" height="2"/>
</g>
<g fill="none">
<path d="M 4 6 H 14 V 14 Z M 22 6 H 32 V 14 Z" style="marker: url(#l)"/>
<path d="M 44 8 L 44 8 L 44 8" marker-start="url(#r)" marker-mid="url(#y)" marker-end="url(#g)"/>
<rect x="52" y="4" width="8" height="8" marker-start="url(#r)" marker-mid="url(#l)" marker-end="url(#g)"/>
<circle cx="12" cy="30" r="6" style="marker: url(#l)"/>
<line x1="24" y1="30" x2="34" y2="30" style="marker: url(#l)"/>
<polygon points="40,24 50,24 45,34" style="marker: url(#l)"/>
</g>
<g fill="lime"><rect x="54" y="25" width="8" height="10"/><rect x="2" y="46" width="10" height="10"/><rect x="14" y="46" width="10" height="10"/><rect x="52" y="46" width="10" height="10"/></g>
<path d="M 58 30 h 1" marker="url(#r)"/>
<path d="M 7 51 h 1" marker-start="url(#nm)"/>
<path d="M 19 51 h 1" marker-start="url(#z)"/>
<path d="M 31 51 h 1" fill="red" marker-start="url(#inh)"/>
<path d="M 43 51 h 1" marker-start="url(#hid)"/>
<ellipse cx="12" cy="68" rx="8" ry="4" fill="none" style="marker: url(#l)"/>
<path d="M 30 68 M 38 68 M 46 68 M 54 68" style="marker: url(#l)"/>
<marker style="display: inline" markerWidth="20" markerHeight="20"><rect x="54" y="48" width="6" height="6" fill="red"/></marker>
<g fill="none" marker-mid="url(#l)">
<circle cx="12" cy="88" r="6"/>
<ellipse cx="32" cy="88" rx="6" ry="4"/>
<rect x="48" y="82" width="10" height="12"/>
</g>
</svg>
