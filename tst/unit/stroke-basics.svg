<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40">
<!-- No black, no red. A stroke is none unless given. A dash starts where the
shape starts: a rect at x, y going right, a circle and an ellipse at the
right end of their x axis going down, a line at x1, y1. A stroke's server
spans the shape's own box, as filling the stroke's outline would: lime left
of a quarter of the rect's width, blue right of it, as the bar below. -->
<rect width="64" height="40" fill="white"/>
<rect x="2" y="2" width="10" height="10" fill="lime"/>
<rect x="4" y="4" width="6" height="6" fill="none" stroke-width="4"/>
<g fill="red"><rect x="16.5" y="3.6" width="5" height=".8"/><rect x="43.3" y="11.3" width=".6" height=".6"/>
<rect x="59.3" y="19.1" width=".6" height=".6"/><rect x="56.5" y="3.6" width="3" height=".8"/></g>
<g fill="none" stroke="lime" stroke-width="2">
<rect x="16" y="4" width="12" height="8" stroke-dasharray="6 100"/>
<circle cx="40" cy="8" r="5" stroke-dasharray="7.854 100"/>
<ellipse cx="54" cy="18" rx="6" ry="4" stroke-dasharray="3 100"/>
<line x1="60" y1="4" x2="48" y2="4" stroke-dasharray="4 100"/>
</g>
<linearGradient id="g"><stop offset=".25" stop-color="lime"/><stop offset=".25" stop-color="blue"/></linearGradient>
<rect x="4" y="22" width="12" height="8" fill="none" stroke="url(#g)" stroke-width="6"/>
<rect x="1" y="34" width="6" height="4" fill="lime"/><rect x="7" y="34" width="12" height="4" fill="blue"/>
</svg>
