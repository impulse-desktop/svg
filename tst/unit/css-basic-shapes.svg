translate(2 210)"><ellipse cx="12" cy="10" rx="4" ry="2"/></g><g transform="translate(22 210)"><circle cx="4" cy="9" r="3"/></g><g transform="translate(42 210)"><circle cx="3" cy="5" r="3"/></g><g transform="translate(2 226)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(22 226)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(42 226)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(62 226)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(82 226)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(102 226)"><path d="M3 0A3 3 0 0 1 0 3V0Z"/></g><g transform="translate(2 242)"><ellipse cx="8" cy="6" rx="4" ry="6"/></g><g transform="translate(22 242)"><ellipse cx="8" cy="6" rx="8" ry="6"/></g><g transform="translate(42 242)"><ellipse cx="4" cy="6" rx="4" ry="3"/></g><g transform="translate(2 258)"><path d="M0 0H16L0 12Z"/></g><g transform="translate(22 258)"><path d="M8 0L16 12H0Z"/></g><g transform="translate(2 274)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(22 274)"><path d="M0 0H16V12H0Z M4 3H12V9H4Z"/></g><g transform="translate(2 290)"><path d="M0 0H16L0 12Z"/></g><g transform="translate(22 290)"><rect x="0" y="0" width="16" height="12"/></g><g transform="translate(2 306)"><rect x="3" y="1" width="10" height="10"/></g><g transform="translate(22 306)"><rect x="3" y="1" width="10" height="10"/></g><g transform="translate(2 322)"><circle cx="8" cy="6" r="6"/></g><g transform="translate(22 322)"><circle cx="8" cy="6" r="5"/></g><g transform="translate(42 322)"><circle cx="8" cy="6" r="4"/></g></g>
