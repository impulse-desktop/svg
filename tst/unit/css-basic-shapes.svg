<svg xmlns="http://www.w3.org/2000/svg" width="122" height="339">
<!-- Each lime drawing fills its black outline, and nothing red shows;
each is a 16 by 12 rect clipped by a basic shape, drawn plainly in the
expected drawing. inset() takes one to four insets as margin does,
insets past the box shrink to nothing; xywh() a position and a size;
rect() its edges from the top and the left, auto the box's own, an edge
before the opposite one meeting it; all three draw the same as the
inset() they compute to, and round their corners. circle() takes one
radius, a percentage of the box's diagonal over sqrt(2), closest side if
none, and a centre, the box's if none; ellipse() two radii, each of its
axis. polygon() closes its points, nonzero unless evenodd; path() takes
a fill rule and its string, nothing more. A position is one or two
words, or a side of each axis with its offset from it, never three.
half-border-box is midway between the fill box and the stroke box, and
margin-box is the stroke box, as clip-path takes them. -->
<rect width="122" height="339" fill="white"/>
<rect x="2" y="2" width="16" height="12" fill="lime" style="clip-path: inset(2px)"/><rect x="22" y="2" width="16" height="12" fill="lime" style="clip-path: inset(1px 3px)"/><rect x="42" y="2" width="16" height="12" fill="lime" style="clip-path: inset(1px 2px 3px)"/><rect x="62" y="2" width="16" height="12" fill="lime" style="clip-path: inset(1px 2px 3px 4px)"/>
<rect x="2" y="18" width="16" height="12" fill="red" style="clip-path: inset(12px 0 4px 0)"/><rect x="22" y="18" width="16" height="12" fill="red" style="clip-path: inset(0 10px 0 10px)"/>
<rect x="2" y="34" width="16" height="12" fill="lime" style="clip-path: xywh(2px 3px 6px 4px)"/><rect x="22" y="34" width="16" height="12" fill="lime" style="clip-path: xywh(25% 25% 50% 50%)"/>
<rect x="2" y="50" width="16" height="12" fill="lime" style="clip-path: rect(2px 10px 8px 3px)"/><rect x="22" y="50" width="16" height="12" fill="lime" style="clip-path: rect(25% 75% 75% 25%)"/>
<rect x="2" y="66" width="16" height="12" fill="lime" style="clip-path: rect(auto auto 6px auto)"/><rect x="22" y="66" width="16" height="12" fill="lime" style="clip-path: rect(3px auto auto 4px)"/>
<rect x="2" y="82" width="16" height="12" fill="red" style="clip-path: rect(2px 3px 8px 6px)"/><rect x="22" y="82" width="16" height="12" fill="red" style="clip-path: rect(8px 10px 2px 3px)"/>
<rect x="2" y="98" width="16" height="12" fill="lime" style="clip-path: inset(2px 3px 4px 1px round 2px)"/><rect x="22" y="98" width="16" height="12" fill="lime" style="clip-path: rect(2px 13px 8px 1px round 2px)"/><rect x="42" y="98" width="16" height="12" fill="lime" style="clip-path: xywh(1px 2px 12px 6px round 2px)"/>
<rect x="2" y="114" width="16" height="12" fill="lime" style="clip-path: inset(2px round 3px)"/><rect x="22" y="114" width="16" height="12" fill="lime" style="clip-path: inset(0 round 50%)"/><rect x="42" y="114" width="16" height="12" fill="lime" style="clip-path: xywh(0 0 100% 100% round 4px 0 0 0)"/>
<rect x="2" y="130" width="16" height="12" fill="lime" style="clip-path: circle(4px)"/><rect x="22" y="130" width="16" height="12" fill="lime" style="clip-path: circle(4px at 4px 4px)"/>
<rect x="2" y="146" width="16" height="12" fill="lime" style="clip-path: circle()"/><rect x="22" y="146" width="16" height="12" fill="lime" style="clip-path: circle(closest-side at 4px 6px)"/>
<rect x="2" y="162" width="16" height="12" fill="lime" style="clip-path: circle(4px 4px)"/>
<rect x="2" y="178" width="16" height="12" fill="lime" style="clip-path: circle(25%)"/>
<rect x="2" y="194" width="16" height="12" fill="lime" style="clip-path: circle(3px at 3px 3px)"/><rect x="22" y="194" width="16" height="12" fill="lime" style="clip-path: ellipse(4px 2px)"/><rect x="42" y="194" width="16" height="12" fill="lime" style="clip-path: circle(3px at right top)"/><rect x="62" y="194" width="16" height="12" fill="lime" style="clip-path: circle(3px at 25% bottom)"/>
<rect x="2" y="210" width="16" height="12" fill="lime" style="clip-path: ellipse(4px 2px at right 4px bottom 2px)"/><rect x="22" y="210" width="16" height="12" fill="lime" style="clip-path: circle(3px at bottom 3px left 25%)"/><rect x="42" y="210" width="16" height="12" fill="lime" style="clip-path: circle(3px at left 3px top calc(50% - 1px))"/>
<rect x="2" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at left 1px top)"/><rect x="22" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at left 1px right 2px)"/><rect x="42" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at center 1px top 2px)"/><rect x="62" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at left top bottom 2px)"/><rect x="82" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at left 1px top 2px 3px)"/><rect x="102" y="226" width="16" height="12" fill="lime" style="clip-path: circle(3px at top left)"/>
<rect x="2" y="242" width="16" height="12" fill="lime" style="clip-path: ellipse(25% 50%)"/><rect x="22" y="242" width="16" height="12" fill="lime" style="clip-path: ellipse()"/><rect x="42" y="242" width="16" height="12" fill="lime" style="clip-path: ellipse(closest-side 3px at 4px 6px)"/>
<rect x="2" y="258" width="16" height="12" fill="lime" style="clip-path: polygon(0 0, 16px 0, 0 12px)"/><rect x="22" y="258" width="16" height="12" fill="lime" style="clip-path: polygon(50% 0, 100% 100%, 0 100%)"/>
<rect x="2" y="274" width="16" height="12" fill="lime" style="clip-path: polygon(0 0, 16px 0, 16px 12px, 0 12px, 0 0, 4px 3px, 12px 3px, 12px 9px, 4px 9px, 4px 3px)"/><rect x="22" y="274" width="16" height="12" fill="lime" style="clip-path: polygon(evenodd, 0 0, 16px 0, 16px 12px, 0 12px, 0 0, 4px 3px, 12px 3px, 12px 9px, 4px 9px, 4px 3px)"/>
<rect x="2" y="290" width="16" height="12" fill="lime" style="clip-path: path('M0 0H16L0 12Z')"/><rect x="22" y="290" width="16" height="12" fill="lime" style="clip-path: path(nonzero, 'M0 0H16L0 12Z', x)"/>
<rect x="6" y="308" width="8" height="8" fill="lime" stroke="lime" stroke-width="4" style="clip-path: half-border-box"/><rect x="26" y="308" width="8" height="8" fill="lime" stroke="lime" stroke-width="4" style="clip-path: inset(0) half-border-box"/>
<rect x="6" y="324" width="8" height="8" fill="lime" stroke="lime" stroke-width="4" style="clip-path: circle(50%) margin-box"/><rect x="26" y="324" width="8" height="8" fill="lime" stroke="lime" stroke-width="4" style="clip-path: circle(50%) half-border-box"/><rect x="46" y="324" width="8" height="8" fill="lime" stroke="lime" stroke-width="4" style="clip-path: circle(50%) fill-box"/>
