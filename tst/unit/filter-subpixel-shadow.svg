<svg xmlns="http://www.w3.org/2000/svg" width="144" height="56">
<!-- Exact source rectangle areas feed a fractional offset and
normalized Gaussian. Atop preserves the blurred second input alpha, the
color matrix scales it, then the gray foreground composites over the
black shadow. Independent PNG expectations include line ends, filter
edges, uniform and unequal transforms, an opaque row, negative offsets,
translucent source, zero shadow opacity and clamped high-gain
SourceAlpha before blur and out compositing. A real convex diagram node
also checks its fill and miter stroke through blur, black alpha scaling,
offset and SourceGraphic blending in linearRGB and sRGB, with
translucent and zero-effect boundaries. -->
