<svg xmlns="http://www.w3.org/2000/svg" width="64" height="56">
<!-- Dashes of 0.0005 with round caps along a line are tens of thousands
of dots, each overlapping the thousand beside it, whose edges keep
crossing within every row: the union is the line with round caps,
scalloped by less than a millionth of a pixel. An exact sweep would
cross without end in effect; past the work limit a row is sampled on
scanlines (D58). A row of dots across the canvas, its caps past both
sides, has too many edges to sort; a column of dots one pixel wide
crosses past the limit in every row. A wide line dashed every 0.0002 is
a hundred thousand slivers side by side, half covering the rows it
spans, whose edges all pass from row to row: too many to sort into an
order, each row under it is sampled. -->
<rect width="64" height="56" fill="white"/>
<line x1="0" y1="4" x2="64" y2="4" stroke="teal" stroke-opacity=".3" stroke-dasharray="0.0005" stroke-linecap="round"/>
<line x1="56.5" y1="8" x2="56.5" y2="56" stroke="teal" stroke-opacity=".3" stroke-dasharray="0.0005" stroke-linecap="round"/>
<line x1="0" y1="24" x2="48" y2="24" stroke="teal" stroke-width="10" stroke-dasharray="0.0002"/>
</svg>
