<svg xmlns="http://www.w3.org/2000/svg" width="66" height="26">
<!-- Each lime square fills its black outline, and nothing red shows.
currentcolor is the element's own color, in any case and in any
property, fill, stroke, a stop's or a flood's; in color itself it is the
inherited color. transparent is transparent black, which leaves the lime
under it. -->
<rect width="66" height="26" fill="white"/>
<style><![CDATA[
.c2 > .t { color: lime; fill: currentColor }
]]></style>
<g class="c0" transform="translate(2 2)"><rect class="t" width="6" height="6" color="lime" fill="currentcolor"/></g><g class="c1" transform="translate(10 2)"><rect class="t" width="6" height="6" color="lime" fill="red" style="fill: CurrentColor"/></g><g class="c2" transform="translate(18 2)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c3" transform="translate(26 2)"><g color="red"><rect class="t" width="6" height="6" color="lime" fill="currentcolor"/></g></g><g class="c4" transform="translate(34 2)"><path d="M3 0v6" color="lime" stroke="currentcolor" stroke-width="6"/></g><g class="c5" transform="translate(42 2)"><linearGradient id="gc" color="lime"><stop stop-color="currentcolor"/></linearGradient><rect class="t" width="6" height="6" fill="url(#gc)"/></g><g class="c6" transform="translate(50 2)"><filter id="fc" x="0" y="0" width="1" height="1" color="lime"><feFlood flood-color="currentcolor"/></filter><rect class="t" width="6" height="6" fill="red" filter="url(#fc)"/></g>
<g class="c7" transform="translate(2 10)"><g color="lime"><rect class="t" width="6" height="6" color="currentcolor" fill="currentcolor"/></g></g><g class="c8" transform="translate(10 10)"><g color="lime"><rect class="t" width="6" height="6" style="color: currentcolor" fill="currentcolor"/></g></g>
<g class="c9" transform="translate(2 18)"><rect width="6" height="6" fill="lime"/><rect class="t" width="6" height="6" fill="transparent"/></g><g class="c10" transform="translate(10 18)"><rect width="6" height="6" fill="lime"/><rect class="t" width="6" height="6" fill="red" style="fill: TRANSPARENT"/></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="6" height="6"/><rect x="10" y="2" width="6" height="6"/><rect x="18" y="2" width="6" height="6"/><rect x="26" y="2" width="6" height="6"/><rect x="34" y="2" width="6" height="6"/><rect x="42" y="2" width="6" height="6"/><rect x="50" y="2" width="6" height="6"/><rect x="2" y="10" width="6" height="6"/><rect x="10" y="10" width="6" height="6"/><rect x="2" y="18" width="6" height="6"/><rect x="10" y="18" width="6" height="6"/></g>
</svg>
