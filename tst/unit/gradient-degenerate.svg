<svg xmlns="http://www.w3.org/2000/svg" width="128" height="48" viewBox="0 0 128 48">
<g fill="teal">
<rect x="2" y="2" width="28" height="12" style="mask-image: radial-gradient(circle 0, black 0px, transparent 6px)"/>
<rect x="34" y="2" width="28" height="12" style="mask-image: radial-gradient(0 10px, black 0px, transparent 6px)"/>
<rect x="66" y="2" width="28" height="12" style="mask-image: radial-gradient(10px 0, black 0px, transparent 6px)"/>
<rect x="98" y="2" width="28" height="12" style="mask-image: repeating-radial-gradient(10px 0, black 0%, transparent 50%)"/>
<rect x="2" y="18" width="28" height="12" style="mask-image: repeating-linear-gradient(black 10px, 10px, transparent 10px)"/>
<rect x="34" y="18" width="28" height="12" style="mask-image: repeating-linear-gradient(transparent 5px, transparent 5px)"/>
<rect x="66" y="18" width="28" height="12" style="mask-image: radial-gradient(circle 0, black 30%, transparent 60%)"/>
<rect x="98" y="18" width="28" height="12" style="mask-image: repeating-radial-gradient(0 10px, black 0px, transparent 3px)"/>
<rect x="2" y="34" width="28" height="12" style="mask-image: repeating-radial-gradient(10px 0, black 0px, transparent 2px, black 6px)"/>
<rect x="34" y="34" width="28" height="12" style="mask-image: repeating-conic-gradient(black 10%, transparent 10%, black 10%)"/>
<rect x="66" y="34" width="28" height="12" style="mask-image: radial-gradient(closest-side at 0 50%, black 0px, transparent 6px)"/>
<rect x="98" y="34" width="28" height="12" style="mask-image: repeating-radial-gradient(1e30px 1e-30px, black 0%, transparent 25%)"/>
</g>
</svg>
