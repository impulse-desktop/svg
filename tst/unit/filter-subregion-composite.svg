<svg xmlns="http://www.w3.org/2000/svg" width="60" height="120">
<!-- A primitive subregion strictly inside opaque SourceGraphic clips
each boundary pixel by its exact fractional area. Nine Porter-
Duff/arithmetic forms use the same red/green source, in linearRGB and
sRGB, including fractional use placement. Independent rational areas and
colour equations supply every expected pixel. The source alpha is one
even at the interior green rectangle edge. -->
<defs><g id="source"><rect width="12" height="12" fill="red"/><rect x="3.25" y="3.5" width="4.5" height="4.5" fill="lime"/></g></defs>
<svg x="0" y="0" width="20" height="20"><defs><filter id="f0" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="in" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f0)"/></svg>
<svg x="20" y="0" width="20" height="20"><defs><filter id="f1" color-interpolation-filters="linearRGB"><feFlood flood-opacity="0"/><feComposite in="SourceGraphic" operator="out" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f1)"/></svg>
<svg x="40" y="0" width="20" height="20"><defs><filter id="f2" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="atop" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f2)"/></svg>
<svg x="0" y="20" width="20" height="20"><defs><filter id="f3" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="over" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f3)"/></svg>
<svg x="20" y="20" width="20" height="20"><defs><filter id="f4" color-interpolation-filters="linearRGB"><feFlood flood-opacity="0"/><feComposite in="SourceGraphic" operator="xor" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f4)"/></svg>
<svg x="40" y="20" width="20" height="20"><defs><filter id="f5" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k1="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f5)"/></svg>
<svg x="0" y="40" width="20" height="20"><defs><filter id="f6" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k2="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f6)"/></svg>
<svg x="20" y="40" width="20" height="20"><defs><filter id="f7" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k3="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f7)"/></svg>
<svg x="40" y="40" width="20" height="20"><defs><filter id="f8" color-interpolation-filters="linearRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k1=".75" k4=".25" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.0" y="2.0" filter="url(#f8)"/></svg>
<svg x="0" y="60" width="20" height="20"><defs><filter id="f9" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="in" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f9)"/></svg>
<svg x="20" y="60" width="20" height="20"><defs><filter id="f10" color-interpolation-filters="sRGB"><feFlood flood-opacity="0"/><feComposite in="SourceGraphic" operator="out" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f10)"/></svg>
<svg x="40" y="60" width="20" height="20"><defs><filter id="f11" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="atop" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f11)"/></svg>
<svg x="0" y="80" width="20" height="20"><defs><filter id="f12" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="over" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f12)"/></svg>
<svg x="20" y="80" width="20" height="20"><defs><filter id="f13" color-interpolation-filters="sRGB"><feFlood flood-opacity="0"/><feComposite in="SourceGraphic" operator="xor" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f13)"/></svg>
<svg x="40" y="80" width="20" height="20"><defs><filter id="f14" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k1="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f14)"/></svg>
<svg x="0" y="100" width="20" height="20"><defs><filter id="f15" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k2="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f15)"/></svg>
<svg x="20" y="100" width="20" height="20"><defs><filter id="f16" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k3="1" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f16)"/></svg>
<svg x="40" y="100" width="20" height="20"><defs><filter id="f17" color-interpolation-filters="sRGB"><feComposite in2="SourceGraphic" operator="arithmetic" k1=".75" k4=".25" x="3.25" y="3.5" width="4.5" height="4.5"/></filter></defs><use href="#source" x="2.125" y="2.75" filter="url(#f17)"/></svg>
</svg>
