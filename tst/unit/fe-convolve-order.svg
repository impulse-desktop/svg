<filter id="f20" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3.4e38" kernelMatrix="0 0 0 0 2 0 0 0 0" divisor="1"/></filter><rect x="52" y="76" width="16" height="16" fill="rgb(32,64,96)" filter="url(#f20)"/>
