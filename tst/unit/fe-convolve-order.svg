<filter id="f14" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="1.9" kernelMatrix="2" divisor="1"/></filter><rect x="52" y="52" width="16" height="16" fill="rgb(32,64,96)" filter="url(#f14)"/>
