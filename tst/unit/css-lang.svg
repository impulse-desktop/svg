<svg xmlns="http://www.w3.org/2000/svg" width="66" height="66">
<!-- Each lime square fills its black outline, and nothing red shows.
:lang() takes a list of language ranges, idents or strings, and matches
an element whose language, its xml:lang, else its lang, else its
parent's, an empty one none, falls in a range by extended filtering:
ASCII case-insensitive, the first subtags alike or *, each later subtag
found in turn, past others but never past a singleton; "*" matches any
language but none, "" no language alone; an ill-formed range or language
matches nothing, yet the selector stays valid. It weighs as a class. An
instance's language past its root is its use's. -->
<rect width="66" height="66" fill="white"/>
<style><![CDATA[
.c0 .t:lang(de) { fill: lime }
.c1 .t:lang(de) { fill: lime }
.c2 .t:lang(de) { fill: lime }
.c3 .t:lang(de) { fill: lime }
.c4 .t { fill: lime } .c4 .t:lang(fr) { fill: red }
.c5 .t:lang(de) { fill: lime }
.c6 .t { fill: lime } .c6 .t:lang(de) { fill: red }
.c7 .t { fill: lime } .c7 .t:lang(de) { fill: red }
.c8 .t:lang(en) { fill: lime }
.c9 .t { fill: lime } .c9 .t:lang(en-US) { fill: red }
.c10 .t { fill: lime } .c10 .t:lang(en-GB) { fill: red }
.c11 .t:lang(de-DE) { fill: lime }
.c12 .t { fill: lime } .c12 .t:lang(de-DE) { fill: red }
.c13 .t:lang(DE-ch) { fill: lime }
.c14 .t { fill: lime } .c14 .t:lang(de) { fill: red }
.c15 .t:lang(fr, de) { fill: lime }
.c16 .t:lang("*-CH") { fill: lime }
.c17 .t:lang(\*-CH) { fill: lime }
.c18 .t:lang("de-*-DE") { fill: lime }
.c19 .t:lang("*") { fill: lime }
.c20 .t { fill: lime } .c20 .t:lang("*") { fill: red }
.c21 .t { fill: lime } .c21 .t:lang("*") { fill: red }
.c22 .t:lang("") { fill: lime }
.c23 .t:lang("") { fill: lime }
.c24 .t { fill: lime } .c24 .t:lang("") { fill: red }
.c25 .t { fill: lime } .c25 .t:lang(åå) { fill: red }
.c26 .t:lang(åå), .c26 .t { fill: lime }
.c27 .t { fill: lime } .c27 .t:lang('de,fr') { fill: red }
.c28 .t { fill: lime } .c28 .t:lang(abcdefghi) { fill: red }
.c29 .t { fill: lime } .c29 .t:lang(de) { fill: red }
.c30 .t { fill: lime } .c30 .t:lang(\31 de) { fill: red }
.c31 .t:lang(de-1996) { fill: lime }
.c32 .t { fill: lime } .c32 .t:lang() { fill: red }
.c33 .t { fill: lime } .c33 .t:lang(,de) { fill: red }
.c34 .t { fill: lime } .c34 .t:lang(de fr) { fill: red }
.c35 .t { fill: lime } .c35 .t:lang(5) { fill: red }
.c37 .t:lang(de) { fill: lime } .c37 .t { fill: red }
.lu { fill: red } .lu:lang(de) { fill: lime }
.lv { fill: red } .lv:lang(fr) { visibility: hidden } .lv:lang(de) { fill: lime }
]]></style><style>.c36 .t { fill: lime } .c36 .t:lang("de
) { fill: red }</style>
