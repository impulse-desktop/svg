<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="16">
<style>
image { x: 2px; y: 2px; width: 4px; height: 4px }
use.u { x: 8px; y: 2px }
svg svg { x: 14px; y: 2px; width: 6px; height: 6px }
symbol { width: 6px; height: 6px }
circle { rx: 2px }
rect.d { d: path('M0 0 h2 v2 z') }
radialGradient { transform: rotate(10deg) }
svg { transform-origin: 1px 1px }
rect.w { width: 4px }
#e { fill: env(x, var(--y, teal)) }
#f { fill: var(--a, env(b, navy)) }
#g { fill: var(--a, red, blue) }
#h { marker: var(--x,) }
#i { d: path(M0 0 h4 v4 z) x }
#j { d: path(") }
#k { d: path("M0 0 h4 v4 z') }
#l { rect: 1; x1: 2; href: 3; stop: 4 }
#m { stroke-width: bogus; stroke: black }
@import 'x.css';
</style>
<defs><radialGradient id="rg"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></radialGradient>
<symbol id="sy"><rect width="10" height="10" fill="gold"/></symbol></defs>
<image href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='4' height='4'%3E%3Crect width='4' height='4' fill='purple'/%3E%3C/svg%3E"/>
<use class="u" href="#sy"/>
<svg><rect width="100%" height="100%" fill="url(#rg)"/></svg>
<circle cx="24" cy="4" r="3" fill="orange"/>
<rect class="d" x="28" y="2" width="2" height="2" fill="black"/>
<rect class="w" x="32" y="2" height="4"/>
<rect x="38" y="2" width="4" height="4" id="e"/><rect x="42" y="2" width="4" height="4" id="f"/>
<rect x="0" y="10" width="4" height="4" id="g" fill="gray"/>
<path id="h" d="M6 12 h4" stroke="black"/>
<path id="i" fill="teal"/><path id="j" fill="teal"/><path id="k" fill="teal"/>
<rect x="12" y="10" width="4" height="4" id="l"/>
<rect x="18" y="10" width="4" height="4" id="m"/>
<rect/>
</svg>
