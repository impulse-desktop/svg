<!-- A nonzero closing segment retains its own direction, even when very
short. SVG2 offset-line intersections give the miter joins; a limit
below the miter ratio gives a bevel. A zero closing segment instead
joins the two remaining directions. Reversing the closed path changes no
stroke area. Exact rational unions of straight bands and join polygons
supply the expected PNGs. -->
