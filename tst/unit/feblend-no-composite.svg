<filter id="nn" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox"><feFlood flood-color="gold" flood-opacity=".6" result="f"/><feFlood flood-color="navy" flood-opacity=".5" x="0" y="0" width=".5" height="1" result="b"/><feBlend in="f" in2="b" mode="normal" no-composite=""/></filter>
