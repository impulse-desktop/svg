<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" style="fill: inherit; opacity: inherit">
<!-- The square is black and fills its outline: the root inherits the
initial value of fill and of opacity, having no parent, and the square
inherits the root's fill. -->
<rect width="10" height="10" fill="white"/>
<rect x="2" y="2" width="6" height="6"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="6" height="6"/></g>
</svg>
