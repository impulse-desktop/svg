<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40">
<!-- Each lime drawing fills its black outline, no red. FillPaint and
StrokePaint are the fill and the stroke as images of no edge, filling the
whole region; a gradient in them lies on the filtered element's own box,
here lime up to its middle. In a list of filters each takes the element's
paint, not what the one before drew; arithmetic on them clamps. -->
<defs><linearGradient id="g"><stop offset=".5" stop-color="lime"/><stop offset=".5" stop-color="white"/></linearGradient>
<filter id="f" x="-.5" y="-.25" width="2" height="1.5"><feOffset in="FillPaint"/></filter>
<filter id="s" x="-.5" y="-.25" width="2" height="1.5"><feOffset in="StrokePaint"/></filter>
<filter id="r" x="-.5" y="-.25" width="2" height="1.5"><feFlood flood-color="red"/></filter>
<filter id="a" x="-.5" y="-.25" width="2" height="1.5" color-interpolation-filters="sRGB"><feComposite operator="arithmetic" in="FillPaint" in2="StrokePaint" k2="2" k3="-1"/></filter></defs>
<rect width="64" height="40" fill="white"/>
<rect x="6" y="4" width="6" height="12" fill="lime" stroke="red" filter="url(#f)"/>
<rect x="26" y="4" width="6" height="12" fill="red" stroke="lime" stroke-width="0" filter="url(#s)"/>
<rect x="46" y="4" width="8" height="12" fill="url(#g)" filter="url(#f)"/>
<rect x="6" y="24" width="6" height="12" fill="lime" filter="url(#r) url(#f)"/>
<rect x="26" y="24" width="6" height="12" fill="#008000" stroke="red" stroke-width="0" filter="url(#a)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="3" y="1" width="12" height="18"/><rect x="23" y="1" width="12" height="18"/><rect x="42" y="1" width="8" height="18"/><rect x="3" y="21" width="12" height="18"/><rect x="23" y="21" width="12" height="18"/></g>
</svg>
