<svg xmlns="http://www.w3.org/2000/svg" width="32" height="12">
<!-- Each lime drawing fills its black outline. CSS positioning does not
move an image; an image clips what its document draws past it, whatever
that document's own overflow. -->
<rect width="32" height="12" fill="white"/>
<image x="2" y="2" width="8" height="8" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAD0lEQVR42mNg+I8GSRcAACxQH+FFrzMQAAAAAElFTkSuQmCC" style="position: relative; top: 4px; left: 4px; margin: 4px"/>
<image x="20" y="2" width="8" height="8" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%204%204%27%20overflow%3D%27visible%27%3E%3Crect%20x%3D%27-4%27%20y%3D%27-4%27%20width%3D%2712%27%20height%3D%2712%27%20fill%3D%27lime%27/%3E%3C/svg%3E"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="8" height="8"/><rect x="20" y="2" width="8" height="8"/></g>
</svg>
