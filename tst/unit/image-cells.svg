<svg xmlns="http://www.w3.org/2000/svg" width="40" height="168">
<!-- Each lime drawing fills its black outline. CSS positioning does not
move an image. By default, an image clips what its document draws past
its positioning rectangle. With overflow visible it does not; overflow
on the referenced root independently clips to the image-rendering
rectangle, which slice can make larger than the image's positioning
rectangle. A raster at its own size on whole pixels gives its pixels
back as they are, as bilinear resampling would, the least image-
rendering auto may do. An SVG's explicit root size gives its intrinsic
aspect ratio even without a viewBox; the referencing image's
preserveAspectRatio fits and aligns it, while the embedded root's
preserveAspectRatio is ignored. -->
