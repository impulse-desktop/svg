<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 32 16" style="overflow:hidden" transform="translate(16)">
<!-- The viewBox scales the bars before the root transform, and the
root viewport clips the negative part of the red one. -->
<rect x="-8" width="16" height="8" fill="red"/>
<rect x="10" width="4" height="8" fill="green"/>
</svg>
