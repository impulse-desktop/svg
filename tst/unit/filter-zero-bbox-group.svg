<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64">
<!-- A filter in objectBoundingBox units is ignored for a stroked
vertical or horizontal path, even when the filter is on its parent group
and the round cap gives the stroke a visible area. A positive geometry
box and a user-space filter still apply the filter. -->
<rect width="128" height="64" fill="white"/>
<defs>
  <filter id="red" x="-2" y="-2" width="5" height="5">
    <feFlood flood-color="red"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="red-user" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="64">
    <feFlood flood-color="red"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>
<path d="M16 16 v.008" fill="none" stroke="lime" stroke-width="12" stroke-linecap="round" filter="url(#red)"/>
<g filter="url(#red)"><path d="M48 16 v.008" fill="none" stroke="lime" stroke-width="12" stroke-linecap="round" /></g>
<g filter="url(#red)"><path d="M80 16 v.008" fill="none" stroke="lime" stroke-width="12" stroke-linecap="round" vector-effect="non-scaling-stroke"/></g>
<path d="M104 16 H120" fill="none" stroke="lime" stroke-width="4" filter="url(#red)"/>
<rect x="10" y="42" width="12" height="12" fill="lime" filter="url(#red)"/>
<path d="M48 48 v.008" fill="none" stroke="lime" stroke-width="12" stroke-linecap="round" filter="url(#red-user)"/>
</svg>
