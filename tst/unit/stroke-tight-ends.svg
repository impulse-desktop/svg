<svg xmlns="http://www.w3.org/2000/svg" width="700" height="100">
<!-- Each black drawing is the exact stroke of its curve, the union of
its normal segments, drawn plainly beside nothing else. Where a stroke
ends in a curve tighter than its half width, the inner ends of the
normals near the end run back, and behind the end's normal a wedge by
its inner corner is left out of the sweep: a dash ending in a tight
turn, an open path starting where its curve tightens past the half width
a little later, an open path ending in a tight turn, and a dash of a
circle as wide as its diameter, a pie chart's sector, whose normals all
meet at the centre, its half width past what the turn a step may take
bounds (the sector cut by its viewport), and a quarter-circle cubic with
the same dash, whose normals do not all meet at the centre. The circle's
dash sweeps 30/60 radians, so its clipped sector is a plain triangle;
the cubics use the sampled normal sweeps. Then two tiny cubics of a
Sketchy-SVG drawing stroked far wider than they turn: their normals
cross within the half width, so the stroke narrows to a waist where they
cross and opens past it, a lobe bounded by the normals' far ends and by
where they touch the curve of their centres; and an icon's hook, a cubic
whose first control is all but at its start, stroked with round caps,
turning tighter than its half width one way and at once the other.
Within 8 levels, the exact model's own sampling and the flattening's
tolerance. -->
<rect width="700" height="100" fill="white"/>
<g transform="translate(0 0)" fill="none" stroke="black"><path d="M 40 80 C 40 55 45 50 50 50 C 55 50 60 55 60 80" stroke-width="30" stroke-dasharray="28 200" transform="translate(-5 -15)"/></g>
<g transform="translate(100 0)" fill="none" stroke="black"><path d="M 128.92 313.55 C 132.55 309.89 136.53 309.70 146.47 314.58" stroke-width="19" transform="translate(-100 -290)"/></g>
<g transform="translate(200 0)" fill="none" stroke="black"><path d="M 40 80 C 40 55 45 50 50 50" stroke-width="30" transform="translate(-10 -25)"/></g>
<g transform="translate(300 0)" fill="none" stroke="black"><svg width="100" height="100"><circle cx="10" cy="30" r="60" stroke-width="120" stroke-dasharray="30 1000"/></svg></g>
<g transform="translate(400 0)" fill="none" stroke="black"><svg width="100" height="100"><path d="M70 30 C70 63.1370849898476 43.1370849898476 90 10 90" stroke-width="120" stroke-dasharray="30 1000"/></svg></g>
<g transform="translate(500 0)" fill="none" stroke="black"><path d="M 411.78333 134.5 c 0.61069 1.60001 1.27625 2.35789 1.87152 2.7 c 0.84811 0.4874 1.81516 0.70001 2.48849 0.90001" stroke-width="27.71787625" transform="matrix(2.5 0 0 2.5 -985 -291)"/></g>
<g transform="translate(600 0)" fill="none" stroke="black"><path d="M17.742 19.611 C17.747 19.606 18.174 19.165 19.12 19.441" stroke-width="2" stroke-linecap="round" transform="matrix(20 0 0 20 -318.6 -337.8)"/></g>
</svg>
