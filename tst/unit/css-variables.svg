<svg xmlns="http://www.w3.org/2000/svg" width="66" height="170">
<!-- Each lime square fills its black outline, and nothing red shows. A
property whose name starts with two dashes is a custom property: its
name keeps its case, its value is the tokens written, empty ones too,
and it inherits; initial makes it the guaranteed-invalid value, inherit,
unset and revert its parent's. var() puts a custom property's tokens in
a value, in a sheet, a style attribute or a presentation attribute, at
computed-value time: its value, else its fallback, substituted in turn,
the name itself perhaps from a var(), and a name that is no custom
property's, -- too, the fallback's again; tokens stay tokens, so a
number before an ident is no dimension. A value it leaves invalid, a
var() of nothing without a fallback, or a cycle among custom properties,
makes the declaration invalid at computed-value time: unset, no lower
declaration, but revert-layer and revert-rule from a fallback do revert;
a substitution of more than 16384 tokens, into a custom property or any
other, or past the half million a document may write, gives the
guaranteed-invalid value, as a chain of more than 32 custom properties
does; a var() or env() of no first argument makes it invalid as it is
read, so a lower one does win. A shorthand's longhands take its value
once it is substituted; all takes keywords alone, and resets no custom
property. An instance takes its custom properties from its use. env()
has no variable here and takes its fallback, in a custom property too. A
mask attribute of var() is the shorthand's, substituted. -->
<rect width="66" height="170" fill="white"/>
<style><![CDATA[
