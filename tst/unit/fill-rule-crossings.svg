<svg xmlns="http://www.w3.org/2000/svg" width="64" height="44">
<!-- No red; blue shows in the holes only. nonzero: an inner subpath of the
same direction fills, of the opposite one makes a hole, a pentagram's middle
fills; evenodd: every inner subpath and the pentagram's middle are holes. -->
<g fill="red"><rect x="3" y="3" width="16" height="16"/><path d="M 23 3 H 39 V 19 H 23 Z M 26 6 V 16 H 36 V 6 Z" fill-rule="evenodd"/>
<path d="M 43 3 H 59 V 19 H 43 Z M 46 6 V 16 H 56 V 6 Z" fill-rule="evenodd"/></g>
<g fill="blue"><rect x="28" y="8" width="6" height="6"/><rect x="48" y="8" width="6" height="6"/></g>
<path d="M 2 2 H 20 V 20 H 2 Z M 7 7 H 15 V 15 H 7 Z" fill="lime"/>
<path d="M 22 2 H 40 V 20 H 22 Z M 27 7 V 15 H 35 V 7 Z" fill="lime"/>
<g fill-rule="evenodd"><path d="M 42 2 H 60 V 20 H 42 Z M 47 7 H 55 V 15 H 47 Z" fill="lime"/></g>
<rect x="9.5" y="30" width="3" height="3" fill="red"/>
<rect x="41.5" y="30" width="3" height="3" fill="blue"/>
<path d="M 11 23 L 16 39 L 3 29 H 19 L 6 39 Z" fill="lime"/>
<path d="M 43 23 L 48 39 L 35 29 H 51 L 38 39 Z" fill="lime" fill-rule="evenodd"/>
</svg>
