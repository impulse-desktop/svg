<svg xmlns="http://www.w3.org/2000/svg" width="72" height="34">
<!-- Each lime drawing fills its black outline; the grey runs on into the
grey under it without a step. A filter's region is by default -10% and
120% of the box, or as given in user space, and cuts what is shifted past
it; primitiveUnits objectBoundingBox scales an offset by the box, and one
radius to both axes before; the filter inherits from its own ancestors,
here sRGB; under display none it still applies; filterRes is gone and
changes nothing. -->
<defs><filter id="fl"><feFlood flood-color="lime"/></filter>
<filter id="us" filterUnits="userSpaceOnUse" x="14" y="3" width="6" height="8"><feFlood flood-color="lime"/></filter>
<filter id="off"><feOffset dx="6"/></filter>
<filter id="pu" x="-1" y="-1" width="3" height="3" primitiveUnits="objectBoundingBox"><feOffset dx=".5"/></filter>
<filter id="pr" x="-1" y="-1" width="3" height="3" primitiveUnits="objectBoundingBox"><feMorphology operator="dilate" radius=".1"/></filter>
<g color-interpolation-filters="sRGB"><filter id="cif" x="0" y="0" width="1" height="1"><feColorMatrix type="saturate" values="0"/></filter></g>
<g display="none"><filter id="dn" display="none"><feFlood flood-color="lime"/></filter></g>
<filter id="res" filterRes="2"><feFlood flood-color="lime"/></filter></defs>
<rect width="72" height="34" fill="white"/>
<rect x="3" y="3" width="10" height="10" fill="red" filter="url(#fl)"/>
<rect x="16" y="4" width="4" height="4" fill="red" filter="url(#us)"/>
<rect x="22" y="3" width="10" height="10" fill="lime" filter="url(#off)"/>
<rect x="36" y="3" width="10" height="6" fill="lime" filter="url(#pu)"/>
<rect x="4" y="20" width="20" height="10" fill="lime" filter="url(#pr)"/>
<rect x="30" y="18" width="8" height="6" fill="#cc4d1a" filter="url(#cif)"/><rect x="30" y="24" width="8" height="6" fill="#646464"/>
<rect x="44" y="20" width="10" height="10" fill="red" filter="url(#dn)"/>
<rect x="59" y="20" width="10" height="10" fill="red" filter="url(#res)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="12" height="12"/><rect x="14" y="3" width="6" height="8"/><rect x="28" y="3" width="5" height="10"/><rect x="41" y="3" width="10" height="6"/>
<rect x="2" y="19" width="24" height="12"/><rect x="43" y="19" width="12" height="12"/><rect x="58" y="19" width="12" height="12"/></g>
</svg>
