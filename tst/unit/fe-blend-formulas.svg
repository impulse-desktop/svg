<rect x="38" y="2" width="7" height="6" filter="url(#b4)"/><rect x="38" y="8" width="7" height="6" fill="#c5a0b1" fill-opacity="0.88"/>
<rect x="47" y="2" width="7" height="6" filter="url(#b5)"/><rect x="47" y="8" width="7" height="6" fill="#76759d" fill-opacity="0.88"/>
<rect x="56" y="2" width="7" height="6" filter="url(#b6)"/><rect x="56" y="8" width="7" height="6" fill="#945c99" fill-opacity="0.88"/>
<rect x="2" y="16" width="7" height="6" filter="url(#b7)"/><rect x="2" y="22" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/>
<rect x="11" y="16" width="7" height="6" filter="url(#b8)"/><rect x="11" y="22" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/>
<rect x="20" y="16" width="7" height="6" filter="url(#b9)"/><rect x="20" y="22" width="7" height="6" fill="#59779b" fill-opacity="0.88"/>
<rect x="29" y="16" width="7" height="6" filter="url(#b10)"/><rect x="29" y="22" width="7" height="6" fill="#cc4d1a" fill-opacity="0.7"/>
<rect x="38" y="16" width="7" height="6" filter="url(#b11)"/><rect x="38" y="22" width="7" height="6" fill="#6a3b18" fill-opacity="0.7"/>
<rect x="47" y="16" width="7" height="6" filter="url(#b12)"/><rect x="47" y="22" width="7" height="6" fill="#d95a27" fill-opacity="0.7"/>
