<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
<defs>
<filter id="spec"><feSpecularLighting><fePointLight x="0" y="0" z="5"/></feSpecularLighting></filter>
<filter id="bneg"><feGaussianBlur stdDeviation="1 -1"/><feGaussianBlur stdDeviation="2 1"/><feGaussianBlur/></filter>
<filter id="far" filterUnits="userSpaceOnUse" x="0" y="1000" width="48" height="10"><feFlood/></filter>
</defs>
<g fill="teal">
<rect x="2" y="2" width="6" height="6" filter="url(#spec)" transform="rotate(20 5 5)"/>
<rect x="12" y="2" width="6" height="6" filter="url(#bneg)" transform="rotate(20 15 5)"/>
<rect x="22" y="2" width="6" height="6" filter="url(#far)" transform="rotate(20 25 5)"/>
<rect x="32" y="2" width="6" height="6" filter="url(#missing)" transform="rotate(20 35 5)"/>
<rect x="2" y="12" width="6" height="6" filter="url(#bneg)" transform="matrix(1 1 0 0 0 12)"/>
<rect x="12" y="12" width="6" height="6" filter="url(#bneg)" transform="matrix(0 1 1 1 0 0)"/>
<rect x="2" y="500" width="6" height="6" filter="url(#far)"/>
</g>
</svg>
