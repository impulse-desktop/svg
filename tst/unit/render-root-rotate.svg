<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" transform="rotate(90 8 8)">
<!-- rotate(90 8 8) on the outermost svg turns about 8 8 from the
transform-origin, the centre at 8 8, so about 16 16 in all: the lime bar
drawn at 2 20 lands along the top, from 4 2 to 12 6, where its expected
drawing has it; a turn about 8 8 alone would leave it outside. -->
<rect x="2" y="20" width="4" height="8" fill="lime"/>
</svg>
