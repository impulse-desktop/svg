<svg xmlns="http://www.w3.org/2000/svg" width="64" height="8">
<!-- Recursion is a repeated URL resource in the active reference chain.
A repeated filter reference keeps the existing unfiltered source fallback;
an already active image/use target contributes no drawing. Two clients
referencing the same filter still reference the same resource. The paired
pattern cases check that reuse preserves this meaning in either order. -->
<svg x="0" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f0" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r0"/></filter><rect id="r0" x="2" y="2" width="4" height="4" fill="#e23" filter="url(#f0)"/></defs><rect width="8" height="8" fill="blue" filter="url(#f0)"/></svg>
<svg x="8" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r1"/></filter></defs><rect id="r1" x="2" y="2" width="4" height="4" fill="#e23" filter="url(#f1)"/></svg>
<svg x="16" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f2" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r2"/></filter><g id="r2" filter="url(#f2)"><rect x="2" y="2" width="4" height="4" fill="#e23"/></g></defs><use href="#r2"/></svg>
<svg x="24" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f3" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r3"/></filter><filter id="g3" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r3"/></filter><rect id="r3" x="2" y="2" width="4" height="4" fill="#e23" filter="url(#g3)"/></defs><rect width="8" height="8" filter="url(#f3)"/></svg>
<svg x="32" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f4" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#t4"/></filter><rect id="t4" width="8" height="8" fill="url(#p4)"/><pattern id="p4" patternUnits="userSpaceOnUse" width="8" height="8"><use href="#r4"/></pattern></defs><g opacity=".5"><rect id="r4" width="8" height="8" fill="#e23" filter="url(#f4)"/></g><g opacity=".5"><rect width="8" height="8" fill="blue" filter="url(#f4)"/></g></svg>
<svg x="40" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f5" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#t5"/></filter><rect id="t5" width="8" height="8" fill="url(#p5)"/><pattern id="p5" patternUnits="userSpaceOnUse" width="8" height="8"><use href="#r5"/></pattern></defs><g opacity=".5"><rect width="8" height="8" fill="blue" filter="url(#f5)"/></g><g opacity=".5"><rect id="r5" width="8" height="8" fill="#e23" filter="url(#f5)"/></g></svg>
<svg x="48" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f6" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r6"/></filter><rect id="r6" x="2" y="2" width="4" height="4" fill="lime"/></defs><rect width="8" height="8" filter="url(#f6)"/></svg>
<svg x="56" width="8" height="8" viewBox="0 0 8 8"><defs><filter id="f7" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feImage x="0" y="0" width="8" height="8" href="#r7"/></filter><rect id="r7" x="2" y="2" width="4" height="4" fill="#e23" filter="url(#f7)"/></defs><rect x="2" y="2" width="4" height="4" fill="blue" filter="url(#f7)"/></svg>
</svg>
