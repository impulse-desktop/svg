<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- Filter paint inputs are the target element paint with infinite
extent. Empty SourceGraphic does not empty a solid or user-space paint
server. Literal rectangles, checker cells and analytic ramp pixels
define the expected drawing. -->
<defs><filter id="empty-fill" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feOffset in="FillPaint"/></filter><filter id="empty-stroke" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feOffset in="StrokePaint"/></filter><filter id="empty-source" filterUnits="userSpaceOnUse" x="0" y="0" width="8" height="8"><feOffset/></filter><pattern id="empty-checker" patternUnits="userSpaceOnUse" width="2" height="2"><rect width="1" height="1" fill="lime"/><rect x="1" y="1" width="1" height="1" fill="blue"/></pattern><linearGradient id="empty-ramp" gradientUnits="userSpaceOnUse" x2="8"><stop stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient><linearGradient id="empty-bbox"><stop stop-color="lime"/><stop offset="1" stop-color="lime"/></linearGradient></defs>
<g transform="translate(0 0)"><g fill="lime" filter="url(#empty-fill)"/></g>
<g transform="translate(16 0)"><g stroke="lime" filter="url(#empty-stroke)"/></g>
<g transform="translate(32 0)"><g fill="url(#empty-checker)" filter="url(#empty-fill)"/></g>
<g transform="translate(48 0)"><g fill="url(#empty-ramp)" filter="url(#empty-fill)"/></g>
<g transform="translate(0 8)"><g fill="url(#empty-bbox)" filter="url(#empty-fill)"/></g>
<g transform="translate(16 8)"><g fill="lime" filter="url(#empty-source)"/></g>
<g transform="translate(32 8)"><g fill="lime" filter="url(#empty-fill)"><rect width="8" height="8" fill="none"/></g></g>
<g transform="translate(48 8)"><g opacity=".5" fill="lime" filter="url(#empty-fill)"/></g>
</svg>
