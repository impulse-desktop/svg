<svg xmlns="http://www.w3.org/2000/svg" width="66" height="66">
<!-- Each lime square fills its black outline, and nothing red shows.
revert rolls a property back past every author declaration and
presentation attribute, to an inherited or initial value; revert-layer
to the highest declaration of an earlier layer, then to a presentation
attribute, from an important one past everything between its layer
normal and important, from the style attribute to the sheets, important
or not; revert-rule as if its rule were not there, again while what it
reaches reverts; a geometry property, a shorthand and all revert the
same, the keywords in any case. -->
<rect width="66" height="66" fill="white"/>
<style><![CDATA[
.c0 .t { fill: red } .c0 .t { fill: revert }
.c1 .t { fill: revert }
@layer a7 { .c2 .t { fill: lime } } @layer b7 { .c2 .t { fill: revert-layer } }
@layer a8 { .c3 .t { fill: revert-layer } }
@layer a9 { .c4 .t { fill: lime } } .c4 .t { fill: revert-layer }
.c5 .t { fill: revert-layer }
@layer a10 { .c7 .t { fill: red } } @layer b10 { .c7 .t { fill: red } } @layer a10 { .c7 .t { fill: revert-layer !important } }
@layer a22 { .c8 .t { fill: lime } } @layer b22 { .c8 .t { fill: revert-layer } } .c8 .t { fill: revert-layer !important }
.c9 .t { fill: lime }
.c10 .t { fill: red } .c10 .t { fill: lime !important }
.c11 .t { fill: lime } .c11 .t { fill: revert-rule; stroke: none }
.c12 .t { fill: lime } .c12 .t { fill: revert-rule } .c12 .t { fill: revert-rule }
.c13 .t { fill: lime } .c13 .t { fill: red; fill: revert-rule }
.c14 .t { fill: REVERT-RULE } .c14 .t { fill: lime }
.c15 > rect.t { fill: lime } .c15 .t { fill: red } .c15 > rect.t.t { fill: revert-rule }
.c16 > .t { width: revert }
@layer g1 { .c17 .t { width: 6px } } .c17 .t { width: revert-layer }
.c18 .t { width: 2px; width: revert-rule }
.c19 .t { mask: url(#none) } .c19 .t { mask: revert }
.c21 .t { mask: inherit }
]]></style>
<g class="c0" transform="translate(2 2)"><g fill="lime"><rect class="t" width="6" height="6"/></g></g><g class="c1" transform="translate(10 2)"><g fill="lime"><rect class="t" width="6" height="6" fill="red"/></g></g>
<g class="c2" transform="translate(2 10)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c3" transform="translate(10 10)"><rect class="t" width="6" height="6" fill="lime"/></g><g class="c4" transform="translate(18 10)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c5" transform="translate(26 10)"><g fill="lime"><rect class="t" width="6" height="6"/></g></g><g class="c6" transform="translate(34 10)"><g fill="lime"><rect class="t" width="6" height="6" fill="revert-layer"/></g></g>
<g class="c7" transform="translate(2 18)"><rect class="t" width="6" height="6" fill="lime"/></g><g class="c8" transform="translate(10 18)"><rect class="t" width="6" height="6" fill="red"/></g>
<g class="c9" transform="translate(2 26)"><rect class="t" width="6" height="6" fill="red" style="fill: revert-layer"/></g><g class="c10" transform="translate(10 26)"><rect class="t" width="6" height="6" fill="red" style="fill: revert-layer !important"/></g>
<g class="c11" transform="translate(2 34)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c12" transform="translate(10 34)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c13" transform="translate(18 34)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c14" transform="translate(26 34)"><rect class="t" width="6" height="6" fill="red"/></g><g class="c15" transform="translate(34 34)"><rect class="t" width="6" height="6" fill="red"/></g>
<g class="c16" transform="translate(2 42)"><rect width="6" height="6" fill="lime"/><rect class="t" width="6" height="6" fill="red"/></g><g class="c17" transform="translate(10 42)"><rect class="t" width="2" height="6" fill="lime"/></g><g class="c18" transform="translate(18 42)"><rect class="t" width="6" height="6" fill="lime"/></g>
<g class="c19" transform="translate(2 50)"><rect class="t" width="6" height="6" fill="lime"/></g><g class="c20" transform="translate(10 50)"><g fill="lime"><rect class="t" fill="red" style="all: revert; width: 6px; height: 6px"/></g></g>
<g class="c21" transform="translate(2 58)"><rect class="t" width="6" height="6" fill="lime"/></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="6" height="6"/><rect x="10" y="2" width="6" height="6"/><rect x="2" y="10" width="6" height="6"/><rect x="10" y="10" width="6" height="6"/><rect x="18" y="10" width="6" height="6"/><rect x="26" y="10" width="6" height="6"/><rect x="34" y="10" width="6" height="6"/><rect x="2" y="18" width="6" height="6"/><rect x="10" y="18" width="6" height="6"/><rect x="2" y="26" width="6" height="6"/><rect x="10" y="26" width="6" height="6"/><rect x="2" y="34" width="6" height="6"/><rect x="10" y="34" width="6" height="6"/><rect x="18" y="34" width="6" height="6"/><rect x="26" y="34" width="6" height="6"/><rect x="34" y="34" width="6" height="6"/><rect x="2" y="42" width="6" height="6"/><rect x="10" y="42" width="6" height="6"/><rect x="18" y="42" width="6" height="6"/><rect x="2" y="50" width="6" height="6"/><rect x="10" y="50" width="6" height="6"/><rect x="2" y="58" width="6" height="6"/></g>
</svg>
