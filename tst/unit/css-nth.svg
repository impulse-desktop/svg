.c18 > :nth-child(3), .c18 > :nth-child(1) { fill: red } .c18 > * { fill: lime }
.c19 > :nth-child(0n+0), .c19 > :nth-child(-n+0) { fill: red } .c19 > * { fill: lime }
.c20 > :nth-child(+ n), .c20 > * { fill: red } .c20 > .t { fill: lime }
.c21 > :nth-child(- 1), .c21 > * { fill: red } .c21 > .t { fill: lime }
