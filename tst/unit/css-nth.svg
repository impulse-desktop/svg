.c65 > :nth-child(99999999999) { fill: red } .c65 > .t { fill: lime }
.c66 > :nth-child(-99999999999n+1) { fill: lime }
.c67 > :nth-child(n-99999999999) { fill: lime }
.c68 > :nth-child(1 of :unknown), .c68 > * { fill: red } .c68 > .t { fill: lime }
.c69 > :foo(x), .c69 > * { fill: red } .c69 > .t { fill: lime }
.c70 > .t), .c70 > * { fill: red } .c70 > .t { fill: lime }
]]></style>
