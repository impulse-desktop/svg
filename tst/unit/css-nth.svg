<svg xmlns="http://www.w3.org/2000/svg" width="66" height="146">
<!-- Each lime square fills its black outline, and nothing red shows.
An+B of css-syntax-3: odd, even, An+B with B signed by itself or by a +
or - apart, white space around the parts but not between a sign and its
n or digits, A and B of either sign or none, N and ODD in any case; 0n+0
matches no position, and a form not in the grammar invalidates its
selector. The child-index pseudo-classes of selectors-4 count element
siblings from 1, text and comments not: :nth-child() and :nth-last-
child(), "of S" counting only the siblings S matches, :nth-of-type() and
:nth-last-of-type() of the same element type, the first, last and only
forms, :empty with no child element nor text (white space, an entity or
a character reference count; a comment, a processing instruction or an
empty CDATA section do not), :root. -->
<rect width="66" height="146" fill="white"/>
<style><![CDATA[
.c0 > :nth-child(odd) { fill: lime }
.c1 > :nth-child(even) { fill: lime }
.c2 > :nth-child(ODD) { fill: lime }
.c3 > :nth-child(3) { fill: lime }
.c4 > :nth-child(+2) { fill: lime }
.c5 > :nth-child(2n+1) { fill: lime }
