<svg xmlns="http://www.w3.org/2000/svg" width="66" height="58">
<!-- Each lime square fills its black outline, and nothing red shows. An+B of css-syntax-3: odd, even, An+B with B signed by itself or by a + or - apart, white space around the parts but not between a sign and its n or digits, A and B of either sign or none, N and ODD in any case; 0n+0 matches no position, and a form not in the grammar invalidates its selector. The child-index pseudo-classes of selectors-4 count element siblings from 1: :nth-child() and :nth-last-child(), "of S" counting only the siblings S matches, :nth-of-type() and :nth-last-of-type() of the same element type, the first, last and only forms, :empty with no child element nor text (white space, an entity or a character reference count; a comment, a processing instruction or an empty CDATA section do not), :root. -->
<rect width="66" height="58" fill="white"/>
<style><![CDATA[
.c0 > :nth-child(odd) { fill: lime }
.c1 > :nth-child(even) { fill: lime }
.c2 > :nth-child(2n+1) { fill: lime }
.c3 > :nth-child(2n-1) { fill: lime }
.c4 > :nth-child( 3n + 1 ) { fill: lime }
.c5 > :nth-child(n) { fill: lime }
.c6 > :nth-child(-n+3) { fill: lime }
.c7 > :nth-child(+n) { fill: lime }
.c8 > :nth-child(3) { fill: lime }
.c9 > :nth-child(+2) { fill: lime }
.c10 > :nth-child(2N+1) { fill: lime }
.c11 > :nth-child(ODD) { fill: lime }
.c12 > :nth-child(-2n+3) { fill: lime }
.c13 > :nth-child(n- 1) { fill: lime }
.c14 > :nth-child(2n -1) { fill: lime }
.c15 > :nth-child(2n+ 1) { fill: lime }
.c16 > :nth-child(0n+0), .c16 > :nth-child(-n+0) { fill: red } .c16 > * { fill: lime }
.c17 > :nth-child(+ n), .c17 > * { fill: red } .c17 > .t { fill: lime }
.c18 > :nth-child(- 1), .c18 > * { fill: red } .c18 > .t { fill: lime }
.c19 > :nth-child(2n- -1), .c19 > * { fill: red } .c19 > .t { fill: lime }
.c20 > :nth-child(2n 1), .c20 > * { fill: red } .c20 > .t { fill: lime }
.c21 > :nth-child(n+), .c21 > * { fill: red } .c21 > .t { fill: lime }
.c22 > :nth-child(oddx), .c22 > * { fill: red } .c22 > .t { fill: lime }
.c23 > :nth-child(3), .c23 > :nth-child(1) { fill: red } .c23 > * { fill: lime }
.c24 > :nth-last-child(1) { fill: lime }
.c25 > :nth-last-child(2n) { fill: lime }
.c26 > :nth-child(1 of .t) { fill: lime }
.c27 > :nth-child(2 of g, .t) { fill: lime }
.c28 > :nth-last-child(1 of .t) { fill: lime }
.c29 > :nth-child(1 of circle) { fill: red } .c29 > .t { fill: lime }
.c30 > :nth-of-type(1) { fill: lime }
.c31 > :nth-last-of-type(2) { fill: lime }
.c32 > :first-of-type { fill: lime }
.c33 > :last-of-type { fill: lime }
.c34 > :only-of-type { fill: lime }
.c35 > :only-of-type { fill: red } .c35 > .t { fill: lime }
.c36 > :first-child { fill: lime }
.c37 > :last-child { fill: lime }
.c38 > :only-child { fill: lime }
.c39 > :empty { fill: lime }
.c40 > :empty { fill: red } .c40 > .t { fill: lime }
.c41 > :empty { fill: red } .c41 > .t { fill: lime }
.c42 > :empty { fill: red } .c42 > .t { fill: lime }
.c43 > :empty { fill: lime }
.c44 > :empty { fill: red } .c44 > .t { fill: lime }
.c45 > :empty { fill: red } .c45 > .t { fill: lime }
.c46 > :empty { fill: red } .c46 > .t { fill: lime }
:root > .c47 > .t { fill: lime }
.c48 > :nth-child(99999999999) { fill: red } .c48 > .t { fill: lime }
.c49 > :nth-child(1 of.t), .c49 > * { fill: red } .c49 > .t { fill: lime }
.c50 > :nth-child(1 of :unknown), .c50 > * { fill: red } .c50 > .t { fill: lime }
.c51 > :foo(x), .c51 > * { fill: red } .c51 > .t { fill: lime }
.c52 > .t), .c52 > * { fill: red } .c52 > .t { fill: lime }
]]></style>
