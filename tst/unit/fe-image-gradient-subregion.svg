<svg xmlns="http://www.w3.org/2000/svg" width="80" height="16">
<!-- An explicit fractional feImage subregion retains one exact
rectangle coverage. Independent straight SVG stop interpolation and
alpha, in and normal-over equations check sRGB and linearRGB filter
spaces, out-of-range stop clamping and SVG rect opacity. -->
<svg x="0" width="20" height="16"><defs><filter id="f0" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="13.5" height="9.25" color-interpolation-filters="sRGB"><feImage x="2.25" y="2.5" width="13.5" height="9.25" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/></filter></defs><rect x="2.25" y="2.5" width="13.5" height="9.25" fill="#5c6b79" filter="url(#f0)"/></svg>
<svg x="20" width="20" height="16"><defs><filter id="f1" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="13.5" height="9.25" color-interpolation-filters="linearRGB"><feImage x="2.25" y="2.5" width="13.5" height="9.25" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/></filter></defs><rect x="2.25" y="2.5" width="13.5" height="9.25" fill="#5c6b79" filter="url(#f1)"/></svg>
<svg x="40" width="20" height="16"><defs><filter id="f2" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="13.5" height="9.25" color-interpolation-filters="sRGB"><feImage x="2.25" y="2.5" width="13.5" height="9.25" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/><feComposite operator="in" in2="SourceGraphic"/></filter></defs><rect x="2.25" y="2.5" width="13.5" height="9.25" fill="#5c6b79" filter="url(#f2)"/></svg>
<svg x="60" width="20" height="16"><defs><filter id="f3" filterUnits="userSpaceOnUse" x="2.25" y="2.5" width="13.5" height="9.25" color-interpolation-filters="linearRGB"><feImage x="2.25" y="2.5" width="13.5" height="9.25" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/><feComposite operator="in" in2="SourceGraphic"/><feBlend in2="SourceGraphic"/></filter></defs><rect x="2.25" y="2.5" width="13.5" height="9.25" fill="#5c6b79" filter="url(#f3)"/></svg>
</svg>
