<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60">
<!-- Exact rectangle coverage feeds feOffset, a diagonal RGB colour
matrix, a normalized Gaussian and normal SourceGraphic blending.
Independent expectations check default linearRGB, sRGB, translucent
source, negative fractional offset, zero blur, a black shadow, zero
shadow alpha, blur in only one axis and deviations just below two
pixels. -->
<svg x="2" y="2" width="16" height="16" overflow="hidden"><defs><filter id="f0" filterUnits="userSpaceOnUse" x="0" y="0" width="16" height="16"><feOffset in="SourceGraphic" dx="0.75" dy="1.25" result="shift"/><feColorMatrix in="shift" values="0.2 0 0 0 0 0 0.2 0 0 0 0 0 0.2 0 0 0 0 0 1 0" result="dark"/><feGaussianBlur in="dark" stdDeviation="0.6 0.75" result="blur"/><feBlend in="SourceGraphic" in2="blur" mode="normal"/></filter></defs><rect x="3.25" y="2.5" width="7.5" height="5.25" fill="#ff8040" fill-opacity="1" filter="url(#f0)"/></svg>
<svg x="22" y="2" width="16" height="16" overflow="hidden"><defs><filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0" width="16" height="16" color-interpolation-filters="sRGB"><feOffset in="SourceGraphic" dx="0.75" dy="1.25" result="shift"/><feColorMatrix in="shift" values="0.2 0 0 0 0 0 0.2 0 0 0 0 0 0.2 0 0 0 0 0 1 0" result="dark"/><feGaussianBlur in="dark" stdDeviation="0.6 0.75" result="blur"/><feBlend in="SourceGraphic" in2="blur" mode="normal"/></filter></defs><rect x="3.25" y="2.5" width="7.5" height="5.25" fill="#ff8040" fill-opacity="1" filter="url(#f1)"/></svg>
