<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xi="http://www.w3.org/2001/XInclude"
     width="16"
     height="16">
  <style type="text/css">
    rect,path,ellipse,circle,polygon {
      fill: rgb(46,52,54) !important;
    }
    .warning {
      fill: rgb(245,121,62) !important;
    }
    .error {
      fill: rgb(204,0,0) !important;
    }
    .success {
      fill: rgb(78,154,6) !important;
    }
  </style>
  <g opacity="0.8" ><xi:include href="data:text/xml;base64,"/></g>
</svg>