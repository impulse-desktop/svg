<!-- PNG 3 recommends gAMA as the fallback for decoders that do not use iCCP.
The source texel is RGBA (237,28,36,128); the independent gAMA=45455
plus sRGB transfer equations give (238,21,31,128). sRGB takes priority
over gAMA; an iCCP-only image has no transfer fallback in this viewer.
The final PNG is palette+tRNS with the same texel and sRGB cHRM. -->
<image id="gamma-alone" x="0" width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAABGdBTUEAALGPC/xhBQAAAA1JREFUeJxjeCuj0gAABNUBrtMSKoQAAAAASUVORK5CYII="/>
<image id="icc-gamma-fallback" x="16" width="16" height="16" href="data:image/png;base64,"/>
<image id="icc-no-gamma" x="32" width="16" height="16" href="data:image/png;base64,"/>
<image id="srgb-over-gamma" x="48" width="16" height="16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAANSURBVHicY3gro9IAAATVAa7TEiqEAAAAAElFTkSuQmCC"/>
<image id="palette-icc-gamma" x="64" width="16" height="16" href="data:image/png;base64,"/>
