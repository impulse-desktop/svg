<svg xmlns="http://www.w3.org/2000/svg" width="64" height="28">
<!-- Lime everywhere, no red: a server reference that resolves ignores its
fallback; one that does not, to nothing or to an element that is no paint
server, takes the fallback, and without one paints nothing. -->
<defs>
<linearGradient id="g"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="lime"/></linearGradient>
<rect id="r" width="1" height="1"/>
<clipPath id="c"><rect width="1" height="1"/></clipPath>
</defs>
<g fill="red">
<rect x="3" y="3" width="8" height="8"/><rect x="15" y="3" width="8" height="8"/><rect x="27" y="3" width="8" height="8"/>
<rect x="39" y="3" width="8" height="8"/><rect x="51" y="3" width="8" height="8"/>
</g>
<rect x="2" y="2" width="10" height="10" fill="url(#g) red"/>
<rect x="14" y="2" width="10" height="10" fill="url(#missing) lime"/>
<rect x="26" y="2" width="10" height="10" fill="url(#r) lime"/>
<rect x="38" y="2" width="10" height="10" fill="url(#c) lime"/>
<rect x="50" y="2" width="10" height="10" fill="url(#missing) currentColor" color="lime"/>
<g fill="lime"><rect x="2" y="16" width="10" height="10"/><rect x="14" y="16" width="10" height="10"/>
<rect x="26" y="16" width="10" height="10"/><rect x="38" y="16" width="10" height="10"/><rect x="50" y="16" width="10" height="10"/></g>
<rect x="2" y="16" width="10" height="10" fill="url(#missing)"/>
<rect x="14" y="16" width="10" height="10" fill="url(#missing) none"/>
<rect x="26" y="16" width="10" height="10" fill="url(#r)"/>
<rect x="38" y="16" width="10" height="10" fill="none"/>
<rect x="51" y="17" width="8" height="8" fill="none" stroke="url(#c)" stroke-width="3"/>
</svg>
