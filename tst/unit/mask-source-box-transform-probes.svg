<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32">
<!-- The sloped source line has bbox[-10,-.1,10,.1]. Its default120%
object-bbox mask region is[-12,-.12,12,.12], before the affine transform.
The shear makes the centreline horizontal but keeps that nonempty region.
Complete probes are analytically inside or outside the transformed mask
and inside the stroke band. No edge samples or curve allowance are used. -->
