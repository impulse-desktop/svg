<svg xmlns="http://www.w3.org/2000/svg" width="64" height="62">
<!-- Each lime stroke follows the same path spelled out in black, and
each lime square covers its red one alone; no red. A d of none, as a
property too, and data with no valid command draw nothing and add
nothing to the group's bounding box, which the square fills; a unit on a
number, a comma in it and two adjacent points are errors, the path drawn
up to the segment before, as is a comma after a closepath. A first
relative moveto is absolute, the pairs after a moveto are linetos, H and
V take lists, a number ending in one point before a separator is
accepted, a closepath joins where a lineto back leaves butt ends, and
the arc flags pick one of four arcs. -->
<rect width="64" height="62" fill="white"/>
<defs><filter id="none-box" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter><filter id="empty-box" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter></defs>
<g fill="none" stroke="red" stroke-width="2"><path d="none"/><path/><path d="M 44 5 h 2" style="d: none"/></g><g filter="url(#none-box)"><rect x="41" y="2" width="6" height="6" fill="red"/><path d="none"/><path/><path d="M 0 0 h 2" style="d: none"/></g>
<g fill="none" stroke="red" stroke-width="2"><path d="L 56 5 h 2"/><path d="X 56 5 h 2"/><path d="56 5 h 2"/><path d=""/></g><g filter="url(#empty-box)"><rect x="53" y="2" width="6" height="6" fill="red"/><path d="L 0 0 h 2"/><path d="X 0 0 h 2"/><path d="0 0 h 2"/><path d=""/></g>
