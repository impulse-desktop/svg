dth="20" height="20" fill="none" stroke="rgb(128,128,128)"/><rect x="9" y="3" width="20" height="20" fill="none" stroke="rgb(0,255,255)"/></pattern><marker id="marker-fill" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" refX="0" refY="2" viewBox="0 0 4 4" orient="0"><rect width="4" height="4" fill="url(#cf)"/></marker><marker id="marker-stroke" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" refX="0" refY="2" viewBox="0 0 4 4" orient="0"><rect width="4" height="4" fill="url(#cs)"/></marker><pattern id="d0" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="red"/></pattern><pattern id="d1" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/><rect width="4" height="4" fill="url(#d0)"/></pattern><pattern id="d2" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/><rect width="4" height="4" fill="url(#d1)"/></pattern><pattern id="d3" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/><rect width="4" height="4" fill="url(#d2)"/></pattern><pattern id="d4" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/><rect width="4" height="4" fill="url(#d3)"/></pattern><pattern id="d5" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/><rect width="4" height="4" fill="url(#d4)"/></pattern><pattern id="d6" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/><rect width="4" height="4" fill="url(#d5)"/></pattern><pattern id="last" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="url(#d6)"/><rect width="4" height="4" fill="lime"/></pattern></defs>
