<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64">
<!-- Each pattern matches independently placed colored rectangles.
Repeated references retain opacity, transforms, reference boxes, use and
marker paints, and fallback. The last finite graph ends in an opaque
lime square; none of its earlier red paint remains. -->
