<svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" style="background: linear-gradient(lime, lime) right 2px top / 4px 4px no-repeat fixed padding-box white">
<!-- The background shorthand sets each layer's image, position, size
after a slash, repeat, attachment and box in any order, and the colour
in its final layer: lime 4 by 4 at the right, over white. -->
</svg>
