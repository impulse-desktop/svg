<svg xmlns="http://www.w3.org/2000/svg" width="254" height="194">
<!-- Reflected and quarter-turned symmetric bumps keep their distant
light's azimuth in the output frame; a point light instead follows its
position in primitiveUnits. Scaling still scales the surface height in
those units. -->
<rect width="254" height="194" fill="white"/>
<filter id="diffuse" filterUnits="userSpaceOnUse" x="0" y="0" width="60" height="60" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feDiffuseLighting in="blur" surfaceScale="10" diffuseConstant="1" lighting-color="white" result="light"><feDistantLight azimuth="235" elevation="13"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="specular" filterUnits="userSpaceOnUse" x="0" y="0" width="60" height="60" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feSpecularLighting in="blur" surfaceScale="10" specularConstant="1" specularExponent="5" lighting-color="white" result="light"><feDistantLight azimuth="235" elevation="13"/></feSpecularLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="point-local" filterUnits="userSpaceOnUse" x="0" y="0" width="60" height="60" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feDiffuseLighting in="blur" surfaceScale="10" diffuseConstant="1" lighting-color="white" result="light"><fePointLight x="15" y="20" z="25"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="point-reflected" filterUnits="userSpaceOnUse" x="0" y="0" width="60" height="60" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feDiffuseLighting in="blur" surfaceScale="10" diffuseConstant="1" lighting-color="white" result="light"><fePointLight x="45" y="20" z="25"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="point-turned" filterUnits="userSpaceOnUse" x="0" y="0" width="60" height="60" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feDiffuseLighting in="blur" surfaceScale="10" diffuseConstant="1" lighting-color="white" result="light"><fePointLight x="40" y="15" z="25"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="scale-local" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/><feDiffuseLighting in="blur" surfaceScale="5" diffuseConstant="1" lighting-color="white" result="light"><feDistantLight azimuth="235" elevation="13"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<filter id="scale-output" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/><feDiffuseLighting in="blur" surfaceScale="10" diffuseConstant="1" lighting-color="white" result="light"><feDistantLight azimuth="235" elevation="13"/></feDiffuseLighting><feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k3="0.6"/></filter>
<g transform="translate(2 2)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#diffuse)"/></g>
<g transform="translate(65 2)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#diffuse)" transform="translate(60 0) scale(-1 1)"/></g>
<g transform="translate(128 2)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#diffuse)" transform="translate(0 60) scale(1 -1)"/></g>
<g transform="translate(191 2)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#diffuse)" transform="rotate(90 30 30)"/></g>
<g transform="translate(2 66)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#specular)"/></g>
<g transform="translate(65 66)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#specular)" transform="translate(60 0) scale(-1 1)"/></g>
<g transform="translate(128 66)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#specular)" transform="translate(0 60) scale(1 -1)"/></g>
<g transform="translate(191 66)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#specular)" transform="rotate(90 30 30)"/></g>
<g transform="translate(2 130)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#point-local)" transform="translate(60 0) scale(-1 1)"/></g>
<g transform="translate(65 130)"><rect x="10" y="10" width="40" height="40" fill="#9dab89" filter="url(#point-local)" transform="rotate(90 30 30)"/></g>
<g transform="translate(128 130)"><rect x="5" y="5" width="20" height="20" fill="#9dab89" filter="url(#scale-local)" transform="scale(2)"/></g>
</svg>
