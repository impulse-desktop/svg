<!-- Literal normal offsets enclose each entire lime probe. Exact decimal
coordinates keep the stationary endpoint and omit a genuinely zero Z edge.
For each direction/subdivision/transform, the contour winding at the probe
centre is nonzero and every offset chord avoids the probe expanded by .03
source units; analytic normal-offset error is at most .0002. Each probe
therefore lies inside the retained closed outline, including at the tight
bend. This follows from source geometry, without a browser pixel oracle. -->
