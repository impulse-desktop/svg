<svg xmlns="http://www.w3.org/2000/svg" width="80" height="16">
<!-- Each lime drawing fills its black outline, no red. BackgroundImage is
what the current isolation group drew before the filtered element: shifted
right it brings the lime outside along, at the root, in a plain group and
in one with the enable-background of SVG 1.1, which Filter Effects drops;
inside an isolated group it holds only the group's navy. BackgroundAlpha is
its alpha, here flooded lime where the isolated group drew. -->
<defs><filter id="sh" x="0" y="0" width="1" height="1"><feOffset in="BackgroundImage" dx="3"/></filter><filter id="ba" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/><feComposite in2="BackgroundAlpha" operator="in"/></filter></defs>
<rect width="80" height="16" fill="white"/>
<rect x="2" y="2" width="6" height="12" fill="lime"/><rect x="8" y="2" width="6" height="12" fill="navy"/><rect x="2" y="2" width="12" height="12" fill="red" filter="url(#sh)"/>
<rect x="18" y="2" width="6" height="12" fill="lime"/><g><rect x="24" y="2" width="6" height="12" fill="navy"/><rect x="18" y="2" width="12" height="12" fill="red" filter="url(#sh)"/></g>
<rect x="34" y="2" width="6" height="12" fill="lime"/><g enable-background="new"><rect x="40" y="2" width="6" height="12" fill="navy"/><rect x="34" y="2" width="12" height="12" fill="red" filter="url(#sh)"/></g>
<rect x="50" y="2" width="6" height="12" fill="lime"/><g style="isolation: isolate"><rect x="56" y="2" width="6" height="12" fill="navy"/><rect x="50" y="2" width="12" height="12" fill="red" filter="url(#sh)"/></g>
<g style="isolation: isolate"><rect x="66" y="2" width="6" height="12" fill="navy"/><rect x="66" y="2" width="12" height="12" fill="red" filter="url(#ba)"/></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="9" height="12"/><rect x="18" y="2" width="9" height="12"/><rect x="34" y="2" width="9" height="12"/><rect x="50" y="2" width="6" height="12"/><rect x="66" y="2" width="6" height="12"/></g>
</svg>
