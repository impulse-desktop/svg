<!-- Each test runs on into the reference under it without a step.
image-rendering pixelated scales an image by nearest neighbour to the
whole multiple of its size nearest the drawn one, each axis apart, and
smooths the rest of the way, here 2.25 by 2.33 from 2, 1.75 by 2.67 from
2 by 3, and whole multiples, which are the nearest neighbour; optimizeSpeed draws as
crisp-edges, optimizeQuality as smooth. -->
