<svg xmlns="http://www.w3.org/2000/svg" width="120" height="164" font-size="16">
<!-- Each lime bar fills its black outline, and nothing red shows; a bar
of a full cell is an infinity clamped to the largest length. The edges
of css-values-4's math functions as widths: NaN in min(), max() and
hypot(); 0- below 0+ and a literal -0 as 0; round() at its argument
ranges and line-width snapped to whole px, a zero multiple 0+ below and
0- above; mod() and rem() at theirs, a zero result of mod() taking the
step's sign; pow() and log() at theirs; tan() at its asymptotes; 32
levels of parentheses or functions and no more; errors of syntax,
arity and type; angles, times, frequencies and resolutions in their
canonical units. Below, lime fills its outline or covers red, or the
test runs on into the reference under it without a step: opacity from
a calc() needing the font, an angle or a length is invalid; a number
attribute takes no percentage; trailing text after an integer's math
function is invalid; a lazy negative stroke width is clamped to none;
a gradient in bounding box units takes calc() lengths and percentages;
a filter angle or marker orient from a percentage or with text after
it is invalid; url() closes at the end of its text and undoes escapes,
quoted or not, of hex digits to six, a code point out of range or zero
the replacement character, a newline escaped in a style sheet nothing;
a filter url() with more text in its parentheses is invalid. -->
