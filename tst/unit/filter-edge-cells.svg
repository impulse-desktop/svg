<svg xmlns="http://www.w3.org/2000/svg" width="100" height="52">
<!-- Each lime drawing fills its black outline, and nothing red shows.
Two floods at half opacity in subregions meeting at a fraction of a
pixel, added, tile without a gap or an overlap: the pixel they share
takes its part from each (D2). feConvolveMatrix's kernel shifting by two
kernel units moves by two kernelUnitLengths in user units, dy dx when
not given, and one device pixel when the length is zero or negative; the
lighting primitives fall back the same. feGaussianBlur's edgeMode
duplicate, wrap and mirror keep a solid square solid to its edges, none,
the initial value, fades them, as a true Gaussian within a leeway. An
arithmetic result, named, is read as any other: doubled to opaque and
shifted within its subregion. A lighting primitive's own y and height
cut its flat, fully lit result. An offset of a huge number of either
sign, a shadow's too, moves its input off the region. -->
<rect width="100" height="52" fill="white"/>
<filter id="ab0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="2" y="2" width="12" height="8"><feFlood flood-color="lime" flood-opacity=".5" x="2" y="2" width="5.5" height="8" result="a"/><feFlood flood-color="lime" flood-opacity=".5" x="7.5" y="2" width="6.5" height="8" result="b"/><feComposite in="a" in2="b" operator="arithmetic" k2="1" k3="1"/></filter><rect x="2" y="2" width="12" height="8" fill="red" filter="url(#ab0)"/><filter id="ab1" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="16" y="2" width="12" height="8"><feFlood flood-color="lime" flood-opacity=".5" x="16" y="2" width="3.25" height="8" result="a"/><feFlood flood-color="lime" flood-opacity=".5" x="19.25" y="2" width="8.75" height="8" result="b"/><feComposite in="a" in2="b" operator="arithmetic" k2="1" k3="1"/></filter><rect x="16" y="2" width="12" height="8" fill="red" filter="url(#ab1)"/>
<filter id="ku0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="34" y="2" width="14" height="14"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" edgeMode="none" kernelUnitLength="2"/></filter><rect x="34" y="2" width="4" height="4" fill="lime" filter="url(#ku0)"/><filter id="ku1" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="50" y="2" width="14" height="14"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" edgeMode="none" kernelUnitLength="3 2"/></filter><rect x="50" y="2" width="4" height="4" fill="lime" filter="url(#ku1)"/><filter id="ku2" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="66" y="2" width="14" height="14"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" edgeMode="none" kernelUnitLength="0"/></filter><rect x="66" y="2" width="4" height="4" fill="lime" filter="url(#ku2)"/><filter id="ku3" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="82" y="2" width="14" height="14"><feConvolveMatrix order="3" kernelMatrix="0 0 0 0 0 0 0 0 1" targetX="2" targetY="2" edgeMode="none" kernelUnitLength="-1"/></filter><rect x="82" y="2" width="4" height="4" fill="lime" filter="url(#ku3)"/>
<filter id="lk0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="2" y="20" width="14" height="14"><feGaussianBlur stdDeviation="2" result="b"/><feDiffuseLighting in="b" surfaceScale="4" lighting-color="lime" kernelUnitLength="0"><feDistantLight azimuth="45" elevation="40"/></feDiffuseLighting></filter><rect x="5" y="23" width="8" height="8" fill="navy" filter="url(#lk0)"/><filter id="lk1" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="18" y="20" width="14" height="14"><feGaussianBlur stdDeviation="2" result="b"/><feDiffuseLighting in="b" surfaceScale="4" lighting-color="lime" kernelUnitLength="-1"><feDistantLight azimuth="45" elevation="40"/></feDiffuseLighting></filter><rect x="21" y="23" width="8" height="8" fill="navy" filter="url(#lk1)"/>
<filter id="em0" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" edgeMode="duplicate"/></filter><rect x="36" y="22" width="10" height="10" fill="lime" filter="url(#em0)"/><filter id="em1" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" edgeMode="wrap"/></filter><rect x="48" y="22" width="10" height="10" fill="lime" filter="url(#em1)"/><filter id="em2" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" edgeMode="mirror"/></filter><rect x="60" y="22" width="10" height="10" fill="lime" filter="url(#em2)"/>
<filter id="en0" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2" edgeMode="none"/></filter><rect x="72" y="22" width="10" height="10" fill="lime" filter="url(#en0)"/><filter id="en1" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="2"/></filter><rect x="84" y="22" width="10" height="10" fill="lime" filter="url(#en1)"/>
<filter id="ar" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="2" y="38" width="30" height="12"><feFlood flood-color="lime" flood-opacity=".5" x="2" y="38" width="12" height="12" result="f"/><feComposite in="f" in2="f" operator="arithmetic" k2="2" result="r"/><feOffset in="r" dx="4"/></filter><rect x="2" y="38" width="30" height="12" fill="red" filter="url(#ar)"/>
<filter id="ls" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="36" y="38" width="12" height="12"><feFlood flood-color="black"/><feDiffuseLighting lighting-color="lime" y="41" height="5"><feDistantLight elevation="90"/></feDiffuseLighting></filter><rect x="36" y="38" width="12" height="12" fill="red" filter="url(#ls)"/>
<filter id="of0"><feOffset dx="1e30"/></filter><filter id="of1"><feOffset dy="-1e30"/></filter><filter id="of2"><feDropShadow dx="-1e30" dy="1e30" stdDeviation="0" flood-color="red"/></filter><rect x="54" y="38" width="12" height="12" fill="lime"/><rect x="54" y="38" width="12" height="12" fill="red" filter="url(#of0)"/><rect x="54" y="38" width="12" height="12" fill="red" filter="url(#of1)"/><rect x="68" y="38" width="12" height="12" fill="lime" filter="url(#of2)"/>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="12" height="8"/><rect x="16" y="2" width="12" height="8"/><rect x="38" y="6" width="4" height="4"/><rect x="56" y="6" width="4" height="4"/><rect x="68" y="4" width="4" height="4"/><rect x="84" y="4" width="4" height="4"/><rect x="36" y="22" width="10" height="10"/><rect x="48" y="22" width="10" height="10"/><rect x="60" y="22" width="10" height="10"/><rect x="6" y="38" width="8" height="12"/><rect x="36" y="41" width="12" height="5"/><rect x="54" y="38" width="12" height="12"/><rect x="68" y="38" width="12" height="12"/></g>
</svg>
