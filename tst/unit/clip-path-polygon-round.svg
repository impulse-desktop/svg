<svg xmlns="http://www.w3.org/2000/svg" width="106" height="34">
<!-- Each lime drawing fills its black outline. polygon() rounds every
vertex by "round" and a length, with a circle tangent to both its sides
whose radius is clamped at each vertex to tan(angle / 2) times half of
either side, so a thin box rounds to a half circle; a concave vertex
rounds the other way; a vertex of a side of no length is not rounded;
the fill rule comes before the rounding. A rounding of no length, of a
percentage, of a negative length or with more after it, or a polygon of
no points is invalid, and the rect draws unclipped. -->
<rect width="106" height="34" fill="white"/>
<rect x="2" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round 3px, 0px 0px, 12px 0px, 12px 12px, 0px 12px)"/><rect x="20" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round 2px, 6px 0px, 12px 12px, 0px 12px)"/>
<rect x="38" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round 1.5px, 0px 0px, 12px 0px, 12px 4px, 4px 4px, 4px 12px, 0px 12px)"/>
<rect x="56" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round 5px, 0px 4px, 12px 4px, 12px 8px, 0px 8px)"/>
<rect x="2" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(evenodd round 2px, 0px 0px, 12px 6px, 0px 12px, 6px 6px)"/>
<rect x="20" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(round 0, 0px 0px, 12px 0px, 12px 12px, 0px 12px)"/><rect x="38" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(round 3px, 0px 0px, 12px 0px, 12px 0px, 12px 12px, 0px 12px)"/>
<rect x="56" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(round, 0 0, 12px 0, 0 12px)"/><rect x="74" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round 10%, 0 0, 12px 0, 0 12px)"/><rect x="74" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(round 2px)"/><rect x="92" y="2" width="12" height="12" fill="lime" style="clip-path: polygon(round -2px, 0 0, 12px 0, 0 12px)"/><rect x="92" y="18" width="12" height="12" fill="lime" style="clip-path: polygon(round 2px x, 0 0, 12px 0, 0 12px)"/>
<g fill="none" stroke="black" stroke-width=".25"><path transform="translate(2 2)" d="M0.0000 3.0000 A3.0000 3.0000 0 0 1 3.0000 0.0000 L9.0000 0.0000 A3.0000 3.0000 0 0 1 12.0000 3.0000 L12.0000 9.0000 A3.0000 3.0000 0 0 1 9.0000 12.0000 L3.0000 12.0000 A3.0000 3.0000 0 0 1 0.0000 9.0000Z"/><path transform="translate(20 2)" d="M4.2111 3.5777 A2.0000 2.0000 0 0 1 7.7889 3.5777 L10.5528 9.1056 A2.0000 2.0000 0 0 1 8.7639 12.0000 L3.2361 12.0000 A2.0000 2.0000 0 0 1 1.4472 9.1056Z"/><path transform="translate(38 2)" d="M0.0000 1.5000 A1.5000 1.5000 0 0 1 1.5000 0.0000 L10.5000 0.0000 A1.5000 1.5000 0 0 1 12.0000 1.5000 L12.0000 2.5000 A1.5000 1.5000 0 0 1 10.5000 4.0000 L5.5000 4.0000 A1.5000 1.5000 0 0 0 4.0000 5.5000 L4.0000 10.5000 A1.5000 1.5000 0 0 1 2.5000 12.0000 L1.5000 12.0000 A1.5000 1.5000 0 0 1 0.0000 10.5000Z"/><path transform="translate(56 2)" d="M0.0000 6.0000 A2.0000 2.0000 0 0 1 2.0000 4.0000 L10.0000 4.0000 A2.0000 2.0000 0 0 1 12.0000 6.0000 L12.0000 6.0000 A2.0000 2.0000 0 0 1 10.0000 8.0000 L2.0000 8.0000 A2.0000 2.0000 0 0 1 0.0000 6.0000Z"/><path transform="translate(2 18)" d="M3.0000 3.0000 A0.6885 0.6885 0 0 1 3.7947 1.8974 L8.4223 4.2111 A2.0000 2.0000 0 0 1 8.4223 7.7889 L3.7947 10.1026 A0.6885 0.6885 0 0 1 3.0000 9.0000 L4.5858 7.4142 A2.0000 2.0000 0 0 0 4.5858 4.5858Z"/><path transform="translate(20 18)" d="M0.0000 0.0000 L12.0000 0.0000 L12.0000 12.0000 L0.0000 12.0000Z"/><path transform="translate(38 18)" d="M0.0000 3.0000 A3.0000 3.0000 0 0 1 3.0000 0.0000 L12.0000 0.0000 L12.0000 0.0000 L12.0000 9.0000 A3.0000 3.0000 0 0 1 9.0000 12.0000 L3.0000 12.0000 A3.0000 3.0000 0 0 1 0.0000 9.0000Z"/><rect x="56" y="18" width="12" height="12"/><rect x="74" y="2" width="12" height="12"/><rect x="74" y="18" width="12" height="12"/><rect x="92" y="2" width="12" height="12"/><rect x="92" y="18" width="12" height="12"/></g>
</svg>
