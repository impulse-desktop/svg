<!-- Each lime square fills its black outline, and nothing red shows.
css-syntax-3's error recovery: the end of a style sheet, a style
attribute or a presentation attribute closes what is open, a function, a
block, an at-rule, a string, a url, a comment, but a qualified rule
whose block never opened is dropped; a newline ends a bad string and
drops its declaration, a quote or parenthesis in an unquoted url drops
its; an invalid selector drops its rule; CDO and CDC tokens are nothing;
@charset is an unknown rule; a declaration without a name and a colon,
an unknown property or a value its grammar refuses is dropped alone;
property names and keywords are ASCII case-insensitive; !important,
spaced, of any case or escaped, marks a declaration, ! and another word
invalidate it. Blocks and functions match their closing tokens as
components: a } inside an unclosed function or parenthesis is the
function's, so an unclosed var( or url( with a space takes in the rest
of the sheet; a url( bad by a space takes in all to its ). In a style
rule's block what is no declaration is a nested rule, which ends at its
own {} block or a ;, so a declaration after a {} block of template text
still applies. Tokens are CSS's: a number with an exponent or a
dimension whose unit starts with e, a hash of an identifier alone an id,
CDO and CDC nothing only at the top of a sheet, elsewhere a rule's
prelude that fails, every code point past ASCII an identifier's (D45).
-->
