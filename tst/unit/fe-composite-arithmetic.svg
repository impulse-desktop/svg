<svg xmlns="http://www.w3.org/2000/svg" width="74" height="16">
<!-- Each test runs on into the reference under it without a step.
feComposite arithmetic over two translucent floods, k1 i1 i2 + k2 i1 +
k3 i2 + k4 on premultiplied channels, alpha too, clamped to [0, 1]: the
average, the product, the sum past one, all four, k4 alone, and two that
go below zero; and k4 alone over inputs of a pixel fills the whole
subregion past them, white at half opacity over black. -->
<defs><filter id="a0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="0" k2="0.5" k3="0.5" k4="0"/></filter><filter id="a1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/></filter><filter id="a2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/></filter><filter id="a3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="0.5" k2="0.3" k3="0.2" k4="0.1"/></filter><filter id="a4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="0" k2="0" k3="0" k4="0.4"/></filter><filter id="a5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="-1" k2="1" k3="1" k4="0"/></filter><filter id="a6" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k1="0" k2="2" k3="-1" k4="0"/></filter><filter id="ax" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="red" width="1" height="1" result="s"/><feFlood flood-color="red" width="1" height="1" result="b"/><feComposite in="s" in2="b" operator="arithmetic" k4=".5" x="-100" y="-100" width="200" height="200"/></filter></defs>
<rect width="74" height="16" fill="white"/>
<rect x="2" y="2" width="7" height="6" filter="url(#a0)"/><rect x="2" y="8" width="7" height="6" fill="#857078" fill-opacity="0.65"/>
<rect x="11" y="2" width="7" height="6" filter="url(#a1)"/><rect x="11" y="8" width="7" height="6" fill="#292e17" fill-opacity="0.42"/>
<rect x="20" y="2" width="7" height="6" filter="url(#a2)"/><rect x="20" y="8" width="7" height="6" fill="#ad929c"/>
<rect x="29" y="2" width="7" height="6" filter="url(#a3)"/><rect x="29" y="8" width="7" height="6" fill="#826d63" fill-opacity="0.64"/>
<rect x="38" y="2" width="7" height="6" filter="url(#a4)"/><rect x="38" y="8" width="7" height="6" fill="#ffffff" fill-opacity="0.4"/>
<rect x="47" y="2" width="7" height="6" filter="url(#a5)"/><rect x="47" y="8" width="7" height="6" fill="#b290a6" fill-opacity="0.88"/>
<rect x="56" y="2" width="7" height="6" filter="url(#a6)"/><rect x="56" y="8" width="7" height="6" fill="#ff1400" fill-opacity="0.8"/>
<rect x="65" y="2" width="7" height="12"/><rect x="65" y="2" width="7" height="6" filter="url(#ax)"/><rect x="65" y="8" width="7" height="6" fill="#ffffff" fill-opacity="0.5"/>
</svg>
