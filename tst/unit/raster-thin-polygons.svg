<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- Thin viewports keep the exact meet scale and letterbox. Polygon
coverage is its area inside each pixel, including tapered tips, reversed
winding, stretch, fractional placement and vertical orientation.
