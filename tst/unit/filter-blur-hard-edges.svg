<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96">
<!-- An identity Gaussian keeps the input hard edges, including a single
identity axis. Exact rectangular stroke/region areas and independent
exponential convolutions check fractional corners, tiny positive and
underflowing deviations, zero axes, duplicate edges, SourceAlpha,
transforms, primitive chains and opacity. No comparison with another
renderer supplies the expectation. -->
