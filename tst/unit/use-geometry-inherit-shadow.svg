<svg xmlns="http://www.w3.org/2000/svg" width="128" height="80">
<!-- A referenced rect's explicit width:inherit and height:inherit
resolve against the use host in the shadow tree, not the defs ancestor
of the referenced original. -->
<rect width="128" height="80" fill="white"/>
<defs style="width:60px;height:48px"><rect id="template" style="width:inherit;height:inherit" fill="lime"/></defs>
<use href="#template" x="4" y="4" style="width:12px;height:14px"/>
<use href="#template" x="44" y="4" style="width:18px;height:10px"/>
<g style="width:10px;height:12px"><rect x="84" y="60" style="width:inherit;height:inherit" fill="lime"/></g>
</svg>
