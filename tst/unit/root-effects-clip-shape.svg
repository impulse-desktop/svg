<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" style="clip-path: inset(0 0 50% 0) fill-box">
<!-- A lime rect shows, and nothing red. A basic shape clips the
outermost svg against its CSS box, the viewport, whichever box it names:
the top half of it, though the root's content is smaller and its viewBox
halves its units. -->
<rect x="2" y="2" width="12" height="6" fill="lime"/><rect x="2" y="9" width="12" height="5" fill="red"/>
</svg>
