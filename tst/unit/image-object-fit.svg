<!-- Each lime drawing fills its black outline. An image's object-fit
sizes its content by its natural ratio in the box, fill leaving it to
preserveAspectRatio, contain inside it, cover over it and cut, none at
its natural size, scale-down the smaller of none and contain; object-
position places it, by keywords, percentages of the room left, or
lengths; with a fit other than fill preserveAspectRatio does nothing; an
image larger than the box scales down; a document of a viewBox alone has
its measured size (D10), one of neither has no ratio and is stretched,
an empty one draws nothing; both properties inherit when asked. -->
