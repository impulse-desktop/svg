<svg xmlns="http://www.w3.org/2000/svg" width="64" height="24">
<!-- Lime everywhere, no red. A use's clone inherits from the use, and the
document's rules match it within its shadow tree alone: a rule that matched
the original through ancestors or siblings not cloned does not match the
clone, nor does one through the use; one whose ancestors are cloned does, as do a
simple selector and the cloned presentation attributes. visibility hidden
on a use hides what inherits it, not what is visible of its own. -->
<style>
.special rect { fill: red }
use rect { fill: red }
g rect:nth-child(2) { fill: red }
.mine { stroke: lime }
rect.plain { fill: lime }
use { fill: lime }
.keep rect { fill: lime }
</style>
<rect width="64" height="24" fill="white"/>
<defs>
<g class="special"><rect id="a" width="10" height="10"/></g>
<g><rect width="1" height="1"/><rect id="b" width="10" height="10"/></g>
<rect id="c" class="mine plain" width="8" height="8" stroke-width="2" fill="red" stroke="red"/>
<g id="d" class="keep"><rect width="10" height="10"/></g>
<g id="v"><rect width="10" height="10" fill="lime" visibility="visible"/><rect x="2" y="2" width="6" height="6" fill="red"/></g>
</defs>
<use href="#a" x="2" y="2"/>
<use href="#b" x="14" y="2"/>
<use href="#c" x="27" y="3"/>
<use href="#d" x="38" y="2" style="fill: red"/>
<use href="#v" x="50" y="2" visibility="hidden"/>
</svg>
