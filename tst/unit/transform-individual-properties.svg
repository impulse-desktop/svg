<svg xmlns="http://www.w3.org/2000/svg" width="122" height="201">
<!-- Each lime drawing fills its black outline. translate, rotate and
scale move, turn and size an element before its transform, about its
origin: a percentage scale is its number, a percentage translation of
the reference box; rotate about z, by keyword or vector, is the 2D
rotate; none is no transform; a 3D rotate about x by nothing, or a
translation along z, changes no pixel, by 60deg, the axis after the
angle, it halves the height, so too about the vector after the angle;
four scales, a percentage along z, a scale of no number, an axis of no
name, three or five rotate values or a vector of no number make the
value invalid; a scale along z of 1 or 100% is the 2D scale, of 2
changes no pixel; a translation of one value moves along x, of zero
along z is 2D. -->
<rect width="122" height="201" fill="white"/>
