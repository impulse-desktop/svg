<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96">
<!-- Straight mesh patches interpolate the four corner colors and alpha
bilinearly. Expected images use analytic pixel-center weights, including
an affine transform, objectBoundingBox coordinates and a clipped
referencing shape. -->
<g transform="translate(0 0)"><defs><meshgradient id="m0" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="L 32 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m0)"/></g>
<g transform="translate(32 0)"><defs><meshgradient id="m1" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 32 32" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m1)"/></g>
<g transform="translate(64 0)"><defs><meshgradient id="m2" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 32 32" stop-color="rgb(0% 0% 0%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(0% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m2)"/></g>
<g transform="translate(96 0)"><defs><meshgradient id="m3" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(100% 0% 0%)" stop-opacity="0"/><stop path="L 32 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(100% 0% 0%)" stop-opacity="0"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m3)"/></g>
<g transform="translate(0 32)"><defs><meshgradient id="m4" gradientUnits="userSpaceOnUse" gradientTransform="scale(.5)"><meshrow><meshpatch><stop path="L 64 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="L 64 64" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 64" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m4)"/></g>
<g transform="translate(32 32)"><defs><meshgradient id="m5" gradientUnits="objectBoundingBox"><meshrow><meshpatch><stop path="L 1 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="L 1 1" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 1" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m5)"/></g>
<g transform="translate(64 32)"><defs><meshgradient id="m6" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(20.0% 40.0% 60.0%)" stop-opacity="1"/><stop path="L 32 32" stop-color="rgb(20.0% 40.0% 60.0%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(20.0% 40.0% 60.0%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(20.0% 40.0% 60.0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="32" height="32" fill="url(#m6)"/></g>
<g transform="translate(96 32)"><defs><meshgradient id="m7" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 32 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="L 32 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect x="4" y="4" width="24" height="24" fill="url(#m7)"/></g>
<svg x="0" y="64" width="32" height="32" viewBox="5000000.25 -5000000.25 32 32"><defs><meshgradient id="m8" gradientUnits="userSpaceOnUse"  x="5000000.25" y="-5000000.25"><meshrow><meshpatch><stop path="l 32 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="l 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="l -32 0" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="l 0 -32" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect x="5000000.25" y="-5000000.25" width="32" height="32" fill="url(#m8)"/></svg>
<svg x="32" y="64" width="32" height="32" viewBox="5000000.25 -5000000.25 32 32"><defs><meshgradient id="m9" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1 0 0 1 10000032.5 0)" x="5000000.25" y="-5000000.25"><meshrow><meshpatch><stop path="l 32 0" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/><stop path="l 0 32" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="l -32 0" stop-color="rgb(0% 0% 100%)" stop-opacity="1"/><stop path="l 0 -32" stop-color="rgb(100% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect x="5000000.25" y="-5000000.25" width="32" height="32" fill="url(#m9)"/></svg>
<g transform="translate(64 64)"><defs><meshgradient id="m10" gradientUnits="userSpaceOnUse" ><meshrow><meshpatch><stop path="L 8 0" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 8 8" stop-color="rgb(0% 0% 0%)" stop-opacity="1"/><stop path="L 0 8" stop-color="rgb(100% 100% 100%)" stop-opacity="1"/><stop path="L 0 0" stop-color="rgb(0% 0% 0%)" stop-opacity="1"/></meshpatch></meshrow></meshgradient></defs><rect width="8" height="8" fill="url(#m10)"/></g>
</svg>
