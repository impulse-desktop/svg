<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40">
<!-- Each lime marker fills its black outline. A marker's viewBox fits its
width and height by preserveAspectRatio; refX and refY are in viewBox units,
percentages of the viewBox, or keywords; the viewport clips its content
unless overflow is visible or auto. -->
<rect width="64" height="40" fill="white"/>
<defs>
<marker id="m" viewBox="0 0 10 10" markerWidth="4" markerHeight="3" refX="5" refY="5" markerUnits="userSpaceOnUse" overflow="visible"><rect width="10" height="10" fill="lime"/></marker>
<marker id="n" viewBox="0 0 10 10" preserveAspectRatio="none" markerWidth="4" markerHeight="3" refX="5" refY="5" markerUnits="userSpaceOnUse"><rect width="10" height="10" fill="lime"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="100%" refY="50%" markerUnits="userSpaceOnUse"><rect width="10" height="10" fill="lime"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="right" refY="bottom" markerUnits="userSpaceOnUse"><rect width="10" height="10" fill="lime"/></marker>
<marker id="u" viewBox="0 0 10 10" refX="2" refY="8" markerUnits="userSpaceOnUse"><rect width="10" height="10" fill="lime"/></marker>
<marker id="h" markerWidth="4" markerHeight="4" markerUnits="userSpaceOnUse"><rect x="-4" y="-4" width="12" height="12" fill="lime"/></marker>
<marker id="v" markerWidth="4" markerHeight="4" markerUnits="userSpaceOnUse" overflow="visible"><rect x="-1" y="-1" width="6" height="6" fill="lime"/></marker>
<marker id="a" markerWidth="4" markerHeight="4" markerUnits="userSpaceOnUse" overflow="auto"><rect x="-1" y="-1" width="6" height="6" fill="lime"/></marker>
<marker id="s" markerWidth="4" markerHeight="4" markerUnits="userSpaceOnUse" overflow="scroll"><rect x="-4" y="-4" width="12" height="12" fill="lime"/></marker>
</defs>
<path d="M 6 8 h 1" marker-start="url(#m)"/>
<path d="M 16 8 h 1" marker-start="url(#n)"/>
<path d="M 28 8 h 1" marker-start="url(#p)"/>
<path d="M 38 8 h 1" marker-start="url(#k)"/>
<path d="M 48 8 h 1" marker-start="url(#u)"/>
<path d="M 4 24 h 1" marker-start="url(#h)"/>
<path d="M 16 24 h 1" marker-start="url(#v)"/>
<path d="M 28 24 h 1" marker-start="url(#a)"/>
<path d="M 40 24 h 1" marker-start="url(#s)"/>
<g fill="none" stroke="black" stroke-width=".25">
<rect x="4.5" y="6.5" width="3" height="3"/><rect x="14" y="6.5" width="4" height="3"/><rect x="25" y="6.5" width="3" height="3"/>
<rect x="35" y="5" width="3" height="3"/><rect x="47.4" y="5.6" width="3" height="3"/>
<rect x="4" y="24" width="4" height="4"/><rect x="15" y="23" width="6" height="6"/><rect x="27" y="23" width="6" height="6"/><rect x="40" y="24" width="4" height="4"/>
</g>
</svg>
