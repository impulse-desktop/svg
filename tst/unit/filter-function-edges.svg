<svg xmlns="http://www.w3.org/2000/svg" width="48" height="8">
<g fill="#f80">
<rect x="0" width="4" height="4" filter="hue-rotate(10x)"/>
<rect x="4" width="4" height="4" filter="blur{1px)"/>
<rect x="8" width="4" height="4" filter="BLUR(1px)"/>
<rect x="12" width="4" height="4" filter="blur 1px"/>
<rect x="16" width="4" height="4" filter="url(&quot;#f')"/>
<rect x="20" width="4" height="4" filter="url()"/>
<rect x="24" width="4" height="4" filter="grayscale(2)"/>
<rect x="28" width="4" height="4" stroke="black" stroke-width="1" style="paint-order: stroke,fill"/>
<rect x="32" width="4" height="4" style="clip-path: circle(1px at top center)"/>
<rect x="36" width="4" height="4" style="clip-path: circle(1px at top 10px)"/>
<line x1="40" y1="2" x2="48" y2="2" stroke="black" stroke-dasharray="0 2" stroke-linecap="round"/>
<line x1="10" y1="6" x2="200" y2="6" stroke="black" stroke-dasharray="3 1"/>
</g>
</svg>
