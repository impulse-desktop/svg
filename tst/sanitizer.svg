<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64">
  <style>
    .paint { fill: url(#gradient); stroke: #17324d; stroke-width: 2.5; }
  </style>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd2e"/>
      <stop offset="1" stop-color="#ff3158"/>
    </linearGradient>
    <pattern id="pattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#18283c"/>
      <circle cx="6" cy="6" r="3" fill="#55d6be"/>
    </pattern>
    <clipPath id="clip">
      <path d="M 8 8 H 88 V 56 H 8 Z M 18 18 V 46 H 78 V 18 Z" clip-rule="evenodd"/>
    </clipPath>
    <mask id="mask" mask-type="luminance">
      <rect width="96" height="64" fill="white"/>
      <circle cx="48" cy="32" r="13" fill="#555"/>
    </mask>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="context-stroke"/>
    </marker>
    <filter id="filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="shifted"/>
      <feGaussianBlur in="shifted" stdDeviation="0.35" result="blurred"/>
      <feColorMatrix in="blurred" type="saturate" values="0.8" result="colored"/>
      <feBlend in="SourceGraphic" in2="colored" mode="screen"/>
    </filter>
    <g id="symbol">
      <path class="paint" d="M 20 42 C 29 7, 67 7, 76 42 C 61 54, 35 54, 20 42 Z"/>
    </g>
  </defs>
  <rect width="96" height="64" fill="url(#pattern)"/>
  <g clip-path="url(#clip)" mask="url(#mask)" filter="url(#filter)">
    <use href="#symbol"/>
    <polyline points="14,50 48,12 82,50" fill="none" stroke="#f8fafc" stroke-width="2" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <image x="43" y="27" width="10" height="10" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLz8QAAAABJRU5ErkJggg=="/>
</svg>
