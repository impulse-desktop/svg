  <style>
line.max-line {
    stroke-linecap: square;
    stroke: #dadada
}

.HorizontalAxis text {
    fill: #787878;
    font-weight: 700;
    font-size: 10px;
    transform: translate(2px,2px)
}

.HorizontalAxis text:last-child {
    transform: translate(-2px,2px)
}

.AxisGridLines.horizontalLines line {
    stroke-dasharray: 0;
    stroke-linecap: square;
    stroke: #dadada
}

