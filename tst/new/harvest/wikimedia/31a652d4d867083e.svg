    stroke: #787878
}

.hoverIndicator circle {
    stroke-width: 1;
    r: 5px
}

.axis-label text {
    font: 400 10px Lato;
    letter-spacing: .01em;
    font-style: italic;
    text-anchor: end;
    fill: #787878
}

.axis-label text.outline {
    stroke: #ffffffd9;
    stroke-width: 2px
}
</style>
