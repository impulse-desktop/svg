<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="537.8376301653855" height="537.8376301653855" viewBox="-40 -40 617.8376301653855 617.8376301653855">

    <defs>

        <!-- define wedge shape -->
        <polygon id="wedge-raw" points="248.91881508269273,557.8376301653855 288.91881508269273,557.8376301653855 268.91881508269273,512.8376301653855" transform="translate(-268.91881508269273, -268.91881508269273)" />

        <!-- define wedge frame (visible as gray line) -->
        <g id="wedge-frame">
            <use xlink:href="#wedge-raw" style="fill: none; stroke: white; stroke-width: 25;" />
            <use xlink:href="#wedge-raw" style="fill: black; stroke: black; stroke-width: 15;" />
        </g>

        <!-- define mask (visible as gray circle with wedge frames) -->
        <mask id="demi-mask" mask-type="luminance">
            <circle cx="268.91881508269273" cy="268.91881508269273" r="268.91881508269273" style="fill: none; stroke: white; stroke-width: 5;" />
            <g transform="translate(268.91881508269273, 268.91881508269273)">
                <use xlink:href="#wedge-frame" transform="rotate(0.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(45.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(90.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(135.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(180.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(225.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(270.0)" />
                <use xlink:href="#wedge-frame" transform="rotate(315.0)" />
            </g>
            <circle cx="268.91881508269273" cy="268.91881508269273" r="263.91881508269273" style="fill: black; stroke: black; stroke-width: 5;" />
        </mask>

        <!-- define red wedge -->
        <use id="wedge-core" xlink:href="#wedge-raw" style="fill: #e01313; stroke: #b30f0f; stroke-width: 2;" />

        <!-- define separator (blue or green lines in non-singleton partition blocks) -->
        <line id="separator" x1="268.91881508269273" y1="383.83763016538546" x2="268.91881508269273" y2="519.8376301653855" style="stroke-width: 4;"  transform="translate(-268.91881508269273, -268.91881508269273)" />

        <!-- define partition (blue and green dashed circle outlines) -->
        <circle id="partition_a" cx="268.91881508269273" cy="268.91881508269273" r="182.9188150826927" stroke-dashoffset="-790.1525577923137" stroke-dasharray="0.0 287.32820283356864 0.0 861.9846085007059" />
        <circle id="partition_b" cx="268.91881508269273" cy="268.91881508269273" r="182.9188150826927" stroke-dashoffset="-933.816659209098" stroke-dasharray="0.0 287.32820283356864 574.6564056671373 287.32820283356864" />

        <!-- define singleton circles -->
        <circle id="single-green" cx="-70.0" cy="168.99494936611663" r="64.5" style="fill: #0b950b; stroke: #005700; stroke-width: 9.0;" />
        <circle id="single-blue" cx="-70.0" cy="168.99494936611663" r="64.5" style="fill: #3c3cff; stroke: #000099; stroke-width: 9.0;" />

        <!-- define gray dot -->
        <circle id="change-dot" cx="-110.56444383069953" cy="266.9261798123131" r="13" style="fill: #777;" />

    </defs>


    <!-- ring behind partition -->
    <circle cx="268.91881508269273" cy="268.91881508269273" r="182.9188150826927" style="fill: none; stroke: white; stroke-width: 152;" />
    <circle cx="268.91881508269273" cy="268.91881508269273" r="106.9188150826927" style="fill: none; stroke: #ccc; stroke-width: 2;" />
    <circle cx="268.91881508269273" cy="268.91881508269273" r="258.91881508269273" style="fill: none; stroke: #ccc; stroke-width: 2;" />

    <!-- partition (blue and green dashed circle outlines) -->
    <use xlink:href="#partition_a" style="fill: none; stroke: #005700; stroke-linecap: round; stroke-width: 138;" />
    <use xlink:href="#partition_a" style="fill: none; stroke: #0b950b; stroke-linecap: round; stroke-width: 120;" />
    <use xlink:href="#partition_b" style="fill: none; stroke: #000099; stroke-linecap: round; stroke-width: 138;" />
    <use xlink:href="#partition_b" style="fill: none; stroke: #3c3cff; stroke-linecap: round; stroke-width: 120;" />

    <!-- singleton circles (shown as backup above zero-length dashes, which are unreliable) -->
    <g transform="translate(268.91881508269273, 268.91881508269273)">
        <use xlink:href="#single-green" transform="rotate(135.0)" />
        <use xlink:href="#single-blue" transform="rotate(180.0)" />
        <use xlink:href="#single-green" transform="rotate(225.0)" />
    </g>

    <!-- gray circle and wedge frames -->
    <rect x="-40" y="-40" width="617.8376301653855" height="617.8376301653855" mask="url(#demi-mask)" style="fill: #777;" />

    <!-- wedges (red) and separators (blue or green) -->
    <g transform="translate(268.91881508269273, 268.91881508269273)">
        <use xlink:href="#separator" style="stroke: #000099;" transform="rotate(0.0)" />
        <use xlink:href="#separator" style="stroke: #000099;" transform="rotate(45.0)" />
        <use xlink:href="#separator" style="stroke: #000099;" transform="rotate(90.0)" />
        <use xlink:href="#wedge-core" transform="rotate(135.0)" />
        <use xlink:href="#wedge-core" transform="rotate(180.0)" />
        <use xlink:href="#wedge-core" transform="rotate(225.0)" />
        <use xlink:href="#wedge-core" transform="rotate(270.0)" />
        <use xlink:href="#separator" style="stroke: #000099;" transform="rotate(315.0)" />
    </g>

    <!-- gray dots around gray circle -->
    <g transform="translate(268.91881508269273, 268.91881508269273)">
        <use xlink:href="#change-dot" transform="rotate(90.0)" />
        <use xlink:href="#change-dot" transform="rotate(270.0)" />
    </g>

</svg>
