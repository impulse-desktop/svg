<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 260">
<style>
    svg {
        font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }
    rect {
        fill: #ECEBE9;
    }
    rect.hold {
        /* class used to indicate key beeing held */
        fill: #F8C8B4;
    }
    text {
        font-size: 1.0em;
        stroke: none;
        fill: #403E3B;
    }
    .tl {
        /* Top-left text */
        text-anchor: start;
        dominant-baseline:hanging;
    }
    .tr {
        /* Top-right text */
        text-anchor: end;
        dominant-baseline:hanging;
    }
    .bl {
        /* Bottom-left text */
        text-anchor: start;
    }
    .br {
        /* Bottom-right text */
        text-anchor: end;
    }
    .cnt {
        /* Center text */
        text-anchor: middle;
        dominant-baseline:middle;
    }
    .layer {
        /* class for all secondary text labels */
        font-size: 0.7em;
        fill: #9D9A95;
    }    
</style>
