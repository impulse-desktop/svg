<svg height="200" width="480" xmlns="http://www.w3.org/2000/svg">
  <style>
    path {
        fill: #AAF;
        stroke: black;
        stroke-width: 1;
    }
    g#convex {

    }
    g#concave {
        transform: translate(80px, 0px);
    }

    g#insideout {
        transform: translate(160px, 0px);
    }

    g#insideout path:nth-child(1) {
        stroke: none;
    }

    g#insideout path:nth-child(2) {
        fill: white;
    }

    g#discontinuous {
        transform: translate(240px, 0px);
    }

    g#islands {
        transform: translate(320px, 0px);
    }

    g#islands path:nth-child(2) {
        fill: white;
    }
    g#islands path:nth-child(3) {
        fill: white;
    }

    g#vertextouch {
        transform: translate(400px, 0px);
    }

    g#cross {
        transform: translate(0px, 100px);
    }

    g#edgetouch {
        transform: translate(80px, 100px);
    }

    g#edgeoverlap {
        transform: translate(160px, 100px);
    }

    g#shared1 {
        transform: translate(240px, 100px);
    }
    g#shared2 {
        transform: translate(320px, 100px);
    }
    g#shared3 {
        transform: translate(400px, 100px);
    }


    text {
        text-anchor: middle;
        transform: translate(40px, 90px);
    }
    text.point {
        font: 0.6em arial, helvetica, sans-serif;
        transform: translate(0, 0);
    }
  </style>
  <g id="convex">
