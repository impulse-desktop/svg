<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 260">
<style>
    svg {
        font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }
    rect {
        fill: #ffffff;
        stroke: #9D9A95;
        stroke-width: 0.3;
    }
    rect.hold {
        /* class used to indicate key beeing held */
        fill: #F8C8B4;
    }
    text {
        font-size: 1.0em;
        stroke: none;
        fill: #403E3B;
    }
    text.layer {
        /* class for all secondary text labels */
        font-size: 0.7em;
        fill: #9D9A95;
    }  
    text.tl {
        /* Top-left text */
        text-anchor: start;
        dominant-baseline:hanging;
    }
    text.tr {
        /* Top-right text */
        text-anchor: end;
        dominant-baseline:hanging;
        fill: #f4a261;
    }
    text.bl {
        /* Bottom-left text */
        text-anchor: start;
        fill: #1EABE8;
    }
    text.br {
        /* Bottom-right text */
        text-anchor: end;
        fill: #5FCC54;
    }
    text.cnt {
        /* Center text */
        text-anchor: middle;
        dominant-baseline:middle;
    }
  
</style>
