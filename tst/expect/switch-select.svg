<svg xmlns="http://www.w3.org/2000/svg" width="64" height="24">
<!-- What tst/unit/switch-select.svg draws, drawn plainly; each cell's
id is what the statement ledgers link to. -->
<rect width="64" height="24" fill="white"/>
<g id="first-true" data-box="1 1 12 12"><rect x="2" y="2" width="10" height="10" fill="lime"/></g>
<g id="language-prefix" data-box="13 1 12 12"><rect x="14" y="2" width="10" height="10" fill="lime"/></g>
<g id="language-case" data-box="25 1 12 12"><rect x="26" y="2" width="10" height="10" fill="lime"/></g>
<g id="language-list" data-box="37 1 12 12"><rect x="38" y="2" width="10" height="10" fill="lime"/></g>
<g id="display-none-chosen" data-box="49 1 12 12"><rect x="50" y="2" width="10" height="10" fill="lime"/></g>
<g id="excluded" data-box="1 13 62 10"><rect x="2" y="14" width="60" height="8" fill="lime"/></g>
</svg>
