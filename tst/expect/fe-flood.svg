<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- What tst/unit/fe-flood.svg draws, drawn plainly; each cell's id is
what the statement ledgers link to. -->
<rect width="64" height="16" fill="white"/>
<defs><filter id="f0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="rgba(204,77,26,.5)" flood-opacity=".5"/></filter><filter id="f1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood /></filter><filter id="f2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-opacity="1.5" flood-color="#cc4d1a"/></filter><filter id="f3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-opacity="-1" flood-color="#cc4d1a"/></filter><filter id="f4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" color-interpolation-filters="linearRGB"/></filter><filter id="fi" x="0" y="0" width="1" height="1" flood-color="red" flood-opacity=".5"><feFlood/></filter><filter id="fs" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="16"><feFlood flood-color="lime" x="58" y="2" width="4" height="12"/></filter></defs>
<g id="opacity-times-alpha" data-box="1 1 9 14"><rect x="2" y="2" width="7" height="6" fill="#cc4d1a" fill-opacity="0.25"/><rect x="2" y="8" width="7" height="6" fill="#cc4d1a" fill-opacity="0.25"/></g>
<g id="initial" data-box="10 1 9 14"><rect x="11" y="2" width="7" height="6" fill="#000000"/><rect x="11" y="8" width="7" height="6" fill="#000000"/></g>
<g id="opacity-clamp" data-box="19 1 18 14"><rect x="20" y="2" width="7" height="6" fill="#cc4d1a"/><rect x="20" y="8" width="7" height="6" fill="#cc4d1a"/></g>
<g id="space" data-box="37 1 9 14"><rect x="38" y="2" width="7" height="6" fill="#cc4d1a"/><rect x="38" y="8" width="7" height="6" fill="#cc4d1a"/></g>
<g id="not-inherited" data-box="46 1 9 14"><rect x="47" y="2" width="7" height="6" fill="#000000"/><rect x="47" y="8" width="7" height="6" fill="#000000"/></g>
<g id="subregion" data-box="57 1 6 14"><rect x="58" y="2" width="4" height="12" fill="lime"/></g>
<rect x="58" y="2" width="4" height="12" fill="none" stroke="black" stroke-width=".25"/>
</svg>
