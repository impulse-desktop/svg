<g id="path" data-box="64 0 32 32"><path d="M68 16 H92" stroke="lime" stroke-width="4"/></g>
<g id="group" data-box="96 0 32 32"><line x1="100" y1="16" x2="124" y2="16" stroke="lime" stroke-width="4"/></g>
<g id="diagonal" data-box="0 32 32 32"></g>
