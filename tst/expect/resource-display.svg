<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32">
<!-- What tst/unit/resource-display.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<clipPath id="c"><rect width="0" height="0"/></clipPath>
<mask id="m" x="0" y="0" width="1" height="1" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="white"/></mask>
<filter id="f" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter>
<linearGradient id="g"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="lime"/></linearGradient>
<radialGradient id="r"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="lime"/></radialGradient>
<defs>
<clipPath id="conditional-clip" systemLanguage="xx-none"><rect x="2" y="18" width="10" height="10"/></clipPath>
<mask id="conditional-mask" systemLanguage="xx-none" x="0" y="0" width="1" height="1" maskContentUnits="objectBoundingBox"><rect width=".5" height="1" fill="white"/></mask>
<filter id="conditional-filter" systemLanguage="xx-none" x="0" y="0" width="1" height="1"><feFlood flood-color="lime"/></filter>
<linearGradient id="conditional-gradient" systemLanguage="xx-none"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="lime"/></linearGradient>
<pattern id="conditional-pattern" systemLanguage="xx-none" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="lime"/></pattern>
</defs>
<g id="clip" data-box="1 1 12 12"><rect x="2" y="2" width="10" height="10" fill="lime"/></g>
<g id="mask" data-box="13 1 12 12"><rect x="14" y="2" width="10" height="10" fill="lime"/></g>
<g id="filter" data-box="25 1 12 12"><rect x="26" y="2" width="10" height="10" fill="lime"/></g>
<g id="conditional" data-box="37 1 24 12"><rect x="38" y="2" width="10" height="10" fill="lime"/><rect x="50" y="2" width="10" height="10" fill="lime"/></g>
<g id="condition-on-clip" data-box="0 16 14 16"><rect x="2" y="18" width="10" height="10" fill="lime"/></g>
<g id="condition-on-mask" data-box="14 16 12 16"><rect x="14" y="18" width="5" height="10" fill="lime"/></g>
<g id="condition-on-pattern" data-box="26 16 12 16"><rect x="26" y="18" width="10" height="10" fill="lime"/></g>
<g id="condition-on-filter" data-box="38 16 12 16"><rect x="38" y="18" width="10" height="10" fill="lime"/></g>
<g id="condition-on-gradient" data-box="50 16 12 16"><rect x="50" y="18" width="10" height="10" fill="lime"/></g>
</svg>
