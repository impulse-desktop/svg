<g id="screen" data-box="19 1 9 14"><rect x="20" y="2" width="7" height="6" fill="#b290a6" fill-opacity="0.88"/><rect x="20" y="8" width="7" height="6" fill="#b290a6" fill-opacity="0.88"/></g>
<g id="overlay" data-box="28 1 9 14"><rect x="29" y="2" width="7" height="6" fill="#726e9c" fill-opacity="0.88"/><rect x="29" y="8" width="7" height="6" fill="#726e9c" fill-opacity="0.88"/></g>
<g id="color-dodge" data-box="37 1 9 14"><rect x="38" y="2" width="7" height="6" fill="#c5a0b1" fill-opacity="0.88"/><rect x="38" y="8" width="7" height="6" fill="#c5a0b1" fill-opacity="0.88"/></g>
<g id="soft-light" data-box="46 1 9 14"><rect x="47" y="2" width="7" height="6" fill="#76759d" fill-opacity="0.88"/><rect x="47" y="8" width="7" height="6" fill="#76759d" fill-opacity="0.88"/></g>
<g id="difference" data-box="55 1 9 14"><rect x="56" y="2" width="7" height="6" fill="#945c99" fill-opacity="0.88"/><rect x="56" y="8" width="7" height="6" fill="#945c99" fill-opacity="0.88"/></g>
<g id="hue" data-box="1 15 9 14"><rect x="2" y="16" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/><rect x="2" y="22" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/></g>
<g id="color" data-box="10 15 9 14"><rect x="11" y="16" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/><rect x="11" y="22" width="7" height="6" fill="#b7674e" fill-opacity="0.88"/></g>
<g id="luminosity" data-box="19 15 9 14"><rect x="20" y="16" width="7" height="6" fill="#59779b" fill-opacity="0.88"/><rect x="20" y="22" width="7" height="6" fill="#59779b" fill-opacity="0.88"/></g>
<g id="no-composite" data-box="28 15 36 14"><rect x="29" y="16" width="7" height="6" fill="#cc4d1a" fill-opacity="0.7"/><rect x="29" y="22" width="7" height="6" fill="#cc4d1a" fill-opacity="0.7"/><rect x="38" y="16" width="7" height="6" fill="#6a3b18" fill-opacity="0.7"/><rect x="38" y="22" width="7" height="6" fill="#6a3b18" fill-opacity="0.7"/><rect x="47" y="16" width="7" height="6" fill="#d95a27" fill-opacity="0.7"/><rect x="47" y="22" width="7" height="6" fill="#d95a27" fill-opacity="0.7"/><rect x="56" y="16" width="7" height="6" fill="#876c8a" fill-opacity="0.7"/><rect x="56" y="22" width="7" height="6" fill="#876c8a" fill-opacity="0.7"/></g>
</svg>
