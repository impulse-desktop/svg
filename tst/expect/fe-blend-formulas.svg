<svg xmlns="http://www.w3.org/2000/svg" width="64" height="30">
<!-- What tst/unit/fe-blend-formulas.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="64" height="30" fill="white"/>
<defs><filter id="b0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="normal"/></filter><filter id="b1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="multiply"/></filter><filter id="b2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="screen"/></filter><filter id="b3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="overlay"/></filter><filter id="b4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="color-dodge"/></filter><filter id="b5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="soft-light"/></filter><filter id="b6" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="difference"/></filter><filter id="b7" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="hue"/></filter><filter id="b8" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="color"/></filter><filter id="b9" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="luminosity"/></filter><filter id="b10" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="normal" no-composite=""/></filter><filter id="b11" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="multiply" no-composite=""/></filter><filter id="b12" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="hue" no-composite=""/></filter><filter id="b13" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feFlood flood-color="#cc4d1a" flood-opacity="0.7" result="s"/><feFlood flood-color="#3399e6" flood-opacity="0.6" result="b"/><feBlend in="s" in2="b" mode="soft-light" no-composite=""/></filter></defs>
<g id="normal" data-box="1 1 9 14"><rect x="2" y="2" width="7" height="6" fill="#ad5d44" fill-opacity="0.88"/><rect x="2" y="8" width="7" height="6" fill="#ad5d44" fill-opacity="0.88"/></g>
