<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128">
<!-- What tst/unit/stroke-hairpin-subdivision.svg draws, drawn plainly;
each cell's id is what the statement ledgers link to. -->
<rect width="256" height="128" fill="white"/>
<g id="end-unequal" data-box="0 0 128 64" data-tolerance="64"><image x="0" y="0" width="128" height="64" href="data:image/png;base64,"/></g>
<g id="end-half" data-box="128 0 128 64" data-tolerance="64"><image x="128" y="0" width="128" height="64" href="data:image/png;base64,"/></g>
<g id="start-unequal" data-box="0 64 128 64" data-tolerance="64"><image x="0" y="64" width="128" height="64" href="data:image/png;base64,"/></g>
<g id="start-half" data-box="128 64 128 64" data-tolerance="64"><image x="128" y="64" width="128" height="64" href="data:image/png;base64,"/></g>
</svg>
