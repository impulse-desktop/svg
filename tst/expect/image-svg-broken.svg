<g id="invalid-uri" data-box="23 1 10 10"><rect x="24" y="2" width="8" height="8" fill="teal"/></g>
<g id="valid-svg" data-box="34 1 10 10"><rect x="35" y="2" width="8" height="8" fill="lime"/></g>
<g id="after-error" data-box="45 1 10 10"><rect x="46" y="2" width="8" height="8" fill="teal"/></g>
</svg>
