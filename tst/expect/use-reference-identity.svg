<svg xmlns="http://www.w3.org/2000/svg" width="50" height="20">
<!-- What tst/unit/use-reference-identity.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="50" height="20" fill="white"/>
<g id="late-ancestor" data-box="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="lime"/></g>
<g id="nested-symbol" data-box="10 0 10 10"><rect x="12" y="2" width="6" height="6" fill="lime"/></g>
<g id="late-use" data-box="20 0 10 10"><rect x="22" y="2" width="6" height="6" fill="lime"/></g>
<g id="mask-reference" data-box="30 0 10 10"><rect x="32" y="2" width="6" height="6" fill="lime"/></g>
<g id="filtered-reference" data-box="40 0 10 10"><rect x="42" y="2" width="6" height="6" fill="lime"/></g>
<g id="transformed-symbol" data-box="0 10 10 10"><rect x="2" y="12" width="6" height="6" fill="lime"/></g>
<g id="unique-control" data-box="10 10 10 10"><rect x="12" y="12" width="6" height="6" fill="lime"/></g>
<g id="first-not-last" data-box="20 10 10 10"><rect x="22" y="12" width="6" height="6" fill="lime"/></g>
<g id="actual-ancestor-cycle" data-box="30 10 10 10"><rect x="32" y="12" width="6" height="6" fill="lime"/></g>
<g id="actual-indirect-cycle" data-box="40 10 10 10"><rect x="42" y="12" width="6" height="6" fill="lime"/></g>
</svg>
