<svg xmlns="http://www.w3.org/2000/svg" width="58" height="12">
<!-- What tst/unit/image-data-urls.svg draws, drawn plainly; each cell's
id is what the statement ledgers link to. -->
<rect width="58" height="12" fill="white"/>
<g id="base64-percent" data-box="1 1 10 10"><rect x="2" y="2" width="8" height="8" fill="lime"/></g>
<g id="svg-percent" data-box="12 1 10 10"><rect x="13" y="2" width="8" height="8" fill="lime"/></g>
<g id="base64-percent-not-hex" data-box="23 1 10 10"></g>
<g id="base64-percent-half-hex" data-box="34 1 10 10"></g>
<g id="base64-percent-at-end" data-box="45 1 10 10"></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="8" height="8"/><rect x="13" y="2" width="8" height="8"/><rect x="24" y="2" width="8" height="8"/><rect x="35" y="2" width="8" height="8"/><rect x="46" y="2" width="8" height="8"/></g>
</svg>
