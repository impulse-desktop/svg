<svg xmlns="http://www.w3.org/2000/svg" width="500" height="100">
<!-- What tst/unit/stroke-tight-ends.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="500" height="100" fill="white"/>
<g id="dash-end" data-box="0 0 100 100" data-tolerance="8"><image x="0" width="100" height="100" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="start-tightening" data-box="100 0 100 100" data-tolerance="32"><image x="100" width="100" height="100" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="end-tight" data-box="200 0 100 100" data-tolerance="8"><image x="200" width="100" height="100" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="pie-sector" data-box="300 0 100 100" data-tolerance="8"><path d="M310 30 H400 V79.1672240859411 Z"/></g>
<g id="pie-quarter-cubic" data-box="400 0 100 100" data-tolerance="8"><image x="400" width="100" height="100" image-rendering="pixelated" href="data:image/png;base64,"/></g>
</svg>
