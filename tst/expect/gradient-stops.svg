<svg xmlns="http://www.w3.org/2000/svg" width="64" height="52">
<!-- What tst/unit/gradient-stops.svg draws, drawn plainly; each cell's
id is what the statement ledgers link to. -->
<rect width="64" height="52" fill="white"/>
<defs>
<linearGradient id="c"><stop offset="-1" stop-color="navy"/><stop offset="50%" stop-color="gold"/><stop offset=".25" stop-color="teal"/><stop offset="2" stop-color="white"/></linearGradient>
<linearGradient id="cr"><stop offset="0" stop-color="navy"/><stop offset=".5" stop-color="gold"/><stop offset=".5" stop-color="teal"/><stop offset="1" stop-color="white"/></linearGradient>
<linearGradient id="t"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="transparent"/></linearGradient>
<linearGradient id="tr"><stop offset="0" stop-color="lime"/><stop offset="1" stop-color="black" stop-opacity="0"/></linearGradient>
<linearGradient id="o"><stop offset="0" stop-color="rgba(0, 0, 255, .5)" stop-opacity=".5"/><stop offset="1" stop-color="navy" stop-opacity="3"/></linearGradient>
<linearGradient id="or"><stop offset="0" stop-color="blue" stop-opacity=".25"/><stop offset="1" stop-color="navy"/></linearGradient>
<linearGradient id="none"><desc>no stops</desc></linearGradient>
<linearGradient id="one"><stop offset=".7" stop-color="lime"/></linearGradient>
</defs>
<g id="offsets" data-box="1 1 62 10"><rect x="2" y="2" width="60" height="4" fill="url(#cr)"/><rect x="2" y="6" width="60" height="4" fill="url(#cr)"/></g>
<g id="transparent" data-box="1 11 62 10"><rect x="2" y="12" width="60" height="4" fill="url(#tr)"/><rect x="2" y="16" width="60" height="4" fill="url(#tr)"/></g>
<g id="opacity" data-box="1 21 62 10"><rect x="2" y="22" width="60" height="4" fill="url(#or)"/><rect x="2" y="26" width="60" height="4" fill="url(#or)"/></g>
<g id="no-stops" data-box="1 31 30 20"><rect x="2" y="32" width="28" height="18" fill="lime"/></g>
<g id="one-stop" data-box="33 31 30 20"><rect x="34" y="32" width="28" height="18" fill="lime"/></g>
</svg>
