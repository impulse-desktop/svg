<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<!-- What tst/unit/viewport-nested.svg draws, drawn plainly; each cell's
id is what the statement ledgers link to. -->
<rect width="64" height="64" fill="white"/>
<defs><symbol id="s"><rect width="50%" height="100%" fill="lime"/><rect x="-5" width="5" height="5" fill="red"/></symbol></defs>
<g id="clip" data-box="1 1 14 14"><rect x="2" y="2" width="12" height="12" fill="lime"/></g>
<g id="overflow-visible" data-box="17 1 14 14"><rect x="18" y="2" width="12" height="12" fill="lime"/></g>
<g id="percent" data-box="33 1 30 16"><rect x="41" y="9" width="14" height="7" fill="lime"/><circle cx="48" cy="5.5" r="2.214" fill="lime"/></g>
<g id="negative-viewbox" data-box="1 19 14 14"><rect x="2" y="20" width="6" height="6" fill="lime"/></g>
<g id="zero-viewbox" data-box="17 19 14 14"></g>
<g id="transform" data-box="33 19 14 14"><rect x="38" y="22" width="6" height="6" fill="lime"/></g>
<g id="symbol-viewport" data-box="1 39 62 24"><rect x="2" y="40" width="10" height="10" fill="lime"/><rect x="30" y="40" width="15" height="20" fill="lime"/></g>
<g fill="none" stroke="black" stroke-width=".25">
<rect x="2" y="2" width="12" height="12"/><rect x="18" y="2" width="12" height="12"/>
<rect x="41" y="9" width="14" height="7"/><circle cx="48" cy="5.5" r="2.214"/>
<rect x="2" y="20" width="6" height="6"/><rect x="38" y="22" width="6" height="6"/>
<rect x="2" y="40" width="10" height="10"/><rect x="30" y="40" width="15" height="20"/>
</g>
</svg>
