<svg xmlns="http://www.w3.org/2000/svg" width="32" height="12">
<!-- What tst/unit/image-cells.svg draws, drawn plainly; each cell's id
is what the statement ledgers link to. -->
<rect width="32" height="12" fill="white"/>
<g id="css-position" data-box="1 1 10 10"><rect x="2" y="2" width="8" height="8" fill="lime"/></g>
<g id="image-overflow" data-box="13 1 18 10"><rect x="20" y="2" width="8" height="8" fill="lime"/></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="8" height="8"/><rect x="20" y="2" width="8" height="8"/></g>
</svg>
