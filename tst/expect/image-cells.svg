<g id="image-overflow" data-box="13 1 18 10"><rect x="20" y="2" width="8" height="8" fill="lime"/></g>
<g id="natural-size" data-box="31 1 6 6"><rect x="32" y="2" width="1" height="1" fill="navy"/><rect x="33" y="2" width="1" height="1" fill="lime"/><rect x="34" y="2" width="1" height="1" fill="navy"/><rect x="35" y="2" width="1" height="1" fill="lime"/><rect x="32" y="3" width="1" height="1" fill="lime"/><rect x="33" y="3" width="1" height="1" fill="navy"/><rect x="34" y="3" width="1" height="1" fill="lime"/><rect x="35" y="3" width="1" height="1" fill="navy"/><rect x="32" y="4" width="1" height="1" fill="navy"/><rect x="33" y="4" width="1" height="1" fill="lime"/><rect x="34" y="4" width="1" height="1" fill="navy"/><rect x="35" y="4" width="1" height="1" fill="lime"/><rect x="32" y="5" width="1" height="1" fill="lime"/><rect x="33" y="5" width="1" height="1" fill="navy"/><rect x="34" y="5" width="1" height="1" fill="lime"/><rect x="35" y="5" width="1" height="1" fill="navy"/></g>
