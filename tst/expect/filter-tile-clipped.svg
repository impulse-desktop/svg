<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
<!-- What tst/unit/filter-tile-clipped.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<filter id="a" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="16" height="8">
<feFlood flood-color="red" x="-10" y="2" width="14" height="3" result="t"/>
<feTile in="t"/>
</filter>
<filter id="b" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="8" width="16" height="8">
<feFlood flood-color="blue" x="2" y="-10" width="3" height="20" result="t"/>
<feTile in="t"/>
</filter>
<g id="x-clipped-reference" data-box="0 0 16 8"><path fill="red" d="M0 0h4v8H0zM14 0h2v8h-2z"/></g>
<g id="y-clipped-reference" data-box="0 8 16 8"><rect y="8" width="16" height="2" fill="blue"/></g>
</svg>
