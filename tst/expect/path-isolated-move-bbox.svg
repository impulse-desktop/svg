<svg xmlns="http://www.w3.org/2000/svg" width="192" height="128">
<!-- What tst/unit/path-isolated-move-bbox.svg draws, drawn plainly;
each cell's id is what the statement ledgers link to. -->
<rect width="192" height="128" fill="white"/>
<defs>
  <clipPath id="leading"><rect x="6" y="8" width="48" height="24"/></clipPath>
  <clipPath id="trailing"><rect x="70" y="8" width="48" height="24"/></clipPath>
  <clipPath id="line"><rect x="134" y="6" width="48" height="48"/></clipPath>
  <linearGradient id="plain" gradientUnits="userSpaceOnUse" x1="0" y1="74" x2="0" y2="94">
    <stop offset=".5" stop-color="navy"/><stop offset=".5" stop-color="gold"/>
  </linearGradient>
</defs>
<g id="leading-move" data-box="0 0 64 64"><path d="M10 10 L50 10 L50 30" fill="none" stroke="lime" stroke-width="20" clip-path="url(#leading)"/></g>
<g id="trailing-move" data-box="64 0 64 64"><path d="M74 10 L114 10 L114 30" fill="none" stroke="lime" stroke-width="20" clip-path="url(#trailing)"/></g>
<g id="zero-length-segment" data-box="128 0 64 64"><path d="M138 50 L138 50 M138 10 L178 10 L178 30" fill="none" stroke="lime" stroke-width="20" clip-path="url(#line)"/></g>
<g id="gradient-box" data-box="0 64 64 64"><path d="M10 74 L50 74 L50 94 Z" fill="url(#plain)"/></g>
</svg>
