<g id="relative-after-arc" data-box="32 16 16 16"><rect x="36" y="22" width="8" height="4" fill="navy"/></g>
<g id="zero-ry-line" data-box="48 16 16 16"><rect x="52" y="22" width="8" height="4" fill="navy"/></g>
