<g id="arc-only" data-box="0 0 16 16"></g>
<g id="zero-line" data-box="16 0 16 16"><circle cx="24" cy="8" r="3" fill="navy"/></g>
<g id="zero-rx-same" data-box="32 0 16 16"></g>
<g id="zero-ry-same" data-box="48 0 16 16"></g>
