<svg xmlns="http://www.w3.org/2000/svg" width="64" height="24">
<!-- What tst/unit/use-shadow-styles.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="64" height="24" fill="white"/>
<defs>
<g class="special"><rect id="a" width="10" height="10"/></g>
<g><rect width="1" height="1"/><rect id="b" width="10" height="10"/></g>
<rect id="c" class="mine plain" width="8" height="8" stroke-width="2" fill="red" stroke="red"/>
<g id="d" class="keep"><rect width="10" height="10"/></g>
<g id="v"><rect width="10" height="10" fill="lime" visibility="visible"/><rect x="2" y="2" width="6" height="6" fill="red"/></g>
</defs>
<g id="not-ancestors" data-box="1 1 12 12"><rect x="2" y="2" width="10" height="10" fill="lime"/></g>
<g id="not-siblings" data-box="13 1 12 12"><rect x="14" y="2" width="10" height="10" fill="lime"/></g>
<g id="clone-rules" data-box="25 1 12 12"><rect x="26" y="2" width="10" height="10" fill="lime"/></g>
<g id="inherit-from-use" data-box="37 1 12 12"><rect x="38" y="2" width="10" height="10" fill="lime"/></g>
<g id="visibility" data-box="49 1 12 12"><rect x="50" y="2" width="10" height="10" fill="lime"/></g>
</svg>
