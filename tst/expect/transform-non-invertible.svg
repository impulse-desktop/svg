<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- What tst/unit/transform-non-invertible.svg draws, drawn plainly;
each cell's id is what the statement ledgers link to. -->
<rect width="64" height="16" fill="white"/>
<g id="product" data-box="1 1 10 14"><rect x="2" y="2" width="8" height="12" fill="lime"/></g>
<g id="hidden" data-box="13 1 50 14"></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="8" height="12"/></g>
</svg>
