<svg xmlns="http://www.w3.org/2000/svg" width="64" height="56">
<!-- What tst/unit/raster-work-limit.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="64" height="56" fill="white"/>
<g id="row" data-box="0 0 64 8"><line x1="0" y1="4" x2="64" y2="4" stroke="teal" stroke-opacity=".3" stroke-linecap="round"/></g>
<g id="column" data-box="56 8 8 48"><line x1="56.5" y1="8" x2="56.5" y2="56" stroke="teal" stroke-opacity=".3" stroke-linecap="round"/></g>
<g id="crowd" data-box="0 16 48 16"><rect y="19" width="48" height="10" fill="teal" fill-opacity=".5"/></g>
</svg>
