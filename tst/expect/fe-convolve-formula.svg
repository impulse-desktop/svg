<svg xmlns="http://www.w3.org/2000/svg" width="84" height="16">
<!-- What tst/unit/fe-convolve-formula.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="84" height="16" fill="white"/>
<defs>
<filter id="c0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="1 2 1 0 1 0 -1 0 2"/></filter>
<filter id="c1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3 2" kernelMatrix="1 0 2 1 1 -1" targetX="0" targetY="1" divisor="2" bias=".1"/></filter>
<filter id="c2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 1 0 1 2 1 0 1 0" preserveAlpha="true"/></filter>
<filter id="c3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="1 1 1 1 -8 1 1 1 1" bias=".5" edgeMode="none"/></filter>
<filter id="c4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="2.7" kernelMatrix="1 2 3 4" divisor="0" edgeMode="wrap"/></filter>
<filter id="c5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3 1" kernelMatrix="1 2 1" edgeMode="mirror"/></filter>
<filter id="c6" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 1 0 0 1 0 0 0 0" preserveAlpha="true" bias=".2"/></filter>
<filter id="c7" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="1 2 3"/></filter>
<g id="src"><rect x="0" y="0" width="1" height="1" fill="#25c985" fill-opacity="1"/><rect x="1" y="0" width="1" height="1" fill="#f0dc28" fill-opacity="1"/><rect x="2" y="0" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="3" y="0" width="1" height="1" fill="#25c985" fill-opacity="1"/><rect x="4" y="0" width="1" height="1" fill="#5a1ea0" fill-opacity="1"/><rect x="5" y="0" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="6" y="0" width="1" height="1" fill="#f0dc28" fill-opacity="0.3"/><rect x="7" y="0" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="0" y="1" width="1" height="1" fill="#cc4d1a" fill-opacity="0.3"/><rect x="1" y="1" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="2" y="1" width="1" height="1" fill="#3399e6" fill-opacity="1"/><rect x="3" y="1" width="1" height="1" fill="#5a1ea0" fill-opacity="0.3"/><rect x="4" y="1" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="5" y="1" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="6" y="1" width="1" height="1" fill="#25c985" fill-opacity="0.3"/><rect x="7" y="1" width="1" height="1" fill="#3399e6" fill-opacity="1"/><rect x="0" y="2" width="1" height="1" fill="#5a1ea0" fill-opacity="0.6"/><rect x="1" y="2" width="1" height="1" fill="#5a1ea0" fill-opacity="1"/><rect x="2" y="2" width="1" height="1" fill="#cc4d1a" fill-opacity="1"/><rect x="3" y="2" width="1" height="1" fill="#25c985" fill-opacity="1"/><rect x="4" y="2" width="1" height="1" fill="#5a1ea0" fill-opacity="1"/><rect x="5" y="2" width="1" height="1" fill="#5a1ea0" fill-opacity="1"/><rect x="6" y="2" width="1" height="1" fill="#5a1ea0" fill-opacity="1"/><rect x="7" y="2" width="1" height="1" fill="#f0dc28" fill-opacity="0.3"/><rect x="0" y="3" width="1" height="1" fill="#0a0a0a" fill-opacity="0.6"/><rect x="1" y="3" width="1" height="1" fill="#f0dc28" fill-opacity="0.3"/><rect x="2" y="3" width="1" height="1" fill="#25c985" fill-opacity="0.6"/><rect x="3" y="3" width="1