<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16">
<!-- What tst/unit/filter-property-chain.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="64" height="16" fill="white"/>
<defs><rect id="nf" width="1" height="1"/>
<filter id="shift" x="-1" y="-1" width="3" height="3"><feOffset dx="4"/></filter>
<filter id="crop" x="0" y="0" width=".75" height="1"><feOffset/></filter>
<filter id="alpha" x="-1" y="-1" width="3" height="3"><feFlood flood-color="lime"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs>
<g id="missing" data-box="1 1 10 14"><rect x="2" y="2" width="8" height="12" fill="lime"/></g>
<g id="no-filter" data-box="13 1 8 14"><rect x="14" y="2" width="6" height="12" fill="lime"/></g>
<g id="order" data-box="21 1 12 14"><rect x="26" y="2" width="2" height="12" fill="lime"/></g>
<g id="source-alpha" data-box="33 1 14 14"><rect x="38" y="2" width="8" height="12" fill="lime"/></g>
<g id="function-srgb" data-box="51 1 10 14"><rect x="52" y="2" width="8" height="6" fill="#646464"/><rect x="52" y="8" width="8" height="6" fill="#646464"/></g>
<g fill="none" stroke="black" stroke-width=".25"><rect x="2" y="2" width="8" height="12"/><rect x="14" y="2" width="6" height="12"/><rect x="26" y="2" width="2" height="12"/><rect x="38" y="2" width="8" height="12"/></g>
</svg>
