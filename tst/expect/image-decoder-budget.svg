<svg xmlns="http://www.w3.org/2000/svg" width="84" height="12">
<!-- What tst/unit/image-decoder-budget.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<rect width="84" height="12" fill="white"/>
<g id="large-indexed" data-box="0 0 12 12"><rect x="3" y="3" width="6" height="6" fill="lime"/></g>
<g id="large-natural-bounds" data-box="12 0 12 12"><rect x="15" y="3" width="6" height="6" fill="lime"/></g>
<g id="eight-bit-at-budget" data-box="24 0 12 12"><rect x="27" y="3" width="6" height="6" fill="lime"/></g>
<g id="eight-bit-over-budget" data-box="36 0 12 12"><rect x="39" y="3" width="6" height="6" fill="lime"/></g>
<g id="sixteen-bit-at-budget" data-box="48 0 12 12"><rect x="51" y="3" width="6" height="6" fill="lime"/></g>
<g id="sixteen-bit-over-budget" data-box="60 0 12 12"><rect x="63" y="3" width="6" height="6" fill="lime"/></g>
<g id="small-sixteen-bit" data-box="72 0 12 12"><rect x="75" y="3" width="6" height="6" fill="black"/></g>
</svg>
