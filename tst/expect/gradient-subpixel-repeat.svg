<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
<!-- The integral of each repeated cycle is half green and half blue. -->
<rect width="64" height="64" fill="white"/>
<g id="pad-distinct-ends" data-box="8 4 48 8"><rect x="8" y="4" width="24" height="8" fill="green"/><rect x="32" y="4" width="24" height="8" fill="blue"/></g>
<g id="repeat-average" data-box="8 20 48 8"><rect x="8" y="20" width="48" height="8" fill="#004080"/></g>
<g id="reflect-average" data-box="8 36 48 8"><rect x="8" y="36" width="48" height="8" fill="#004080"/></g>
<g id="narrow-stop-average" data-box="8 52 48 8"><rect x="8" y="52" width="48" height="8" fill="#0300fc"/></g>
</svg>
