<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" data-tolerance="3">
<!-- A unit-distance Sobel kernel samples the same affine surface slope. -->
<defs>
  <linearGradient id="ramp" gradientUnits="userSpaceOnUse" x1="4" x2="24">
    <stop stop-color="white" stop-opacity="0"/>
    <stop offset="1" stop-color="white" stop-opacity="1"/>
  </linearGradient>
  <filter id="diffuse" color-interpolation-filters="sRGB">
    <feDiffuseLighting in="SourceAlpha" surfaceScale="4" kernelUnitLength="1"><feDistantLight azimuth="0" elevation="45"/></feDiffuseLighting>
  </filter>
  <filter id="specular" color-interpolation-filters="sRGB">
    <feSpecularLighting in="SourceAlpha" surfaceScale="4" specularExponent="8" kernelUnitLength="1"><feDistantLight azimuth="225" elevation="30"/></feSpecularLighting>
  </filter>
</defs>
<rect width="32" height="32" fill="white"/>
<rect y="16" width="32" height="16" fill="#202020"/>
<g id="diffuse-slope" data-box="8 5 10 6"><rect x="4" y="4" width="20" height="8" fill="url(#ramp)" filter="url(#diffuse)"/></g>
<g id="specular-slope" data-box="8 21 10 6"><rect x="4" y="20" width="20" height="8" fill="url(#ramp)" filter="url(#specular)"/></g>
<path fill="white" d="M0 0H32V5H0Z M0 11H32V16H0Z M0 5H8V11H0Z M18 5H32V11H18Z"/>
<path fill="#202020" d="M0 16H32V21H0Z M0 27H32V32H0Z M0 21H8V27H0Z M18 21H32V27H18Z"/>
</svg>
