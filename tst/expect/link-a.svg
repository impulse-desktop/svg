<svg xmlns="http://www.w3.org/2000/svg" width="40" height="12">
<!-- What tst/unit/link-a.svg draws, drawn plainly; each cell's id is
what the statement ledgers link to. -->
<g id="href" data-box="0 0 10 12"><rect x="0" width="10" height="12" fill="lime"/></g>
<g id="no-href" data-box="10 0 10 12"><rect x="10" width="10" height="12" fill="lime"/></g>
<g id="nested" data-box="20 0 10 12"><rect x="20" width="10" height="12" fill="lime"/></g>
<g id="inherit" data-box="30 0 10 12"><rect x="30" width="10" height="12" fill="lime"/></g>
</svg>
