<svg xmlns="http://www.w3.org/2000/svg" width="80" height="16">
<!-- gAMA=45455: decode each 8-bit color sample as (sample/255)^(1/gAMA),
encode by the sRGB transfer curve, round to 8 bits; alpha stays 128. -->
<rect id="gamma-alone" data-box="0 0 16 16" x="0" width="16" height="16" fill="#ee151f" fill-opacity="0.5019607843137255"/>
<rect id="icc-gamma-fallback" data-box="16 0 16 16" x="16" width="16" height="16" fill="#ee151f" fill-opacity="0.5019607843137255"/>
<rect id="icc-no-gamma" data-box="32 0 16 16" x="32" width="16" height="16" fill="#ed1c24" fill-opacity="0.5019607843137255"/>
<rect id="srgb-over-gamma" data-box="48 0 16 16" x="48" width="16" height="16" fill="#ed1c24" fill-opacity="0.5019607843137255"/>
<rect id="palette-icc-gamma" data-box="64 0 16 16" x="64" width="16" height="16" fill="#ee151f" fill-opacity="0.5019607843137255"/>
</svg>
