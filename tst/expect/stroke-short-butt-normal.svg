<g fill="none" stroke="white" stroke-width="20">
  <path d="M 250.5 195.5 C 251.5 194.5 252.3 194.41467 253 194 L 253.89999 193.536"/>
  <path d="M 354.39999 193.536 L 353.5 194 C 352.8 194.41467 352 194.5 351 195.5"/>
</g>
<g id="forward-outside" data-box="39 111 1 1" data-tolerance="16">
  <rect x="255.62109375" y="201.15234375" width="0.78515625" height="0.78515625" fill="black"/>
</g>
<g id="forward-inside" data-box="37 105 1 1">
  <rect x="254.05078125" y="196.44140625" width="0.78515625" height="0.78515625" fill="white"/>
</g>
<g id="reverse-outside" data-box="167 111 1 1" data-tolerance="16">
  <rect x="356.12109375" y="201.15234375" width="0.78515625" height="0.78515625" fill="black"/>
</g>
<g id="reverse-inside" data-box="165 105 1 1">
