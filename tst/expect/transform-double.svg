<svg xmlns="http://www.w3.org/2000/svg" width="100" height="30">
<!-- What tst/unit/transform-double.svg draws, drawn plainly; each
cell's id is what the statement ledgers link to. -->
<g id="viewbox-offset" data-box="0 0 100 10"><rect x="25" y="0" width="50" height="10" fill="navy"/></g>
<g id="css-transform" data-box="0 10 100 10"><rect x="25" y="10" width="50" height="10" fill="green"/></g>
<g id="nested-viewport" data-box="0 20 30 10"><rect x="0.125" y="20" width="25" height="10" fill="maroon"/></g>
</svg>
