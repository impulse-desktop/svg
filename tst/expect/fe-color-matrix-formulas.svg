<g id="luminance-to-alpha" data-box="31 1 10 14"><rect x="32" y="2" width="8" height="6" fill="#000000" fill-opacity="0.3934"/><rect x="32" y="8" width="8" height="6" fill="#000000" fill-opacity="0.3934"/></g>
<g id="value-counts" data-box="41 1 10 14"><rect x="42" y="2" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="42" y="8" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/></g>
<g id="defaults" data-box="1 15 30 14"><rect x="2" y="16" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="2" y="22" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="12" y="16" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="12" y="22" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="22" y="16" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/><rect x="22" y="22" width="8" height="6" fill="#cc4d1a" fill-opacity="0.6"/></g>
