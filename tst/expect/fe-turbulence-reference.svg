<svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
<!-- What tst/unit/fe-turbulence-reference.svg draws, drawn plainly;
each cell's id is what the statement ledgers link to. -->
<rect width="110" height="20" fill="white"/>
<defs>
<filter id="t0" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".1"/></filter>
<filter id="t1" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".05 .2" numOctaves="3" seed="7.6" type="fractalNoise"/></filter>
<filter id="t2" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".2" numOctaves="2" seed="-3.7"/></filter>
<filter id="t3" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".13" stitchTiles="stitch" type="fractalNoise"/></filter>
<filter id="t4" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".15" numOctaves="2" type="fractalNoise" color-interpolation-filters="linearRGB"/></filter>
<filter id="t5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise"/></filter>
<filter id="t6" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".2" numOctaves="0"/></filter>
<filter id="t7" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".12" numOctaves="2.5" seed="2"/></filter>
<filter id="t8" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence baseFrequency=".1" seed="346"/></filter>
</defs>
<g id="turbulence" data-box="1 1 12 18"><image x="2" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="2" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="fractal-noise" data-box="13 1 12 18"><image x="14" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="14" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="two-frequencies" data-box="25 1 12 18"><image x="26" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="26" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="seed" data-box="37 1 12 18"><image x="38" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="38" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="stitch" data-box="49 1 12 18"><image x="50" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="50" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="linear-channels" data-box="61 1 12 18"><image x="62" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAYAAADA+m62AAAAEElEQVR42mNoIBIwjCrEBwCHQqABNFG1FgAAAABJRU5ErkJggg=="/><image x="62" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAYAAADA+m62AAAAEElEQVR42mNoIBIwjCrEBwCHQqABNFG1FgAAAABJRU5ErkJggg=="/></g>
<g id="zero-frequency" data-box="73 1 12 18"><image x="74" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAYAAADA+m62AAAADUlEQVR42mNgGAXUAAABSAABvRyKBwAAAABJRU5ErkJggg=="/><image x="74" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAYAAADA+m62AAAADUlEQVR42mNgGAXUAAABSAABvRyKBwAAAABJRU5ErkJggg=="/></g>
<g id="no-octaves" data-box="85 1 12 18"><image x="86" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="86" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
<g id="fractional-octaves" data-box="97 1 12 18"><image x="98" y="2" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/><image x="98" y="10" width="10" height="8" image-rendering="pixelated" href="data:image/png;base64,"/></g>
</svg>
