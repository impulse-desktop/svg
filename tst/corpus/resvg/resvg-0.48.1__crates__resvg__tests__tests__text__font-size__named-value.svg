<svg id="svg1" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans">
    <title>Named value</title>

    <g id="g1" font-size="12" transform="translate(10)">
        <g id="g2" transform="translate(0 20)">
            
            <rect id="rect1" width="10em" height="10"/>
        </g>

        <g id="g3" transform="translate(0 50)">
            
            <rect id="rect2" font-size="xx-small" width="10em" height="10"/>
        </g>

        <g id="g4" transform="translate(0 80)">
            
            <rect id="rect3" font-size="x-small" width="10em" height="10"/>
        </g>

        <g id="g5" transform="translate(0 110)">
            
            <rect id="rect4" font-size="small" width="10em" height="10"/>
        </g>

        <g id="g6" transform="translate(0 140)">
            
            <rect id="rect5" font-size="medium" width="10em" height="10"/>
        </g>

        <g id="g7" transform="translate(0 170)">
            
            <rect id="rect6" font-size="large" width="10em" height="10"/>
        </g>

        <g id="g8" transform="translate(0 200)">
            
            <rect id="rect7" font-size="x-large" width="10em" height="10"/>
        </g>

        <g id="g9" transform="translate(0 230)">
            
            <rect id="rect8" font-size="xx-large" width="10em" height="10"/>
        </g>

        <g id="g10" transform="translate(0 260)">
            
            <rect id="rect9" font-size="larger" width="10em" height="10"/>
        </g>

        <g id="g11" transform="translate(0 290)">
            
            <rect id="rect10" font-size="smaller" width="10em" height="10"/>
        </g>

        <g id="g12" transform="translate(0 320)">
            
            <!-- both rects should have equal width -->
            <rect id="rect11" font-size="50%" width="10em" height="5"/>
            <rect id="rect12" y="5" width="5em" height="5"/>
        </g>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="398" height="398" fill="none" stroke="black"/>
</svg>


