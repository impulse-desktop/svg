<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <!-- Définition des couleurs -->
  <defs>
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6f7ff" />
      <stop offset="100%" stop-color="#bae7ff" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1000" height="500" fill="#f9f9f9" />
  
  

  <!-- Ligne principale de la chronologie -->
  <rect x="100" y="200" width="800" height="10" rx="5" ry="5" fill="url(#timelineGradient)" />

  <!-- Points de la timeline et connecteurs -->
  <!-- Novembre 2024 -->
  <circle cx="100" cy="205" r="15" fill="#e63946" />
  <line x1="100" y1="220" x2="100" y2="250" stroke="#666" stroke-width="2" />
  <rect x="30" y="250" width="140" height="80" rx="5" ry="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  
  
  
  

  <!-- Décembre 2024 -->
  <circle cx="250" cy="205" r="15" fill="#457b9d" />
  <line x1="250" y1="220" x2="250" y2="250" stroke="#666" stroke-width="2" />
  <rect x="180" y="250" width="140" height="80" rx="5" ry="5" fill="#d1ecf1" stroke="#0d6efd" stroke-width="2" />
  
  
  
  
  
  <!-- Janvier 2025 -->
  <circle cx="400" cy="205" r="15" fill="#e63946" />
  <line x1="400" y1="220" x2="400" y2="250" stroke="#666" stroke-width="2" />
  <rect x="330" y="250" width="140" height="80" rx="5" ry="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  
  
  
  

  <!-- Février 2025 -->
  <circle cx="550" cy="205" r="15" fill="#457b9d" />
  <line x1="550" y1="220" x2="550" y2="250" stroke="#666" stroke-width="2" />
  <rect x="480" y="250" width="140" height="80" rx="5" ry="5" fill="#d1ecf1" stroke="#0d6efd" stroke-width="2" />
  
  
  
  
  

  <!-- Mars 2025 (début) -->
  <circle cx="700" cy="205" r="15" fill="#e63946" />
  <line x1="700" y1="220" x2="700" y2="250" stroke="#666" stroke-width="2" />
  <rect x="630" y="250" width="140" height="80" rx="5" ry="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  
  
  
  

  <!-- Mars 2025 (fin) -->
  <circle cx="850" cy="205" r="15" fill="#457b9d" />
  <line x1="850" y1="220" x2="850" y2="250" stroke="#666" stroke-width="2" />
  <rect x="780" y="250" width="140" height="80" rx="5" ry="5" fill="#d1ecf1" stroke="#0d6efd" stroke-width="2" />
  
  
  
  

  <!-- Récapitulatif des volte-face -->
  <rect x="100" y="360" width="800" height="110" rx="5" ry="5" fill="#f0f0f0" stroke="#999" stroke-width="2" />
  
  
  
  
  
</svg>