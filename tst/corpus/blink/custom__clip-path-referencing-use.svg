<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <rect id="rect" width="100" height="100" />
    <clipPath id="clip">
      <use xlink:href="#rect" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="200" height="200" fill="red" />
    <rect width="100" height="100" fill="green" />
  </g>

  
   
</svg>

