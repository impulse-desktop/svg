<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="nothing">
    </clipPath>
    <clipPath id="emptyrect">
      <rect width="0" height="0"/>
    </clipPath>
  </defs>

  <rect fill="green" width="100" height="100"/>
  <g clip-path="url(#nothing)" >
    <rect width="100" height="100" fill="red"/>
  </g>
  <g clip-path="url(#emptyrect)" >
    <rect width="100" height="100" fill="red"/>
  </g>

  <g>
    
    
  </g>
</svg>

