      <!-- ====================================================================== -->

      <rect id="fill-03" fill="currentColor" stroke="#000000" x="75" y="110" width="100" height="140"/>
      <rect id="fill-04" color="blue" fill="currentColor" stroke="#000000" x="275" y="110" width="100" height="140"/>

      
      

    </g>
