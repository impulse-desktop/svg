<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
<defs>
<radialGradient id="r" cx="0.5" cy="0.5" r="0.5" gradientTransform="rotate(30 0.5 0.5) scale(1 0.6)"><stop offset="0" stop-color="gold"/><stop offset="1" stop-color="navy"/></radialGradient>
<radialGradient id="rh" href="#r" gradientTransform="translate(0.2 0)"/>
<linearGradient id="l"><stop offset="0" stop-color="crimson"/><stop offset="0.5" stop-color="white"/><stop offset="1" stop-color="teal"/></linearGradient>
<linearGradient id="sx" href="#l" gradientTransform="scaleX(0.5)"/>
