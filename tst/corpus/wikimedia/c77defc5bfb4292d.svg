      <use href="#branch" transform="matrix(0 1 1 0 0 0)" />
    </g>
    <!-- conjugates -->
    <g id="hyp" stroke="#ec0">
      <use href="#hupbole" />
      <use href="#hupbole" transform="rotate(90)" />
