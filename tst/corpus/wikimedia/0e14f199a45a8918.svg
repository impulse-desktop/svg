    </g>
    <g class="Lines">
      <rect fill="rgba(255,255,255,0)" height="54" opacity="0" width="219" x="15" y="15"></rect>
      <path d="M15 23.4L88 15L161 33.5L234 43.5" fill="none" id="outline__Sao-Tome-and-Principe" stroke="#fff" stroke-linecap="butt" stroke-linejoin="round" stroke-width="4.7"></path>
      <g id="line__Sao-Tome-and-Principe">
        <polyline fill="none" id="line__Sao-Tome-and-Principe" points="15.00,23.40 88.00,15.00 161.00,33.50 234.00,43.50" stroke="#cad4d6" stroke-linecap="butt" stroke-linejoin="round" stroke-opacity="1" stroke-width="2.7"></polyline>
