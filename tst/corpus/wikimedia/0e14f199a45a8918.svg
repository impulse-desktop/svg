        <line id="2024" stroke="#999" stroke-width="1" x1="234" x2="234" y1="68.5" y2="74"></line>
      </g>
      <g id="tick-labels">
        
        
      </g>
    </g>
    <g class="AxisGridLines horizontalLines" id="horizontal-grid-lines">
