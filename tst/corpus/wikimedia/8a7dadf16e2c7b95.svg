<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="479.3326160228322" height="479.3326160228322" viewBox="-8 -8 495.3326160228322 495.3326160228322">

    <defs>

        <!-- define big circle -->
        <circle id="base-circle" cx="239.6663080114161" cy="239.6663080114161" r="239.6663080114161" />

        <!-- define big white circle -->
        <use id="white-circle" href="#base-circle" style="fill: white; stroke: black; stroke-width: 1.5;" />

        <!-- define black vertex circles -->
        <g id="vertex-circles">
            <circle cx="169.6663" cy="431.9897" r="12" />
            <circle cx="62.4201" cy="341.9995" r="12" />
            <circle cx="38.1093" cy="204.1264" r="12" />
            <circle cx="108.1093" cy="82.8828" r="12" />
            <circle cx="239.6663" cy="35.0" r="12" />
            <circle cx="371.2233" cy="82.8828" r="12" />
            <circle cx="441.2233" cy="204.1264" r="12" />
            <circle cx="416.9125" cy="341.9995" r="12" />
            <circle cx="309.6663" cy="431.9897" r="12" />
        </g>

        <!-- define base polygons -->
        <polygon id="poly-base-0" points="371.2233,82.8828 416.9125,341.9995" />
        <polygon id="poly-base-1" points="169.6663,431.9897 62.4201,341.9995 38.1093,204.1264 108.1093,82.8828 239.6663,35.0 441.2233,204.1264 309.6663,431.9897" />

        <!-- define masks -->
        <mask id="mask-0" mask-type="luminance">
          <use href="#poly-base-0" style="fill: white; stroke: white; stroke-width: 54; stroke-linejoin: round;" />
          <use href="#poly-base-0" style="fill: black; stroke: black; stroke-width: 36; stroke-linejoin: round;" />
        </mask>
        <mask id="mask-1" mask-type="luminance">
          <use href="#poly-base-1" style="fill: white; stroke: white; stroke-width: 54; stroke-linejoin: round;" />
          <use href="#poly-base-1" style="fill: black; stroke: black; stroke-width: 36; stroke-linejoin: round;" />
        </mask>

        <!-- define finished polygons -->
        <g id="poly-0">
            <use href="#base-circle" mask="url(#mask-0)" style="fill: black;" />
            <use href="#poly-base-0" style="stroke: black; fill: black; stroke-width: 54; stroke-linejoin: round; opacity: .4;" />
        </g>
        <g id="poly-1">
            <use href="#base-circle" mask="url(#mask-1)" style="fill: black;" />
            <use href="#poly-base-1" style="stroke: black; fill: black; stroke-width: 54; stroke-linejoin: round; opacity: .4;" />
        </g>

        <!-- define numbers in mini circles -->
        
        
    </defs>

    <!-- big white circle -->
    <use href="#white-circle" />

    <!-- polygons -->
    <use href="#poly-0" />
    <use href="#poly-1" />

    <!-- horizontal lines between vertices -->
    <g style="stroke: black; stroke-opacity: .2; stroke-dasharray: 3; stroke-width: 1;">
        <line x1="169.6663" y1="431.9897" x2="309.6663" y2="431.9897" />
        <line x1="62.4201" y1="341.9995" x2="416.9125" y2="341.9995" />
        <line x1="38.1093" y1="204.1264" x2="441.2233" y2="204.1264" />
        <line x1="108.1093" y1="82.8828" x2="371.2233" y2="82.8828" />
    </g>

    <!-- black vertex circles -->
    <use href="#vertex-circles" />

    <!-- white vertex numbers -->
    <g text-anchor="middle" dominant-baseline="central" style="fill: white; font-weight: bold; font-size: 19; font-family: Arial, Helvetica, sans-serif;">
        
        
        
        
        
        
        
        
        
    </g>

    <!-- left mini circle -->
    <g transform="scale(.146)">
        <use href="#white-circle" />
        <use href="#poly-0" opacity=".6" />
        <use href="#vertex-circles" opacity=".7" />
    </g>

    <!-- right mini circle -->
    <g transform="translate(409.3500540834987) scale(.146)">
        <use href="#white-circle" />
        <use href="#poly-1" opacity=".6" />
        <use href="#vertex-circles" opacity=".7" />
    </g>

    <!-- numbers in mini circles -->
    <g text-anchor="middle" dominant-baseline="central" style="font-weight: bold; font-size: 15; font-family: Arial, Helvetica, sans-serif;">
        <g style="fill: white; stroke: white; stroke-width: 1;">
            <use href="#left-number" />
            <use href="#right-number" />
        </g>
        <g style="fill: black; opacity: .9;">
            <use href="#left-number" />
            <use href="#right-number" />
        </g>
    </g>

</svg>