<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
	<g id="rainbownossetia">
		<title>The Rainbow Flag of North Ossetia-Alania</title>

		<defs>
			<linearGradient id="Rainbow" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
				<stop offset="0" stop-color="#F00"/>
				<stop offset="0.1667" stop-color="#F00"/>
				<stop offset="0.1667" stop-color="#FF9800"/>
				<stop offset="0.3333" stop-color="#FF9800"/>
				<stop offset="0.3333" stop-color="#FF0"/>
				<stop offset="0.5" stop-color="#FF0"/>
				<stop offset="0.5" stop-color="#009800"/>
				<stop offset="0.6667" stop-color="#009800"/>
				<stop offset="0.6667" stop-color="#00F"/>
				<stop offset="0.8333" stop-color="#00F"/>
				<stop offset="0.8333" stop-color="#980098"/>
				<stop offset="1.00" stop-color="#980098"/>
			</linearGradient>
		</defs>

		<g id="rainbowflag" fill="url(#Rainbow)">
			<title>The Rainbow Flag</title>
			<rect width="900" height="600"/>
		</g>

		<g id="nossetia">
			<title>Flag of North Ossetia-Alania</title>
			<desc>The flags of South Ossetia and North Ossetia-Alania are almost identical, differing only slightly in the shades of the red and yellow stripes. At least according to wikipedia.</desc>

			<rect fill="#FF0"    width="600" height="300"/>
			<rect fill="#ED1C24" width="600" height="200"/>
			<rect fill="#F7F7F7" width="600" height="100"/>
		</g>
	</g>
</svg>
