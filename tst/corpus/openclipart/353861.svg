<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <title>Realistic Kingfisher Illustration</title>
  
  <defs>
    <!-- GRADIENTS -->
    
    <!-- Body: Cyan to Teal -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
    </linearGradient>

    <!-- Breast: Bright Orange -->
    <linearGradient id="breastGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#FF6D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFAB40;stop-opacity:1" />
    </linearGradient>

    <!-- Wing: Deep Blue -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2962FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>

    <!-- Beak: Dark Grey -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#212121;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#424242;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
    </linearGradient>

    <!-- Eye: Radial Shine -->
    <radialGradient id="eyeGrad" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>

    <!-- Branch: Wood Texture -->
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- BACKGROUND -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGlow)" />

  <!-- BRANCH SYSTEM -->
  <g transform="translate(0, 50)">
    
    <!-- Main Log & Thick Branch -->
    <path fill="url(#branchGrad)" stroke="#3E2723" stroke-width="1" d="
      M -10,350 
      Q 100,340 200,360 
      Q 280,375 320,360
      /* Twig Base */
      L 340,365
      Q 380,320 380,280 
      L 395,290 /* Thickening the twig connection */
      Q 400,330 365,370
      /* Continue Main Branch */
      L 510,340 L 510,380 
      Q 300,450 200,420 
      Q 100,400 -10,420 Z" />

    <!-- Leaf Stems (Connecting leaves to the wood) -->
    <path fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round" d="
      M 380,280 L 370,260 /* Stem for top leaf */
      M 380,280 L 410,285 /* Stem for side leaf */
      M 385,290 L 400,310 /* Stem for bottom leaf */
      " />
  </g>

  <!-- LEAVES (Attached to the stems) -->
  <g transform="translate(0, 50)">
    <!-- Top Leaf -->
    <path fill="#66BB6A" stroke="#2E7D32" stroke-width="0.5" d="M 370,260 Q 350,230 380,220 Q 390,250 370,260 Z" />
    <!-- Side Leaf -->
    <path fill="#43A047" stroke="#2E7D32" stroke-width="0.5" d="M 410,285 Q 450,270 460,300 Q 430,320 410,285 Z" />
    <!-- Bottom Leaf -->
    <path fill="#81C784" stroke="#2E7D32" stroke-width="0.5" d="M 400,310 Q 420,340 400,360 Q 380,340 400,310 Z" />
  </g>

  <!-- BIRD GROUP -->
  <g id="bird" transform="translate(50, 10)">
    
    <!-- TAIL (Deeply connected) -->
    <path fill="#0277BD" d="M 160,310 L 80,420 L 130,410 L 190,320 Z" />

    <!-- LEGS (Upper Thighs) -->
    <path fill="#FFA000" d="M 175,340 L 170,380 L 190,380 L 195,340 Z" />
    <path fill="#FFA000" d="M 215,350 L 210,390 L 230,390 L 235,350 Z" />

    <!-- FEET/CLAWS (Gripping Branch) -->
    <g stroke="#E65100" stroke-width="4" stroke-linecap="round" fill="none">
        <!-- Left Foot -->
        <path d="M 170,380 Q 165,400 160,410" />
        <path d="M 180,380 Q 180,405 175,415" />
        <path d="M 190,380 Q 195,400 200,410" />
        <!-- Right Foot -->
        <path d="M 210,390 Q 205,410 200,420" />
        <path d="M 220,390 Q 220,415 215,425" />
        <path d="M 230,390 Q 235,410 240,420" />
    </g>

    <!-- BODY (Lowered Belly to touch/cover upper legs) -->
    <!-- Belly curve adjusted from previous y=340 to y=355 -->
    <path fill="url(#bodyGrad)" d="
      M 160,330
      C 140,300 130,200 180,150 
      C 210,120 250,110 280,120 
      C 310,130 330,160 330,200 
      C 330,260 310,340 250,355 
      C 220,360 180,350 160,330 Z" />

    <!-- BREAST/BELLY PATCH (Adjusted to match new body curve) -->
    <path fill="url(#breastGrad)" d="
      M 280,160
      Q 330,220 300,310
      Q 280,350 230,355
      Q 250,310 260,250
      Q 265,200 280,160 Z" />

    <!-- WING -->
    <g>
      <path fill="url(#wingGrad)" d="
        M 180,180 
        Q 250,180 270,250 
        Q 260,320 160,310 
        Q 140,240 180,180 Z" />
      
      <!-- Wing Details -->
      <path fill="#448AFF" opacity="0.5" d="M 180,190 Q 220,195 230,230" stroke="none" />
      <path fill="none" stroke="#82B1FF" stroke-width="2" opacity="0.6" d="
        M 190,210 Q 220,220 230,250
        M 185,230 Q 210,240 220,270" />
    </g>

    <!-- HEAD SHADOW -->
    <path fill="#006064" opacity="0.3" d="M 180,150 C 210,120 250,110 280,120 C 290,123 300,130 305,140 C 260,130 220,140 180,150 Z" />

    <!-- BEAK -->
    <g>
      <path fill="#424242" d="M 315,160 L 420,165 L 315,175 Z" />
      <path fill="url(#beakGrad)" d="M 310,145 L 430,165 L 315,160 C 315,160 310,150 310,145 Z" />
    </g>

    <!-- EYE -->
    <g>
      <circle cx="300" cy="150" r="10" fill="#ffffff" />
      <circle cx="302" cy="150" r="8" fill="url(#eyeGrad)" />
      <circle cx="305" cy="147" r="3" fill="#ffffff" />
    </g>
      
  </g>
</svg>