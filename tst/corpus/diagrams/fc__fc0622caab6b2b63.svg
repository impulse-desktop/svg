<svg xmlns="http://www.w3.org/2000/svg">
  <title>Text selection along character boundary</title>

  <style>#test::selection { color: red }</style>

  <defs>
    <linearGradient id="boundaries" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="50%" style="stop-color: fuchsia"/>
      <stop offset="50%" style="stop-color: blue"/>
    </linearGradient>
  </defs>

  

  

  
  <rect x="120" y="80" width="100" height="200" fill="white"/>
</svg>