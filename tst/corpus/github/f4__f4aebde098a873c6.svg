<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     height="100" width="100">
  <style>
  <![CDATA[
      a:link    > rect  { fill: lime; }
      a:visited > rect  { fill: red;  }
  ]]>
  </style>

  
  <a xlink:href="" id="foo">
    <rect x="0" y="0"  width="100" height="100" fill="orange"/>
  </a>
</svg>