<svg width="375px" height="375px" 
	 version="1.1" xmlns="http://www.w3.org/2000/svg">
  <desc>A tennis court with stats</desc>
	<style>
		#buttons rect:hover {stroke: dimgrey; fill: grey; fill-opacity: 8%}
		#buttons g.selected rect:first-child {stroke: dimgrey; fill: grey; fill-opacity: 3%}
	</style>

	<g id="scale" transform="scale(1.5)">
		<g font-family="Gill Sans, Helvetica, Arial, sans-serif" font-size="10px" color="black" text-anchor="middle">
			<defs>
				<linearGradient id="fadeout1" y1="0%" y2="100%" x1="1" x2="1">
					<stop offset="60%" stop-opacity="1" />
					<stop offset="99%" stop-opacity="0" />
				</linearGradient>
				<linearGradient id="fadeout2" y1="100%" y2="0%" x1="1" x2="1">
					<stop offset="60%" stop-opacity="1" />
					<stop offset="99%" stop-opacity="0" />
				</linearGradient>
			</defs>

<rect id="bg" x="0" y="0" width="100%" height="100%" fill="gainsboro"></rect>


			
<g transform="translate(3,5)">
	<g id="court" fill="yellowgreen" stroke="white" stroke-width="2px">
		<rect x="20" y="20" width="100" height="200"></rect>
		<line x1="20" y1="65" x2="120" y2="65"></line>
		<line x1="20" y1="175" x2="120" y2="175"></line>
		<line x1="70" y1="65" x2="70" y2="175"></line>
		<line x1="70" y1="20" x2="70" y2="25"></line>
