			<rect x="0" y="75" rx="5" ry="5" width="75" height="16" fill-opacity="0" stroke="grey" />
		</g>
		<g id="serve2_btn" cursor="pointer" onclick="parent.tennisvg.buttonClick(event);">
			<rect x="0" y="100" rx="5" ry="5" width="75" height="16" fill="white" stroke-opacity="0" />
			
			<rect x="0" y="100" rx="5" ry="5" width="75" height="16" fill-opacity="0" stroke="grey" />
