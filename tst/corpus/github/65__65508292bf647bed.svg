		</g>
	<g id="buttons" transform="translate(150,60)" opacity="1">
		<g id="serve1_btn" cursor="pointer" onclick="parent.tennisvg.buttonClick(event);">
			<rect x="0" y="0" rx="5" ry="5" width="75" height="16" fill="white" stroke-opacity="0" />
			
			<rect x="0" y="0" rx="5" ry="5" width="75" height="16" fill-opacity="0" stroke="grey" />
		</g>
		<g id="return1_btn" cursor="pointer" onclick="parent.tennisvg.buttonClick(event);">
			<rect x="0" y="25" rx="5" ry="5" width="75" height="16" fill="white" stroke-opacity="0" />
			
