		<rect id="z27" x="50" y="66" width="40" height="45" fill="url(#fadeout1)" opacity=".15"></rect>
		<rect id="z37" x="90" y="66" width="31" height="45" fill="url(#fadeout1)" opacity=".20"></rect>
		<rect id="z18" x="19" y="42" width="31" height="24" opacity=".20"></rect>
