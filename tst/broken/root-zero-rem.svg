<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" font-size="0">
  <!-- Expected: only the 16x16 square at (8,8).
       1rem = the root's computed font-size = 0, even though no text is drawn.
       resolveLength uses 16 instead whenever vp.rootFontSize is zero.
       The first rectangle must have zero width, and the second must not move. -->
  <rect x="8" y="32" width="1rem" height="24" fill="lime"/>
  <rect x="8" y="8" width="16" height="16" fill="lime" style="transform:translateX(1rem)"/>
</svg>
