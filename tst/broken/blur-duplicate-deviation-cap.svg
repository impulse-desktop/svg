<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <defs>
    <clipPath id="sample"><rect y="8" width="16" height="16"/></clipPath>
    <filter id="f" filterUnits="userSpaceOnUse" x="0" y="8" width="64" height="16"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="256 0" edgeMode="duplicate"/>
    </filter>
  </defs>
  <g clip-path="url(#sample)">
    <g filter="url(#f)">
      <rect y="8" width="32" height="16" fill="black"/>
      <rect x="32" y="8" width="32" height="16" fill="white"/>
    </g>
  </g>
</svg>
