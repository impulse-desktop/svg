<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32">
  <defs>
    <clipPath id="c" style="translate:16px">
      <rect y="8" width="16" height="16"/>
    </clipPath>
    <pattern id="p" patternUnits="userSpaceOnUse" width="32" height="8" style="translate:16px">
      <rect width="16" height="8" fill="lime"/>
    </pattern>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x2="16" style="translate:16px">
      <stop offset=".5" stop-color="lime"/>
      <stop offset=".5" stop-color="lime" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="8" width="32" height="16" fill="lime" clip-path="url(#c)"/>
  <g transform="translate(32)">
    <rect y="8" width="32" height="16" fill="url(#p)"/>
  </g>
  <g transform="translate(64)">
    <rect y="8" width="32" height="16" fill="url(#g)"/>
  </g>
</svg>
