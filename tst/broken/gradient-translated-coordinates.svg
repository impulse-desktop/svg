<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Expected: a 32px red-to-blue ramp, identical to x1=0,x2=32 at
       the origin. Both endpoints are distinct doubles, but gradientLength
       narrows them to the same float before the translation cancels.
       gradientPaint consequently treats the gradient as degenerate. -->
  <defs>
    <linearGradient id="gradient" gradientUnits="userSpaceOnUse"
                    x1="1000000000" x2="1000000032" y1="0" y2="0">
      <stop stop-color="red"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>
  </defs>
  <g transform="translate(-1000000000 0)">
    <rect x="1000000000" y="8" width="32" height="48" fill="url(#gradient)"/>
  </g>
</svg>
