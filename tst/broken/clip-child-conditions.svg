<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Expected: transparent. The renderer's language is en (D11),
       and it supports no requiredExtensions. clipChild never calls
       passesConditions, so both excluded rectangles enter the silhouette.
       SVG 2 struct.md#ConditionalProcessing applies to resource children. -->
  <defs>
    <clipPath id="clip">
      <rect x="8" y="8" width="24" height="48" systemLanguage="fr"/>
      <rect x="32" y="8" width="24" height="48" requiredExtensions="urn:unsupported"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="48" height="48" fill="lime" clip-path="url(#clip)"/>
</svg>
