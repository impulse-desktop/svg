<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32">
  <style>
    @media (resolution:calc(96dpi)) { #resolution { fill:lime } }
    @media (aspect-ratio:calc(2)) { #ratio { fill:lime } }
  </style>
  <rect id="resolution" x="8" y="8" width="16" height="16" fill="red"/>
  <rect id="ratio" x="40" y="8" width="16" height="16" fill="red"/>
</svg>
