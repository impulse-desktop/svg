name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every corpus case, check and the smoke drawing runs under ASan and
  # UBSan in five stable shards side by side (build.py -Dgroup=K
  # -Dgroup_count=N, a hash of the test's name).

  tests-asan-0:
    name: Tests ASan 0/5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/asan-shard
        with:
          shard: "0"

  tests-asan-1:
    name: Tests ASan 1/5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/asan-shard
        with:
          shard: "1"

  tests-asan-2:
    name: Tests ASan 2/5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/asan-shard
        with:
          shard: "2"

  tests-asan-3:
    name: Tests ASan 3/5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/asan-shard
        with:
          shard: "3"

  tests-asan-4:
    name: Tests ASan 4/5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/asan-shard
        with:
          shard: "4"

  fuzz:
    name: libFuzzer (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run the fuzzer
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --entrypoint sh nixos/nix:2.31.2 -c \
            'nix --extra-experimental-features "nix-command flakes" develop path:/workspace#sanitized -c svg-fuzz'

      - name: Upload the inputs that crashed the fuzzer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            .build/fuzzing/crash-*
            .build/fuzzing/timeout-*
            .build/fuzzing/oom-*
          if-no-files-found: ignore

  score:
    name: Score
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and score
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            mirror.gcr.io/library/ubuntu:26.04 sh -c '
              set -eu
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends python3 pkg-config clang lld libpng-dev wabt libsimde-dev curl ca-certificates
              rt=/usr/share/wabt/wasm2c
              version=$(wasm2c --version)
              for inc in $(grep -ho "wasm-rt[a-z-]*\.inc" "$rt"/*.c | sort -u); do
                [ -f "$rt/$inc" ] || curl -fsSL --retry 5 "https://raw.githubusercontent.com/WebAssembly/wabt/$version/wasm2c/$inc" -o "$rt/$inc"
              done
              CC=clang CXX=clang++ LDFLAGS=-fuse-ld=lld ./build -j "$(nproc)" all
              head -4 .build/all.txt > score.txt
              CC=clang CXX=clang++ LDFLAGS=-fuse-ld=lld ./build -j "$(nproc)" checks
            ' 2>&1 | tee "$RUNNER_TEMP/score.log"
          sed "s/$/  /" score.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the score report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: score
          path: .build/all.txt
          if-no-files-found: ignore

  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y --no-install-recommends clang-format-21

      - name: Format and diff
        run: |
          CLANG_FORMAT=clang-format-21 python3 dev/style.py
          git diff --exit-code
