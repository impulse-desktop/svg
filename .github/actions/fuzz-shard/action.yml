name: Run a fuzzer shard
description: Build the fuzzer with ASan and UBSan and fuzz from tst/fuzz and 1000 random SVGs under tst

inputs:
  shard:
    description: Zero-based shard index, which names the artifact of crashing inputs
    required: true

runs:
  using: composite
  steps:
    - name: Build and run the fuzzer
      # Leave time to upload inputs even when the fuzzing step times out.
      timeout-minutes: 45
      shell: bash
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
          --entrypoint sh nixos/nix:2.31.2 -c \
          'nix --extra-experimental-features "nix-command flakes" develop path:/workspace#sanitized -c svg-fuzz'

    - name: Upload the inputs that crashed the fuzzer
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crashes-${{ inputs.shard }}
        path: |
          .build/fuzzing/crash-*
          .build/fuzzing/timeout-*
          .build/fuzzing/oom-*
        if-no-files-found: ignore
