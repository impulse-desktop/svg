name: Run a fuzzer shard
description: Build the fuzzer with ASan and UBSan and fuzz from tst/fuzz and 1000 random SVGs under tst

inputs:
  shard:
    description: Zero-based shard index, which names the artifact of crashing inputs
    required: true

runs:
  using: composite
  steps:
    - name: Build and run the fuzzer
      shell: bash
      env:
        FUZZ_SHARD: ${{ inputs.shard }}
      run: |
        # Composite steps do not support timeout-minutes. Bound the process
        # instead, leaving time for the following artifact upload.
        container="svg-fuzz-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FUZZ_SHARD}"
        trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
        timeout --kill-after=30s 45m docker run --rm --name "$container" \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
          --entrypoint sh nixos/nix:2.31.2 -c \
          'nix --extra-experimental-features "nix-command flakes" develop path:.#sanitized -c svg-fuzz'

    - name: Upload fuzzer crashes and worker logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crashes-${{ inputs.shard }}
        path: |
          .build/fuzzing/crash-*
          .build/fuzzing/timeout-*
          .build/fuzzing/oom-*
          .build/fuzzing/fuzz-*.log
        if-no-files-found: ignore
